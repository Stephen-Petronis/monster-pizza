<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kitchen Windows — Salmon Pasta</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#2b1d14;color:#fff3dc;font-family:Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#3d2a1c;border-bottom:3px solid #5a3d27;flex:none}
  header button{background:#5a3d27;color:#fff3dc;border:0;border-radius:8px;font:600 14px Fredoka,sans-serif;padding:6px 10px;touch-action:manipulation}
  header #mid{flex:1;text-align:center;line-height:1.1}
  header #mid b{color:#ffcf6b;font-size:15px}
  header #mid span{display:block;font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
  #gather{flex:1;display:flex;flex-direction:column;min-height:0}
  .gbar{background:#fff3dc;color:#3a2414;padding:8px 10px 6px;flex:none}
  #gTitle{font-weight:700;font-size:17px;color:#c8401f;display:flex;justify-content:space-between;align-items:center}
  #gTitle .count{background:#e2563b;color:#fff;border-radius:999px;padding:2px 10px;font-size:15px}
  #gChips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-size:12px;padding:2px 8px;border-radius:999px;background:#f1e2c4;color:#6b4a2e}
  .chip.got{background:#3fa34d;color:#fff}
  .chip.bonus{background:#fff;border:1px dashed #c99a3a;color:#8a6420}
  .chip.bonus.got{background:#e9a21f;color:#fff;border-style:solid}
  #gcv,.win canvas{flex:1;width:100%;min-height:0;display:block;touch-action:none}
  #wins{flex:1;display:flex;flex-direction:column;gap:6px;padding:6px;min-height:0}
  .win{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#1c1c20;box-shadow:0 3px 0 #1a110b}
  .bar{background:#fff3dc;color:#3a2414;flex:none}
  .picker{display:flex;gap:3px;padding:5px 5px 0}
  .picker button{flex:1;border:0;border-radius:9px;background:#f1e2c4;padding:4px 0 3px;font:600 10px Fredoka,sans-serif;color:#6b4a2e;position:relative;touch-action:manipulation;line-height:1.1}
  .picker button i{display:block;font-style:normal;font-size:18px}
  .picker button.on{background:#e2563b;color:#fff}
  .picker button.next{box-shadow:inset 0 0 0 2px #e9a21f}
  .picker button.alert::after{content:'';position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 2px #fff3dc;animation:blink .6s infinite alternate}
  @keyframes blink{to{opacity:.3}}
  .prompt{padding:5px 10px 6px;font-weight:600;font-size:13.5px;line-height:1.2;min-height:24px}
  #tray{flex:none;background:#3d2a1c;border-top:3px solid #5a3d27;padding:4px 6px 6px}
  #holding{font-size:12.5px;padding:0 4px 3px;color:#ffcf6b;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow{display:flex;align-items:stretch;gap:4px;margin-top:3px}
  .tlab{flex:none;width:30px;font-size:8.5px;text-align:center;color:#ffcf6b;font-weight:700;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
  .tlab i{font-style:normal;font-size:16px}
  .cells{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .cells::-webkit-scrollbar{display:none}
  .cell{flex:none;width:48px;background:#5a3d27;border-radius:10px;text-align:center;padding:3px 0 2px;touch-action:manipulation;border:2px solid transparent}
  .cell.held{background:#ffcf6b;border-color:#fff}
  .cell canvas{width:34px;height:34px;display:block;margin:0 auto}
  .cell span{display:block;font-size:9px;color:#fff3dc;line-height:1.05;height:20px;overflow:hidden;padding:0 1px}
  .cell.held span{color:#3a2414}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,12,8,.72);padding:16px;z-index:10}
  .hidden{display:none!important}
  .card{background:#fff3dc;color:#3a2414;border-radius:20px;padding:20px 18px;max-width:390px;width:100%;box-shadow:0 6px 0 #c9a36b;max-height:90vh;overflow:auto}
  .card h1{margin:0 0 2px;font-size:30px;color:#c8401f}
  .card h2{margin:0 0 10px;font-size:21px;color:#c8401f}
  .card .sub{margin:0 0 14px;opacity:.75;font-size:15px}
  .bigbtn{display:block;width:100%;text-align:left;border:0;border-radius:14px;background:#ffd98a;color:#3a2414;padding:12px 14px;margin:0 0 10px;font:600 17px Fredoka,sans-serif;box-shadow:0 3px 0 #d9a945;touch-action:manipulation}
  .bigbtn small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
  .soon{font-size:13px;opacity:.75;margin-top:6px;line-height:1.35}
  .steps{list-style:none;padding:0;margin:0 0 12px;font-size:14.5px}
  .steps li{padding:5px 0;border-bottom:1px solid #ecd9b5;display:flex;gap:8px}
  .steps li b{flex:none;width:20px;text-align:center}
  .steps li.done{opacity:.5;text-decoration:line-through}
  .steps li.nxt{color:#c8401f;font-weight:700}
  .row{display:flex;gap:12px;align-items:flex-start;margin:0 0 11px;font-size:14.5px;line-height:1.35}
  .ico{flex:none;width:28px;text-align:center;font-size:21px}
  .stars{font-size:36px;color:#e9a21f;letter-spacing:4px;margin:0 0 6px;text-align:center}
  .dish{text-align:center;font-weight:700;font-size:17px;margin:0 0 12px;color:#6b3a1c}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btns button{flex:1;border:0;border-radius:12px;padding:12px 10px;font:600 16px Fredoka,sans-serif;background:#e2563b;color:#fff;box-shadow:0 3px 0 #a33a24;touch-action:manipulation}
  .btns button.alt{background:#ffd98a;color:#3a2414;box-shadow:0 3px 0 #d9a945}
  #bookArt{width:100%;height:150px;border-radius:12px;display:block;margin-bottom:10px}
  .ptime{display:inline-block;background:#ffe2a8;color:#7a4a10;font-weight:700;font-size:13.5px;padding:4px 10px;border-radius:999px;margin-bottom:8px}
  .ptext{font-size:15px;line-height:1.42;margin:0 0 10px}
  .bnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px;font-weight:600;color:#8a6420}
  .bnav button{border:0;border-radius:10px;background:#f1e2c4;color:#3a2414;font:600 15px Fredoka,sans-serif;padding:9px 14px;touch-action:manipulation}
  .bnav button:disabled{opacity:.35}
  .chefT{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 10px;color:#5a3d27}
  .chefT input{width:20px;height:20px}
  .sh{margin:14px 0 6px;color:#8a6420;font-size:15px}
  .sgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
  .srow{display:flex;align-items:center;gap:6px;background:#f1e2c4;border-radius:10px;padding:4px}
  .srow canvas{width:40px;height:40px;flex:none;border-radius:6px;background:#fff8ea}
  .srow span{flex:1;min-width:0;font-size:12px;line-height:1.1;overflow-wrap:anywhere}
  .srow button{flex:none;border:0;background:#e2563b;color:#fff;border-radius:8px;padding:5px 5px;font-size:13px;touch-action:manipulation}
  .srow button.rs{background:#8a8f95}
  .srow button.gal{background:#5a3d27}
  #edCv{width:100%;height:260px;border-radius:12px;display:block;margin-bottom:8px;touch-action:none}
  .edrow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap;font-weight:600;font-size:14px}
  .edrow input[type=range]{flex:1}
  .edrow button{flex:1;border:0;border-radius:10px;background:#f1e2c4;color:#3a2414;font:600 13px Fredoka,sans-serif;padding:8px 6px;touch-action:manipulation;white-space:nowrap}
  .edrow button.on{background:#e2563b;color:#fff}
  .snapTip{font-size:12px;color:#8a6420;margin-top:5px}
  #cadet{flex:1;display:flex;flex-direction:column;min-height:0}
  .cbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#fff3dc;color:#3a2414;padding:7px 10px}
  .cbar b{flex:1;font-size:16px;color:#c8401f}
  .cbar #cTime{font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
  .cbar button{border:0;background:#f1e2c4;border-radius:8px;font:700 14px Fredoka,sans-serif;padding:4px 9px;color:#3a2414}
  #cStats{width:100%;font-size:12.5px;font-weight:600;color:#8a6420}
  #cadetCv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
  .bigbtn:disabled{cursor:default}
  .always{background:#fff3d6;border-radius:10px;padding:8px 10px;margin:6px 0 10px;font-size:14px}
  .sh{margin:12px 0 0;font-size:16px}.whyl{font-size:13px;opacity:.75;margin:0 0 6px}
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .opt{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;border:2px solid #e6d3ae;background:#fffaf0;color:#3a2a1a;font:600 12px system-ui;min-width:0}
  .opt canvas{width:52px;height:52px}.opt span{line-height:1.1;text-align:center}.opt em{font-style:normal;font-size:10.5px;opacity:.7}
  .opt.on{border-color:#3fa34d;background:#e6f6e3;box-shadow:0 0 0 2px #3fa34d inset}.opt:disabled{opacity:.38;filter:grayscale(1)}
  .meter{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;font-weight:600}
  .meter span{width:108px;flex:none}
  .meter i{flex:1;height:12px;background:#ecd9b5;border-radius:6px;overflow:hidden;display:block}
  .meter em{display:block;height:100%;border-radius:6px}
  .meter b{width:28px;text-align:right}
  .practice{margin:4px 0 10px;background:#f6e9cf;border-radius:14px;padding:8px 10px}
  .practice summary{font-weight:700;font-size:16px;cursor:pointer;padding:4px 0}
  .practice .bigbtn{margin-top:8px}
  #toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#ffcf6b;color:#3a2414;font-weight:600;padding:9px 14px;border-radius:12px;box-shadow:0 3px 0 #c99a3a;z-index:5;max-width:92vw;text-align:center;transition:opacity .4s;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="recipeBtn">📋 Recipe</button>
    <div id="mid"><b>Ship's Come In</b><span id="sub">0:00</span></div>
    <button id="menuBtn">Menu</button>
  </header>
  <div id="gather" class="hidden">
    <div class="gbar"><div id="gTitle"></div><div id="gChips"></div></div>
    <canvas id="gcv"></canvas>
  </div>
  <div id="wins" class="hidden"></div>
  <div id="cadet" class="hidden"><div class="cbar"><b id="cTitle"></b><span id="cTime">0:00</span><button id="cQuit">✕</button><div id="cStats"></div></div><canvas id="cadetCv"></canvas></div>
  <div id="tray" class="hidden"><div id="holding"></div><div class="trow"><span class="tlab"><i>🥫</i>Food</span><div id="cellsI" class="cells"></div></div><div class="trow"><span class="tlab"><i>🔧</i>Tools</span><div id="cellsT" class="cells"></div></div></div>
</div>
<div id="toast" class="hidden"></div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 style="font-size:28px;line-height:1.1">Your Ship's Come In, Buddy</h1>
    <p class="sub">Federation Provisioner Academy. Learn to really cook, one tiny step at a time.</p>
    <button class="bigbtn" id="contBtn" style="background:#bfe3a8;box-shadow:0 3px 0 #7fa865">▶ Start career</button>
    <button class="bigbtn" id="cadetBtn">🗺️ Career map<small>Every chore and class, with your stars</small></button>
    <button class="bigbtn" id="studioBtn">📷 My Kitchen photos<small>Snap your real items & kitchen. They get cut out and dropped into the game</small></button>
    <details class="practice"><summary>🍳 Practice kitchen (free play)</summary>
      <label class="chefT"><input type="checkbox" id="chef"> Chef mode: no pasta timer, set your own</label>
      <button class="bigbtn" data-mode="1">🪟 One window<small>Flip between stations one at a time</small></button>
      <button class="bigbtn" data-mode="2">🪟🪟 Two windows<small>Two stations at once</small></button>
    </details>
  </div>
</div>
<div id="cadetMenu" class="overlay hidden"><div class="card" id="cadetCard"></div></div>
<div id="recipe" class="overlay hidden"><div class="card" id="recipeCard"></div></div>
<div id="studio" class="overlay hidden"><div class="card" id="studioCard"></div></div>
<input type="file" id="fileIn" accept="image/*" style="display:none">
<input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
<div id="editor" class="overlay hidden"><div class="card" id="editorCard"></div></div>
<div id="results" class="overlay hidden"><div class="card" id="resCard"></div></div>

<script>
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);

/* ================= audio ================= */
let AC = null, sizzleGain = null, boilGain = null;
function initAudio() {
  if (AC) { try { AC.resume(); } catch (e) {} return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const mk = (type, f, q) => {
      const s = AC.createBufferSource(); s.buffer = buf; s.loop = true;
      const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = AC.createGain(); g.gain.value = 0;
      s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(); return g;
    };
    sizzleGain = mk('highpass', 2800, 0.7); boilGain = mk('lowpass', 380, 1);
  } catch (e) { AC = null; }
}
function setGain(g, v) { if (AC && g) g.gain.setTargetAtTime(v, AC.currentTime, 0.1); }
function blip(freq = 900, dur = 0.05, vol = 0.14, type = 'square') {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  good: () => { blip(660, 0.08, 0.12, 'triangle'); setTimeout(() => blip(990, 0.1, 0.12, 'triangle'), 70); },
  meh: () => { blip(180, 0.18, 0.12, 'sawtooth'); },
  tick: () => blip(1800, 0.02, 0.05),
  click: () => blip(400, 0.06, 0.1, 'triangle'),
  knob: () => blip(160, 0.2, 0.15, 'sawtooth'),
  chop: () => blip(1600, 0.035, 0.12)
};

/* ================= draw helpers ================= */
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function label(ctx, text, x, y, size = 12, color = '#fff3dc', weight = 600) {
  ctx.font = `${weight} ${size}px Fredoka, sans-serif`; ctx.fillStyle = color;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);
}
function pulseRing(ctx, x, y, r, t) {
  ctx.strokeStyle = `rgba(255,214,110,${0.45 + 0.45 * Math.sin(t * 6)})`;
  ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, r + 6 + 3 * Math.sin(t * 6), 0, TAU); ctx.stroke();
}
function pulseRect(ctx, x, y, w, h, t) {
  ctx.strokeStyle = `rgba(255,214,110,${0.45 + 0.45 * Math.sin(t * 6)})`;
  ctx.lineWidth = 4; rr(ctx, x - 5, y - 5, w + 10, h + 10, 12); ctx.stroke();
}
function drawHint(ctx, w, text) {
  if (!text) return;
  ctx.font = '600 13.5px Fredoka, sans-serif';
  const tw = Math.min(w - 16, ctx.measureText(text).width + 22), x = (w - tw) / 2;
  ctx.fillStyle = 'rgba(255,243,220,.97)'; rr(ctx, x, 8, tw, 28, 11); ctx.fill();
  label(ctx, text, w / 2, 22, 13.5, '#a3341a');
}
function dashedCircle(ctx, x, y, r, t, col = 'rgba(255,214,110,.8)') {
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(x, y, r, t * 2, t * 2 + TAU * 0.8); ctx.stroke(); ctx.setLineDash([]);
}
function drawKnife(ctx, x, y, flat) {
  ctx.save(); ctx.translate(x, y); if (flat) ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#d9dde1'; ctx.strokeStyle = '#8f969c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-7, -74); ctx.lineTo(10, -74); ctx.lineTo(10, -16);
  ctx.quadraticCurveTo(8, 0, -7, 0); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3b2416'; rr(ctx, -6, -122, 15, 50, 5); ctx.fill();
  ctx.restore();
}

/* ================= realism: textures, lighting, user photos ================= */
function seeded(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647, (s - 1) / 2147483646); }
function makeNoise(seed) {
  const R = seeded(seed), P = new Float32Array(65536); for (let i = 0; i < 65536; i++) P[i] = R();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const g = (a, b) => P[((b & 255) << 8) | (a & 255)], sm = t => t * t * (3 - 2 * t), u = sm(xf), v = sm(yf);
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
const fbm = (n, x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * n(x * f, y * f); a *= 0.5; f *= 2; } return s; };
const mix = (a, b, t) => a + (b - a) * t;
const TEX = {};
const TEXGEN = {
  wood(x, y, n, r) { const g = fbm(n, x * 0.006, y * 0.05, 4), ring = Math.sin((y * 0.03 + g * 7) * Math.PI) * 0.5 + 0.5, f = 0.93 + r() * 0.1;
    const t = Math.pow(ring, 2.2); return [mix(214, 176, t) * f, mix(170, 124, t) * f, mix(118, 74, t) * f]; },
  walnut(x, y, n, r) { const pk = Math.floor(y / 96), tone = (pk * 37 % 7) / 7 * 0.15, g = fbm(n, x * 0.004 + pk * 13, y * 0.07, 4);
    const t = Math.pow(Math.sin((y * 0.05 + g * 9) * Math.PI) * 0.5 + 0.5, 1.6), f = (0.92 + r() * 0.1) * (1 - tone) * (y % 96 < 2 ? 0.45 : 1);
    return [mix(122, 78, t) * f, mix(80, 47, t) * f, mix(48, 27, t) * f]; },
  granite(x, y, n, r) { const m = fbm(n, x * 0.015, y * 0.015, 4), q = r(); let v = 105 + m * 55;
    if (q < 0.07) v = 38 + q * 200; else if (q > 0.95) v = 205 + q * 30; const br = q > 0.9 && q < 0.95 ? 18 : 0;
    return [v + br, v + br * 0.4, v - br * 0.3 + 4]; },
  steel(x, y, n, r) { const v = 168 + 34 * fbm(n, x * 0.0025, y * 0.9, 3) + (r() - 0.5) * 10; return [v, v + 3, v + 7]; },
  glass(x, y, n, r) { const v = 20 + 6 * fbm(n, x * 0.01, y * 0.01, 3) + (r() - 0.5) * 4; return [v, v, v + 3]; },
  tile(x, y, n, r) {
    const th = 48, tw = 96, row = Math.floor(y / th), ox = row % 2 ? 48 : 0, cx = (x + ox) % tw, cy = y % th, gr = 3;
    if (cx < gr || cy < gr) return [196, 202, 204];
    const id = Math.floor((x + ox) / tw) * 7 + row * 13, tone = (id * 9301 % 233) / 233 * 8, f = 1 + (r() - 0.5) * 0.02;
    let v = 236 - tone; if (cy < gr + 4) v += 10; if (cy > th - 5) v -= 18; if (cx < gr + 3) v += 6; if (cx > tw - 4) v -= 12;

/* ---------- Plate ---------- */
ST.plate = (() => {
  const S = { key: 'plate', name: 'Plate', icon: '🍽️', grating: false, gx: 0, gy: 0, drag: null };
  const geo = (w, h) => {
    const pr = Math.min(w * 0.2, h * 0.3), plr = Math.min(w * 0.25, h * 0.36);
    return { pan: { x: w * 0.25, y: h * 0.55, r: pr }, plate: { x: w * 0.7, y: h * 0.55, r: plr } };
  };
  const tossed = () => W.it.skillet.toss >= TAU * 3;
  S.prompt = () => {
    const P = W.plate;
    if (P.serve < 2) return tossed() ? `Drag pasta from the pan onto the plate (${P.serve}/2)` : 'Not yet! Finish the pasta in the sauce on the stove';
    if (P.cheese < 1) return 'Swipe back & forth over the plate to grate the Parmesan';
    return (W.knob.L || W.knob.R) ? 'Looks great! Now turn off the burners on the stove' : 'Buon appetito!';
  };
  S.down = (x, y, w, h) => {
    const G2 = geo(w, h), P = W.plate;
    if (P.serve < 2) {
      if (!tossed()) { hint('plate', 'The pasta isn\'t ready. Toss it in the sauce first'); return; }
      if (dist(x, y, G2.pan.x, G2.pan.y) < G2.pan.r * 1.2) S.drag = { x, y };
      else hint('plate', 'Start the drag on the pan ←');
      return;
    }
    if (P.cheese < 1 && dist(x, y, G2.plate.x, G2.plate.y) < G2.plate.r * 1.4) { S.grating = true; S.gx = x; S.gy = y; }
  };
  S.move = (x, y, w, h) => {
    if (S.drag) { S.drag = { x, y }; return; }
    if (!S.grating) return;
    const G2 = geo(w, h), P = W.plate, d = Math.abs(x - S.gx);
    P.cheese = Math.min(1, P.cheese + d / (w * 2.2)); S.gx = x; S.gy = y;
    if (Math.random() < d / 6) P.bits.push({ x: (x - G2.plate.x) / G2.plate.r + rand(-0.15, 0.15), y: (y - G2.plate.y) / G2.plate.r + rand(0, 0.4) });
    if (P.cheese >= 1) { S.grating = false; if (W.it.cheese.loc === 'tray') offTray('cheese', 'gone'); sfx.good(); }
  };
  S.up = (x, y, w, h) => {
    if (S.drag) {
      const G2 = geo(w, h), P = W.plate;
      if (dist(x, y, G2.plate.x, G2.plate.y) < G2.plate.r * 1.2) {
        P.serve++; sfx.good();
        for (let i = 0; i < 14; i++) P.strands.push({ a: rand(0, TAU), rf: rand(0, 0.5), b: rand(-1, 1) });
        if (P.serve >= 2) showToast('Now the cheese: swipe back & forth over the plate', 2400);
      } else hint('plate', 'Drop it on the plate →');
      S.drag = null;
    }
    S.grating = false;
  };
  function arrow(ctx, x1, y1, x2, y2, t) {
    const p = (t * 0.8) % 1, x = x1 + (x2 - x1) * p, y = y1 + (y2 - y1) * p - Math.sin(p * Math.PI) * 30;
    ctx.strokeStyle = 'rgba(255,214,110,.6)'; ctx.lineWidth = 4; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1 + x2) / 2, Math.min(y1, y2) - 60, x2, y2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ffd36b'; circle(ctx, x, y, 8);
  }
  S.draw = (ctx, w, h) => {
    const G2 = geo(w, h), P = W.plate, A = G2.pan, B = G2.plate, ready = tossed(), t = W.t;
    bgDraw(ctx, 'plate', w, h, 'walnut', 0.35);
    softShadow(ctx, B.x + 4, B.y + 8, B.r * 1.6, B.r * 1.4, 0.3);
    ctx.save(); rr(ctx, B.x - B.r * 1.25, B.y - B.r * 1.2, B.r * 2.5, B.r * 2.4, 14); ctx.clip(); tileTex(ctx, 'linen', B.x - B.r * 1.25, B.y - B.r * 1.2, B.r * 2.5, B.r * 2.4); ctx.restore();
    ctx.fillStyle = '#6b4a2e'; circle(ctx, A.x, A.y, A.r * 1.08);

      ctx.strokeStyle = '#eaa070'; ctx.lineWidth = 3;
      for (let i = 0; i < 8 * left; i++) { const a = i * 2.3, d = (i % 4) / 4 * A.r * 0.45; ctx.beginPath(); ctx.arc(A.x + Math.cos(a) * d, A.y + Math.sin(a) * d, A.r * 0.16, a, a + 2.2); ctx.stroke(); }
    } else if (!ready) label(ctx, 'still cooking…', A.x, A.y, 12, 'rgba(255,255,255,.6)', 600);
    label(ctx, 'pan', A.x, A.y + A.r + 14, 12, '#fff3dc', 700);
    ceramicPlate(ctx, B.x, B.y, B.r);
    if (P.serve) {
      ctx.fillStyle = '#b8402a'; circle(ctx, B.x, B.y, B.r * (0.25 + P.serve * 0.17));
      ctx.strokeStyle = '#eaa070'; ctx.lineWidth = 3;

      ctx.fillStyle = '#56782f'; for (let i = 0; i < P.serve * 6; i++) circle(ctx, B.x + Math.cos(i * 2.3) * B.r * 0.3 * ((i % 4) / 4 + 0.2), B.y + Math.sin(i * 2.3) * B.r * 0.3 * ((i % 4) / 4 + 0.2), 3);
      ctx.fillStyle = FISH === 'tunaCan' ? '#e2cfb2' : '#f4a48c'; for (let i = 0; i < P.serve * 4; i++) circle(ctx, B.x + Math.cos(i * 1.7) * B.r * 0.35 * ((i % 3) / 3 + 0.3), B.y + Math.sin(i * 1.7) * B.r * 0.35 * ((i % 3) / 3 + 0.3), 4.5);
    }
    ctx.fillStyle = '#fff7d6'; for (const b of P.bits) circle(ctx, B.x + b.x * B.r, B.y + b.y * B.r, 2);
    if (ready && P.serve < 2 && !S.drag) arrow(ctx, A.x, A.y - A.r * 0.3, B.x, B.y - B.r * 0.3, t);
    if (S.drag) {
      ctx.strokeStyle = '#eaa070'; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(S.drag.x + i * 2 - 5, S.drag.y + 6, 9 + i, 0.2, 2.6); ctx.stroke(); }

})();

/* ---------- Timers (one normal, three funky) ---------- */

  S.reset = () => {

    S.reg = { digits: '', running: false, rem: 0, press: null };
    S.mw = { mode: 'idle', digits: '', running: false, rem: 0, msg: '', msgT: 0, hum: 0, press: null };
    S.egg = { set: 0, rem: 0, f: 1, running: false, drag: false, maxW: 0, wasRunning: false, lastAng: null, lastSec: 0 };

  const inR = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  const grid = (x, y, w, h, labels, cols) => { const rows = Math.ceil(labels.length / cols), gw = w / cols, gh = h / rows; return labels.map((l, i) => ({ l, x: x + (i % cols) * gw + 2, y: y + Math.floor(i / cols) * gh + 2, w: gw - 4, h: gh - 4 })); };

  const digSec = d => { const p = d.padStart(4, '0'); return (+p.slice(0, 2)) * 60 + (+p.slice(2)); };

    const keys = grid(px, disp.y + disp.h + 6, pw, bh - (disp.h + 6) - startH - 26, ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'CLEAR', '0', 'TIMER'], 3);

  S.prompt = () => ({

    egg: S.egg.running ? 'Tick, tick, tick… (roughly)' : 'Wind it clockwise past 5 min, then back to your time',

  S.summary = () => {

        else if (m.mode === 'timer') { say('ERR'); hint('timers', 'Not START! The note says TIMER'); m.mode = 'idle'; m.digits = ''; }

    } else if (S.tab === 'egg') {

  };
  S.move = (x, y, w, h) => {

    const A = area(w, h), G2 = eggGeo(A), e = S.egg, a = Math.atan2(y - G2.cy, x - G2.cx);

/* ---------- chore 3: mystery meat ---------- */
function newSlab() {
  const g = rand(0, Math.PI);
  return { g, cuts: [], hits: 0, tents: [0, 1, 2, 3].map(i => ({ i, ph: rand(0, TAU), curl: 0, curlT: 0, angry: 0 })), nextCurl: rand(3, 5), done: false, doneT: 0 };
}
const MEAT = {
  start() { CD.m = newSlab(); CD.slabs = []; sarge('Mystery meat, fresh off the freighter. Read the grain and cut ACROSS it. Five cuts, even pieces. And watch the tentacles.', 6); },
  geo(w, h) { const A = Math.min(w * 0.36, 165), B = A * 0.62; return { cx: w / 2, cy: h * 0.4, A, B }; },
  tentBase(G2, i) {

  },
  tentPts(G2, te, t) {

    let ang = b.a + (inward - b.a + (Math.abs(inward - b.a) > Math.PI ? (inward > b.a ? -TAU : TAU) : 0)) * te.curl;
    const L = G2.A * (0.55 + te.curl * 0.9);
    for (let s = 0; s <= 1.0001; s += 1 / 14) {

  },
  inSlab(G2, x, y) { return Math.abs(x - G2.cx) < G2.A && Math.abs(y - G2.cy) < G2.B; },
  down(x, y) { if (CD.m.done) return; CD.dn = { x0: x, y0: y, x, y }; },
  move(x, y) { if (CD.dn) { CD.dn.x = x; CD.dn.y = y; } },
  up(x, y, w, h) {
    const d = CD.dn; CD.dn = null; if (!d || CD.m.done) return;
    const G2 = this.geo(w, h), M = CD.m, len = dist(d.x0, d.y0, x, y);
    if (len < 12) { // tap: shoo tentacle
      for (const te of M.tents) if (te.curl > 0.3 && this.tentPts(G2, te, CD.t).some(p => dist(p[0], p[1], x, y) < 26)) { te.curl = 0; te.curlT = 0; sfx.click(); sarge('Ha! Back, you.', 1.4, null, 'happy'); }
      return;
    }
    const mx = (d.x0 + x) / 2, my = (d.y0 + y) / 2;
    if (len < G2.B * 1.4 || !this.inSlab(G2, mx, my)) { sarge('Cut all the way across the meat, cadet.', 2.2, 'across'); return; }
    // tentacle in the way?

      const hit = pts.some(p => { const t2 = clamp(((p[0] - d.x0) * (x - d.x0) + (p[1] - d.y0) * (y - d.y0)) / (len * len), 0, 1); return dist(p[0], p[1], d.x0 + (x - d.x0) * t2, d.y0 + (y - d.y0) * t2) < 10; });
      if (hit) { M.hits++; te.curl = 0; te.curlT = 0; te.angry = 1.2; sfx.meh(); sarge("You nicked a tentacle! Don't make it angry. Shoo them off first.", 3, null, 'mad'); return; }
