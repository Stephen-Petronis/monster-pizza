function drawCanopy(t) {

  for (const b of blobs) { circ(cx + b[0], cy + b[1], r * b[2]); fs(t.c); }
  for (const b of blobs) { circ(cx + b[0] - r * .15, cy + b[1] - r * .2, r * b[2] * .45); fs(shade(t.c, 0.25)); }

function drawWorld() {
  const z = G.state === 'title' ? 1 : (G.zoom || 1);
  VY0 = anchor() - anchor() / z; VY1 = anchor() + (H - anchor()) / z;
  const top = G.camY + anchor() / z + 60, bot = G.camY - (H - anchor()) / z - 60;
  drawGround(top, bot);
  // decals
  for (const e of ents) {
    if (e.y < bot - 40 || e.y > top + 40) continue;
    if (e.t === 'crack') drawCrack(e); else if (e.t === 'puddle') drawPuddle(e); else if (e.t === 'poop') drawPoop(e);
    else if (e.t === 'wind') drawWind(e);
    else if (e.t === 'ramp') drawRamp(e);
  }
  // dog warning zones
  for (const e of ents) {
    if (e.y < bot - 80 || e.y > top + 80) continue;
    if (e.t === 'dogwalk') drawDogZone(e.dog.x, e.dog.y, CONFIG.dogReach * 0.9);
    if (e.t === 'yarddog') { drawDogZone(e.sx, e.sy, CONFIG.yardDogChain); }
    if (e.t === 'bear') drawDogZone(e.sx, e.sy, 66);
  }
  // sortable sprites
  const list = [];
  for (const e of ents) {
    if (e.y < bot - 60 || e.y > top + 60) continue;
    if (['walker', 'dogwalk', 'trash', 'hydrant', 'mailbox', 'star', 'helmet', 'yarddog', 'pigeons', 'nonno', 'subway'].includes(e.t) || EXTRA_SPRITES.includes(e.t)) list.push({ y: e.t === 'bear' ? e.dog.y : e.y, e });
    if (e.stroller) list.push({ y: e.y - 16, stroller: e });
    if (e.t === 'dogwalk') list.push({ y: e.dog.y, dog: e });
  }
  for (const t of trees) if (t.y > bot - 40 && t.y < top + 40) list.push({ y: t.y, tree: t });
  for (const c of G.cars) list.push({ y: c.y, car: c });
  for (const c of parked) if (c.y > bot - 60 && c.y < top + 60) list.push({ y: c.y, park: c });
  for (const i of inters) { for (const c of i.cars) list.push({ y: c.y, icar: c }); if (i.y > bot - 60 && i.y < top + 60) list.push({ y: i.y - 10, sig: i }); }
  if (G.state !== 'fall' && G.state !== 'face') list.push({ y: P.wy, player: true });
  // home extras: mom + balloons
  if (HOME_Y + 60 > bot && HOME_Y - 60 < top) list.push({ y: HOME_Y + 14, mom: true });
  list.sort((a, b) => b.y - a.y);
  for (const it of list) {
    if (it.player) { drawPlayer(P.x, sy(P.wy), hopH(), P.lean, P.flip && P.hopT ? (1 - P.hop / P.hopT) * Math.PI * 2 : 0); continue; }
    if (it.tree) { drawTrunk(it.tree); continue; }
    if (it.car) { const c = it.car; drawCarTop(c.x, sy(c.y), 30, 52, c.c, false, c.down ? 1 : -1, c.taxi); continue; }
    if (it.park) { drawCarTop(285, sy(it.park.y), 28, 50, it.park.c, false, -1, it.park.taxi); continue; }
    if (it.stroller) { drawStroller(it.stroller.x, sy(it.stroller.y - 16), it.stroller.sc); continue; }
    if (it.icar) { const c = it.icar; drawCarTop(c.x, sy(c.y), c.w, c.h, c.c, true, c.dir); continue; }
    if (it.sig) { drawSignalPole(it.sig); continue; }
    if (it.mom) { drawMom(); continue; }
    if (it.dog) { const e = it.dog; drawDog(e.dog.x, sy(e.dog.y), e.dog.c, e.dog.spot, e.dog.st, G.time + e.y, true); continue; }
    const e = it.e, y = sy(e.y);

      case 'dogwalk': {

        // leash
        const hx = e.x + (e.dog.x > e.x ? 9 : -9), hy = y - 13, dx = e.dog.x - 4, dy = sy(e.dog.y) - 13;
        ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.quadraticCurveTo((hx + dx) / 2, Math.max(hy, dy) + 8, dx, dy); ctx.stroke();

        break;
      }
      case 'trash': drawBags(e, y); break;
      case 'pigeons': drawPigeons(e, y); break;
      case 'nonno': drawNonno(e.x, y, e.wave); break;
      case 'subway': drawSubway(e.x, y); break;
      case 'hydrant': drawHydrant(e.x, y); break;
      case 'mailbox': drawMailbox(e.x, y); break;
      case 'star': if (!e.got) { const b = Math.sin(G.time * 5 + e.y) * 2; shadow(e.x, y, 5, 2); drawStar(e.x, y - 12 - (e.arc || 0) + b, 7.5, Math.sin(G.time * 3 + e.y) * 0.3); } break;

  vis.sort((a, b) => Math.abs(sy((b.y0 + b.y1) / 2) - cyp) - Math.abs(sy((a.y0 + a.y1) / 2) - cyp));
  for (const h of vis) drawHouse(h);

  for (const e of ents) if (e.t === 'balloon') drawBalloon(e);
  if (MODE === 'endless') { drawBridgeTall(top, bot); drawLanterns(top, bot); }
  for (const i of inters) if (i.y + CONFIG.interH > bot - 60 && i.y < top + 60) drawTrafficLight(i);
  // particles

    const a = 1 - p.t / p.life, x = p.x, y = sy(p.wy);

    else { circ(x, y, p.r); fs(p.c); }
    ctx.globalAlpha = 1;
  }
  for (const t of G.texts) { const a = 1 - t.t / 1.1; ctx.globalAlpha = Math.max(0, a); const sc = t.t < .12 ? t.t / .12 : 1; bubbleText(t.txt, t.x, sy(t.wy), t.size * (0.6 + 0.4 * sc), t.col); ctx.globalAlpha = 1; }
}

    bubbleText('Eat each neighborhood’s SNACK', W / 2, top + 404, 15, '#7ee8c4', 'center', INK, 4);

// ---------- wire states, buttons & keys ----------
const _onButtonV4 = onButton;
onButton = function (b) {
  if (b === 'howNext') { howNext(); return; }
  if (b === 'howSkip') { howGo(); return; }
  if (b === 'shopPrev') { sfx('click'); G.shop.page = (G.shop.page + SHOP_PAGES.length - 1) % SHOP_PAGES.length; return; }
  if (b === 'shopNext') { sfx('click'); G.shop.page = (G.shop.page + 1) % SHOP_PAGES.length; return; }
  if (b === 'shopLeave') { sfx('click'); leaveShop(); return; }
  if (/^buy\d$/.test(b)) { shopBuy(+b[3]); return; }
  return _onButtonV4(b);
};
window.addEventListener('keydown', e => {
  if (G.state === 'howto' && ['Space', 'Enter', 'ArrowRight'].includes(e.code)) howNext();
  else if (G.state === 'shop') { if (e.code === 'Escape' || e.code === 'Enter') leaveShop(); else if (e.code === 'ArrowRight') onButton('shopNext'); else if (e.code === 'ArrowLeft') onButton('shopPrev'); else if (/^Digit[123]$/.test(e.code)) shopBuy(+e.code[5] - 1); }
});

// ---------- upgrades & powers hooked into the ride ----------
const _crashV4 = crash;
crash = function (reason, big) {
  if (G.state !== 'ride') return _crashV4(reason, big);
  if (P.powerT > 0) {                                    // snack power: smash through everything
    if (!G.smashT || G.time - G.smashT > 0.4) { G.smashT = G.time; floatText(['BOOM!', 'POW!', 'ZOOM!', 'WHAM!'][Math.floor(Math.random() * 4)], P.x, P.wy + 50, '#ffe066', 18); sfx('bonk'); burst(P.x, P.wy + 10, 10, POWER_COL[P.power] || POWER_COL.sparkle, 150, 'star'); }
    return false;
  }
  if (P.inv > 0) return false;
  if (reason === 'crack' && (P.wheels || 0) >= 2) { sfx('bump'); P.bump = 0.25; G.shake = 4; P.speed *= 0.85; floatText('MONSTER WHEELS!', P.x, P.wy + 44, '#ff595e', 13); return false; }
  if ((P.pads || 0) > 0 && ['crack', 'rock', 'poop', 'trash', 'hydrant', 'mailbox', 'tree'].includes(reason)) {
    P.pads--; P.inv = 1.2; P.speed *= 0.5; G.shake = 6; sfx('bonk');
    floatText('PADS SAVE!', P.x, P.wy + 50, '#4d96ff', 18); floatText(`${P.pads} left`, P.x, P.wy + 30, '#ffffff', 12); return true;
  }
  if ((P.helmetHP || 0) > 0) P.helmet = true;
  const before = P.helmet, r = _crashV4(reason, big);
  if (before && !P.helmet && P.helmetHP > 0) { P.helmetHP--; P.helmet = P.helmetHP > 0; if (P.helmetHP > 0) floatText(`${P.helmetHP} helmet saves left`, P.x, P.wy + 22, '#ffffff', 12); }
  return r;
};
const _addDirtV4 = addDirt;
addDirt = function (n, x, wy) { if (P.flaps) { n = Math.floor(n / 2); if (n <= 0) { floatText('MUD FLAPS!', x + 26, wy + 20, '#ffffff', 12); return; } } return _addDirtV4(n, x, wy); };
const _updateRideV4 = updateRide;
updateRide = function (dt) {
  _updateRideV4(dt);
  if (G.state !== 'ride') return;
  powerTick(dt);
  if (P.magnet) for (const e of ents) if (e.t === 'star' && !e.got) { const dx = P.x - e.x, dy = P.wy - e.y, d = Math.hypot(dx, dy); if (d < 90 && d > 1) { e.x += dx / d * 260 * dt; e.y += dy / d * 260 * dt; } }
};
function throwBiscuit(e, d) {
  d.calm = true; P.biscuits--; sfx('click');
  floatText(e.t === 'bear' ? 'Snack for the bear!' : 'Good doggy!', d.x, d.y + 40, '#ffe066', 15); floatText('♥', d.x, d.y + 22, '#ff6b9a', 18);
  for (let i = 0; i < 6; i++) G.parts.push({ x: P.x, wy: P.wy + 10, vx: (d.x - P.x) * 2 + (Math.random() - .5) * 40, vy: -(d.y - P.wy) * 2, life: .5, t: 0, c: '#d9a066', r: 2.5, kind: 'dot' });
}

  });
  const ty = y + 22 + rows * rowH + 10;
  ctx.strokeStyle = '#e6dcef'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(36, ty - 14); ctx.lineTo(W - 36, ty - 14); ctx.stroke();
  bubbleText('SCORE', 72, ty + 4, 17, '#ff6b9a', 'center', INK, 4);
  bubbleText(fmtN(running), W - 92, ty + 4, 27, '#ffe066', 'center', INK, 6);
  const by = y + cardH + 20;
  const tallyDone = t > 0.35 + rows * 0.32 + 0.4;
  if (tallyDone) {
    if (G.newBest) { const s = 1 + Math.sin(t * 8) * 0.06; ctx.save(); ctx.translate(W / 2, by); ctx.scale(s, s); bubbleText('NEW HIGH SCORE!', 0, 0, 23, '#ff6b9a', 'center', INK, 5); ctx.restore(); }
    else bubbleText(MODE === 'level' && G.carHit ? 'Make it home to set a high score!' : `High score: ${fmtN(HS[MODE] ? HS[MODE].score : 0)}`, W / 2, by, 15, '#ffffff', 'center', INK, 4);
  }
  if (tallyDone && canPost()) {
    const tEnd = 0.35 + rows * 0.32 + 0.4;
    if (G.wantIni && !G.iniAsked && t > tEnd + 0.7) { G.iniAsked = true; openInitials(); }
    const rk = myRank(MODE), msg = { saving: 'Posting score…', saved: rk ? `Posted! You're #${rk} on the board` : 'Posted to high scores!', local: rk ? `Saved! #${rk} on this device's board` : 'Saved on this device', noperm: 'Saved here (ask for Contributor access to post online)', notop: 'Beat the top 10 to get on the board!' }[G.posted];
    if (G.wantIni && !G.savedLocal && G.iniAsked) drawButton('post', 'ADD MY INITIALS', null, W / 2, H - 140, 220, 40, '#c77dff', 16);
    else if (msg) bubbleText(msg, W / 2, H - 140, 14, '#ffffff', 'center', INK, 4);
    else if (G.wantIni && !G.iniAsked) bubbleText('TOP 10! Get ready to sign in…', W / 2, H - 140, 14, '#ffe066', 'center', INK, 4);
  }
  if (t > 1.0) {
    drawButton('again', 'RIDE AGAIN', null, W / 2, H - 86, 210, 50, '#ff6b9a', 22, 0.03);
    drawButton('menu', 'MENU', null, W / 2, H - 34, 130, 36, '#7ee8c4', 16);
  }
}

function drawReady() {
  ctx.fillStyle = 'rgba(59,42,82,.3)'; ctx.fillRect(0, 0, W, H);
  const y0 = H * 0.2;
  if (MODE === 'level') {
    bubbleText('LEVEL 1', W / 2, y0, 24, '#ffffff', 'center', INK, 6);
    bubbleText('Home From School', W / 2, y0 + 36, 30, '#ffe066', 'center', INK, 7);
    bubbleText('Carroll Gardens, Brooklyn', W / 2, y0 + 68, 15, '#ffffff', 'center', INK, 4);
  } else {
    bubbleText('ENDLESS RIDE', W / 2, y0 + 10, 32, '#ff6b9a', 'center', INK, 7);
    bubbleText('How far can you go?', W / 2, y0 + 46, 17, '#ffffff', 'center', INK, 4);
  }
  const cy = y0 + 96;
  rr(24, cy, W - 48, 122, 20); fso('rgba(255,255,255,.95)', 3);
  ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const lines = MODE === 'level'
    ? [['👆', 'Drag left / right to steer'], ['⬆️', 'Push up = faster · pull back = slower'], ['✨', 'Quick TAP to hop over cracks'], ['✋', 'Pull back all the way to STOP at corners']]
    : [['🗽', 'Ride from Brooklyn into the city…'], ['🦷', 'Game over when your teeth run out'], ['✋', 'Stop at corners! Cars = game over'], ['💩', 'Getting dirty = more points!']];
  lines.forEach((l, i) => { ctx.font = `16px sans-serif`; ctx.fillText(l[0], 40, cy + 22 + i * 26); ctx.font = `600 14px ${FONT}`; ctx.fillText(l[1], 66, cy + 23 + i * 26); });
  const p = 0.7 + Math.sin(G.t * 5) * 0.3;
  ctx.globalAlpha = p; bubbleText('tap or drag to go!', W / 2, cy + 152, 18, '#ffffff', 'center', INK, 4); ctx.globalAlpha = 1;
}

function drawTitle() {
  const t = G.titleT;
  G.camY = 300 + (t * 50) % 3000; G.time = t;
  drawWorld();
  ctx.fillStyle = 'rgba(158,240,255,.5)'; ctx.fillRect(0, 0, W, H);
  const ly = Math.max(70, H * 0.12), bob = Math.sin(t * 2.5) * 4;
  ctx.save(); ctx.translate(W / 2, ly + bob); ctx.rotate(-0.05);
  bubbleText('JASPER', 0, -24, 56, '#ffe066', 'center', INK, 10);
  bubbleText('CHOW', 0, 30, 62, '#ff6b9a', 'center', INK, 10);
  ctx.restore();
  rr(W / 2 - 96, ly + 66, 192, 28, 14); fso('#36cfc9', 3);
  bubbleText('SCOOTER HOME', W / 2, ly + 81, 17, '#ffffff', 'center', INK, 4);
  bubbleText('Carroll Gardens, Brooklyn', W / 2, ly + 110, 14, '#ffe066', 'center', INK, 4);
  const bLvl = H - 160, bEnd = H - 98, bOpt = H - 40;
  // Jasper hero art
  const ptop = ly + 124, avail = bLvl - 34 - ptop;
  if (HERO_IMG.complete && HERO_IMG.naturalWidth) {
    const hh = clamp(avail, 80, 420), hw = hh * HERO_IMG.naturalWidth / HERO_IMG.naturalHeight, bobH = Math.abs(Math.sin(t * 3)) * 5;
    ell(W / 2, ptop + hh - 4, hw * 0.42, 9); fs('rgba(59,42,82,.22)');
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(W / 2, ptop + hh / 2 - bobH); ctx.rotate(Math.sin(t * 2) * 0.025);
    ctx.drawImage(HERO_IMG, -hw / 2, -hh / 2, hw, hh); ctx.restore();
  }
  drawButton('level', 'LEVEL 1', `Home From School${HS.level ? ' · Best ' + fmtN(HS.level.score) : ''}`, W / 2, bLvl, 260, 54, '#ffb703', 21, 0.02);
  drawButton('endless', 'ENDLESS RIDE', `Brooklyn to the woods & beyond${HS.endless ? ' · Best ' + fmtN(HS.endless.score) : ''}`, W / 2, bEnd, 260, 54, '#ff6b9a', 21);
  drawButton('options', 'OPTIONS', null, W / 2 - 72, bOpt, 132, 38, '#36cfc9', 16);
  drawButton('scores', 'HIGH SCORES', null, W / 2 + 72, bOpt, 132, 38, '#c77dff', 15);
  drawMute();
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  G.buttons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#8fd8ff'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (OX > 2) {
    ctx.fillStyle = '#aee6ff';
    for (let y = 0; y < cv.height; y += 40 * DPR) for (let x = ((y / (40 * DPR)) % 2) * 20 * DPR; x < cv.width; x += 40 * DPR) { ctx.beginPath(); ctx.arc(x, y, 6 * DPR, 0, 7); ctx.fill(); }
  }
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * OX, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (G.state === 'title') drawTitle();
  else if (G.state === 'options') drawOptions();
  else if (G.state === 'party') drawParty();
  else if (G.state === 'initials') drawInitials();
  else if (G.state === 'board') drawBoard();
  else if (G.state === 'face') drawFaceScreen();
  else if (G.state === 'end') drawEnd();
  else {
    ctx.save();
    if (G.shake > 0) ctx.translate((Math.random() - .5) * G.shake, (Math.random() - .5) * G.shake);
    const z = G.zoom || 1; if (z !== 1) { ctx.translate(W / 2, anchor()); ctx.scale(z, z); ctx.translate(-W / 2, -anchor()); }
    drawWorld();
    ctx.restore();
    drawZoneOverlay();
    drawHUD();
    if (G.state === 'ready') drawReady();
    if (G.state === 'howto') drawHowTo();
    if (G.state === 'shop') { G.buttons = []; drawShop(); }
    if (G.state === 'partyIntro') drawPartyIntro();
    if (G.state === 'paused') { G.buttons = []; drawPause(); }
  }
  ctx.restore();
  requestAnimationFrame(frame);
}

G.state = 'title';
buildLevel();
Object.assign(P, { x: 188, tx: 188, wy: 0, speed: 0, thr: 0, vx: 0, hop: 0, inv: 0, slip: 0, wet: 0, stink: 0, bump: 0, helmet: false, teeth: 20, missing: new Array(20).fill(false), stars: 0, lean: 0, wheel: 0, dirt: 0 });
requestAnimationFrame(frame);
// debug hooks for testing
window.__JC = { G, P, CONFIG, resetGame };
</script>
