<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whack-A-Ghost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Limelight&family=Alfa+Slab+One&display=swap">
<style>
html,body{margin:0}
/* Layout: one full-bleed canvas. Default style is a 1930s rubber-hose cartoon (inked, watercolor, film grain); an 8-bit style renders at NES resolution with palette dithering. DOM menus are vaudeville title cards (cartoon) or NES dialog boxes (8-bit). */
:root{
  --black:#000000;
  --white:#fcfcfc;
  --orange:#e45c10;
  --amber:#f8b800;
  --red:#a81000;
  --purple:#6844fc;
  --lav:#d8b8f8;
  --green:#58d854;
  --teal:#00e8d8;
  --pink:#f85898;
  --fp:'Press Start 2P','Courier New',monospace;
  --fs:'Alfa Slab One',Rockwell,Georgia,serif;
  --fl:'Limelight','Didot',Georgia,serif;
  --cream:#f4e6c2;
  --sepia:#1a1008;
  --tred:#c8261c;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--white)}
body{font-family:var(--fp);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;touch-action:none;image-rendering:pixelated}
#probe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.hudbtns{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.hudbtns button{width:42px;height:42px;border-radius:0;border:3px solid var(--white);background:var(--black);color:var(--white);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;padding:0;box-shadow:4px 4px 0 var(--purple)}
.hudbtns button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--purple)}
.hudbtns svg{width:18px;height:18px;shape-rendering:crispEdges}
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(0,0,0,.5)}
.card{position:relative;width:100%;max-width:440px;margin:auto;text-align:center;background:var(--black);
  border:4px solid var(--white);box-shadow:0 0 0 4px var(--black),0 0 0 8px var(--purple),12px 12px 0 8px rgba(0,0,0,.6);
  padding:28px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.card::before{content:"";position:absolute;inset:6px;border:2px solid var(--lav);pointer-events:none}
.eyebrow{margin:0;font-size:10px;line-height:1.6;letter-spacing:.08em;color:var(--green)}
h1,h2{margin:0;font-family:var(--fp);font-weight:400;color:var(--amber);line-height:1.3;text-wrap:balance;text-shadow:4px 4px 0 var(--red),7px 7px 0 var(--black)}
h1{font-size:clamp(24px,7.6vw,40px)}
h2{font-size:clamp(22px,6.6vw,32px)}
h1 .g{color:var(--white);text-shadow:4px 4px 0 var(--purple),7px 7px 0 var(--black)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.legend li{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:8px;line-height:1.7;min-width:0}
.legend canvas{width:72px;height:72px;image-rendering:pixelated}
.legend .bad{color:var(--pink)}
.how{margin:0;font-size:10px;line-height:2;color:var(--lav);max-width:32ch}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
button.big,button.alt{font-family:var(--fp);border-radius:0;cursor:pointer;touch-action:manipulation}
button.big{font-size:16px;padding:14px 28px;background:var(--orange);color:var(--black);border:4px solid var(--white);box-shadow:6px 6px 0 var(--purple)}
button.big:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--purple)}
button.alt{font-size:10px;padding:10px 14px;background:var(--black);color:var(--teal);border:3px solid var(--teal)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.best{margin:0;font-size:10px;line-height:1.9;color:var(--amber)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stats div{border:3px solid var(--white);padding:12px 6px;display:flex;flex-direction:column;gap:8px}
.stats b{display:block;font-weight:400;font-size:16px;color:var(--amber);font-variant-numeric:tabular-nums}
.stats span{font-size:8px;color:var(--lav)}
.newbest{margin:0;font-size:10px;color:var(--green)}
@media (prefers-reduced-motion:reduce){.blink{animation:none}button.big:active{transform:none}}
/* ---- 1930s cartoon style ---- */
body.toon{font-family:var(--fs)}
body.toon .screen{background:radial-gradient(ellipse at center,rgba(40,20,0,.15),rgba(20,10,0,.78))}
body.toon .card{background:var(--cream);color:var(--sepia);border:5px solid var(--sepia);border-radius:26px;
  box-shadow:0 0 0 7px var(--cream),0 0 0 11px var(--sepia),12px 16px 0 11px rgba(0,0,0,.45);padding:32px 22px 26px}
body.toon .card::before{inset:10px;border:2px solid var(--tred);border-radius:16px}
body.toon .eyebrow{font-family:var(--fs);color:var(--tred);font-size:12px;letter-spacing:.22em}
body.toon h1,body.toon h2{font-family:var(--fl);color:var(--tred);letter-spacing:.02em;line-height:1.05;
  text-shadow:2px 2px 0 var(--sepia),4px 4px 0 var(--sepia),6px 6px 0 rgba(26,16,8,.35)}
body.toon h1{font-size:clamp(40px,12vw,64px)}
body.toon h2{font-size:clamp(36px,10vw,52px)}
body.toon h1 .g{color:var(--sepia);text-shadow:2px 2px 0 var(--tred),4px 4px 0 var(--tred)}
body.toon .legend li{font-family:var(--fs);font-size:11px;letter-spacing:.04em;color:var(--sepia)}
body.toon .legend .bad{color:var(--tred)}
body.toon .legend canvas{image-rendering:auto}
body.toon .how{font-family:var(--fs);font-size:13px;line-height:1.55;color:#4a3520}
body.toon button.big{font-family:var(--fs);font-size:24px;letter-spacing:.06em;background:var(--tred);color:#fbf0d4;border:4px solid var(--sepia);border-radius:999px;box-shadow:0 7px 0 var(--sepia)}
body.toon button.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sepia)}
body.toon button.alt{font-family:var(--fs);font-size:13px;letter-spacing:.06em;color:var(--sepia);background:transparent;border:3px solid var(--sepia);border-radius:999px}
body.toon .best{font-family:var(--fs);font-size:13px;color:#8a5a10}
body.toon .stats div{border:3px solid var(--sepia);border-radius:16px}
body.toon .stats b{font-family:var(--fs);font-size:24px;color:var(--tred)}
body.toon .stats span{font-family:var(--fs);font-size:11px;color:#4a3520}
body.toon .newbest{font-family:var(--fs);color:#2f7a3a}
body.toon .hudbtns button{border-radius:50%;background:var(--cream);color:var(--sepia);border:3px solid var(--sepia);box-shadow:0 4px 0 var(--sepia)}
body.toon .hudbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sepia)}
body.bw{--tred:#5a3a22}
body.bw .card{background:#efe5cf}
body.bw .legend canvas{filter:grayscale(1) sepia(.35)}
body.bw .hudbtns button{background:#f3e9d2}
</style>
</head>
<body>
<canvas id="game" aria-label="Whack-A-Ghost game field"></canvas>
<div id="probe"></div>

<div class="hudbtns" id="hudbtns" hidden>
  <button id="btnMute" aria-label="Turn sound off"></button>
  <button id="btnPause" aria-label="Pause"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/></svg></button>
</div>

<section class="screen" id="scrTitle">
  <div class="card">
    <p class="eyebrow">MONSTER PIZZA ARCADE</p>
    <h1>WHACK-A-<span class="g">GHOST</span></h1>
    <ul class="legend">
      <li><canvas data-icon="ghost" width="144" height="144"></canvas>POP GHOSTS</li>
      <li><canvas data-icon="cat" width="144" height="144"></canvas><span class="bad">NO KITTIES</span></li>
      <li><canvas data-icon="heart" width="144" height="144"></canvas>GRAB HEARTS</li>
    </ul>
    <p class="how">Slow ghosts fly at you. Keep a streak for fireworks. Boss every 3 rounds!</p>
    <div class="btns">
      <button class="big" id="btnPlay"><span class="blink">▶</span> PLAY</button>
      <button class="alt" id="btnFilmT">STYLE: CARTOON B&amp;W</button>
    </div>
    <p class="best">HI-SCORE <span id="bestTitle">0</span></p>
  </div>
</section>

<section class="screen" id="scrPause" hidden>
  <div class="card">
    <h2>PAUSED</h2>
    <div class="btns">
      <button class="big" id="btnResume">RESUME</button>
      <button class="alt" id="btnFilmP">STYLE: CARTOON B&amp;W</button>
      <button class="alt" id="btnRestart">START OVER</button>
      <button class="alt" id="btnQuit">MAIN MENU</button>
    </div>
  </div>
</section>

<section class="screen" id="scrOver" hidden>
  <div class="card">
    <p class="eyebrow">THE GHOSTS GOT YOU</p>
    <h2>GAME OVER</h2>
    <div class="stats">
      <div><b id="ovScore">0</b><span>SCORE</span></div>
      <div><b id="ovRound">1</b><span>ROUND</span></div>
    </div>
    <p class="newbest" id="ovNew" hidden>NEW HI-SCORE!</p>
    <p class="best">HI-SCORE <span id="ovBest">0</span><br>BEST STREAK <span id="ovStreak">0</span></p>
    <div class="btns">
      <button class="big" id="btnAgain">PLAY AGAIN</button>
      <button class="alt" id="btnMenu">MAIN MENU</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

/* ============ CONFIG: tune the game here ============ */
const CONFIG = {
  startHearts: 3, maxHearts: 6,
  roundsPerBoss: 3,
  baseGoal: 8, goalPerRound: 2,          // ghosts to pop per round

  upTime:     [1.7, 0.08, 0.65],         // seconds a ghost waits before flying at you
  spawnGap:   [1.0, 0.06, 0.32],         // seconds between pop-ups
  flyTime:    [2.7, 0.09, 1.25],         // seconds for a flying ghost to reach you
  maxUp:      [2, 0.5, 8],               // max things up at once
  catChance:  [0.14, 0.012, 0.3],
  heartChance: 0.06,
  riseHeight: { ghost: 1.45, cat: 1.5, heart: 2.3 },   // how high pop-ups rise out of the pumpkin
  patchFrontY: 0.7,                    // front row of pumpkins sits this far down the screen (0 = top, 1 = bottom)
  // adaptive difficulty: after each round, speed jumps more the better you played
  adapt: { minStep: 0.5, maxStep: 2.6, streakBump: 0.15, hitRelief: 0.4, bossStep: 0.6, maxLevel: 30 },
  // where flying things aim: high, middle or low lanes across the screen, with curvy paths
  flight: { lanes: [[0.0, 0.28], [0.36, 0.62], [0.72, 1.0]], curve: [0.35, 0.08, 1.0] },
  pumpkinsStart: 5, pumpkinsMax: 12,     // +1 pumpkin after every boss
  zippyFrom: 4, chunkyFrom: 7,           // rounds new ghost types appear
  points: { basic:100, zippy:150, chunky:250, flyer:75, heart:50, roundClear:250, boss:2000 },
  streak: { multEvery: 10, maxMult: 5, milestoneEvery: 5,
            words: { 5:'NICE!', 10:'SPOOKY!', 15:'BOO-TIFUL!', 20:'FANG-TASTIC!', 25:'WITCHY!', 30:'GHOSTBUSTER!' }, bigWord: 'LEGENDARY!' },
  lightningEvery: [9, 18], musicVolume: 0.45,
  // your soundtrack: an MP3 next to the game. If it's missing, the built-in chiptune plays instead.
  sounds: { music: 'sounds/music.mp3', musicVolume: 0.6, bossSpeed: 1.06 },
  cartoonResolution: 1.5,
  // black & white cartoon keeps just a few spot colors: red, light orange, dark orange, yellow
  // faded hand-tinted color creeping in from the screen edges, like old colorized film worn down over time
  edgeColor: { on: false, strength: 0.9, saturation: 0.62, reach: 0.5 },
  // a faint memory of hand-tinting: pumpkins (strongest at their rims) and grass barely keep their color
  colorHint: { on: true, pumpkin: 0.4, grass: 0.28, saturation: 0.6 },
  // old film: grain, burned corners, flicker, and scratch lines that wander back and forth
  film: { grain: 0.32, burn: 0.85, flicker: 0.1, scratches: 2 },
  // hand-drawn feel: animate "on twos" (choppy like real film), hand-inked line boil, soft-focus painted backgrounds
  handDrawn: { fps: 24, boil: 1.3, boilFps: 10, bgBlur: 1.6, brush: true },
  spotColor: { on: false, colors: [[204, 44, 34], [238, 132, 38], [178, 76, 22], [242, 198, 66]] },
  // your art: transparent PNGs, character standing on the bottom edge of the image; missing files fall back to drawn art
  art: { ghost: 'art/ghost.png', ghostAngry: 'art/ghost-angry.png', cat: 'art/cat.png', catHit: 'art/cat-hit.png',
         heart: 'art/heart.png', pumpkin: 'art/pumpkin.png', pumpkinLit: 'art/pumpkin-lit.png' },              // cartoon style detail (1 = fastest, 2 = sharpest on retina screens)
  bosses: {
    // depth: 0 = far back at the end of the hall, 1 = right in front of you
    eyeball: { size:0.36, eyes:5, reopen:3.4, hitsNeeded:3, spitEvery:3.2, speed:70, depth:[0.3, 0.6] },
    king:    { hp:10, throwEvery:1.6, minThrow:0.7, missileTime:3.3, returnSpeed:1.6, returnDamage:1, depth:0.08 },
    bubble:  { hp:1000, spitEvery:1.6,
               stages:[{d:0.06, time:4.5, pts:1}, {d:0.45, time:3.5, pts:2}, {d:0.86, time:4, pts:3}, {d:0.45, time:3, pts:2}],
               zones:3, maxZones:7, zoneTaps:3, zoneDamage:3, comboWindow:1.2, comboMax:10 },
  },
};

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t*t*(3 - 2*t);
const dec = (a, r) => Math.max(a[2], a[0] - a[1] * (r - 1));
const inc = (a, r) => Math.min(a[2], a[0] + a[1] * (r - 1));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const FONT_PIX = '"Press Start 2P", "Courier New", monospace', FONT_TOON = '"Alfa Slab One", Rockwell, Georgia, serif';
let FD = FONT_TOON, FH = FD;

const cv = $('game'), ctx = cv.getContext('2d'), mainCtx = ctx;
const LO = document.createElement('canvas'), lctx = LO.getContext('2d', { willReadFrequently: true });
let PX = 2, PU = 2, LW = 1, LH = 1;
// look: 'cartoon' (1930s ink + watercolor + film grain), 'pixel' (NES 8-bit), 'film' (8-bit black & white)
const STYLES = ['toonbw', 'cartoon', 'pixel', 'film'], STYLE_NAMES = { toonbw: 'CARTOON B&W', cartoon: 'CARTOON COLOR', pixel: '8-BIT', film: '8-BIT FILM' };
let STYLE = 'toonbw'; try { const v = localStorage.getItem('wag.style'); if (STYLES.includes(v)) STYLE = v; } catch(e){}
const TOON = () => STYLE === 'cartoon' || STYLE === 'toonbw';
const BW = () => STYLE === 'toonbw';
const FGC = document.createElement('canvas'), fctx = FGC.getContext('2d', { willReadFrequently: true });
// four flat inked tones for characters, and a soft low-contrast ramp for painted backgrounds
// four sepia ink tones for characters...
const INKS = [[24, 18, 12], [88, 74, 58], [172, 158, 132], [243, 233, 210]];
const POSTER = (() => { const l = new Uint8Array(256); for (let v = 0; v < 256; v++) l[v] = v < 52 ? 0 : v < 118 ? 1 : v < 188 ? 2 : 3; return l; })();
// ...plus a little spot color (about 5% of the screen): red, two oranges, yellow. Everything else stays black and white.
const SPOT = CONFIG.spotColor;
function spotOf(r, g, b, minSat){
  const mx = r > g ? (r > b ? r : b) : (g > b ? g : b), mn = r < g ? (r < b ? r : b) : (g < b ? g : b), dd = mx - mn;
  if (mx < 90 || dd < mx*minSat) return -1;
  let hh = mx === r ? 60*((g - b)/dd) : mx === g ? 60*((b - r)/dd + 2) : 60*((r - g)/dd + 4);
  if (hh < 0) hh += 360;
  if (hh >= 300 || hh < 14) return 0;
  if (hh < 42) return (r*77 + g*151 + b*28 >> 8) > 140 ? 1 : 2;
  if (hh < 68) return 3;
  return -1;
}
// edge mask: 0 in the middle, rising toward the edges in blotchy, watercolor-like patches
let EDGE = null;
function buildEdge(w, h){
  const E = CONFIG.edgeColor; EDGE = new Uint8Array(w*h);
  if (!E.on) return;
  const sc = 1/Math.max(1, Math.min(w, h)/300);
  for (let y = 0, i = 0; y < h; y++) {
    const ny = (y/h - 0.5)*2;
    for (let x = 0; x < w; x++, i++) {
      const nx = (x/w - 0.5)*2;
      const d = Math.sqrt(nx*nx*0.85 + ny*ny*0.95);
      const n = 0.16*Math.sin(x*0.031*sc + 1.3)*Math.sin(y*0.023*sc + 0.4) + 0.1*Math.sin((x*0.06 - y*0.045)*sc + 2.1) + 0.06*Math.sin((x + y)*0.11*sc);
      let v = (d + n - E.reach)/(1.2 - E.reach); v = v < 0 ? 0 : v > 1 ? 1 : v*v*(3 - 2*v);
      EDGE[i] = Math.round(v*E.strength*255);
    }
  }
}
// how much of the original color survives: only orange (pumpkins) and green (grass, stems)
function hintOf(r, g, b){
  const H = CONFIG.colorHint; if (!H.on) return 0;
  const mx = r > g ? (r > b ? r : b) : (g > b ? g : b), mn = r < g ? (r < b ? r : b) : (g < b ? g : b), dd = mx - mn;
  if (mx < 40 || dd < mx*0.35) return 0;
  let hh = mx === r ? 60*((g - b)/dd) : mx === g ? 60*((b - r)/dd + 2) : 60*((r - g)/dd + 4);
  if (hh < 0) hh += 360;
  const sat = dd/mx, L = (r*77 + g*151 + b*28) >> 8;
  if (hh >= 10 && hh < 48) return H.pumpkin*Math.min(1, (sat - 0.35)*2.2)*(L < 150 ? 1 : 0.45);   // darker rims hold the most color
  if (hh >= 80 && hh < 170) return H.grass*Math.min(1, (sat - 0.35)*2.2);
  return 0;
}
function edgeTint(out, r, g, b, f, k = CONFIG.edgeColor.saturation){
  // blend toward a faded, warm version of the original color
  const L = (r*77 + g*151 + b*28) >> 8;
  const fr = Math.min(255, (L + (r - L)*k)*1.04 + 6), fg = L + (g - L)*k, fb = (L + (b - L)*k)*0.86;
  out[0] += (fr - out[0])*f; out[1] += (fg - out[1])*f; out[2] += (fb - out[2])*f;
}
const BGTONE = (() => { const l = new Uint8Array(256); for (let v = 0; v < 256; v++) l[v] = Math.round(66 + 142*Math.pow(v/255, 0.72)); return l; })();
const TMP = [0, 0, 0];
let ROWDX = null, COLDY = null, boilFrame = -1, OUTBUF = null;
function boilField(w, h){
  // smooth hand-jitter: each row slides a little sideways and each column a little up/down, re-rolled ~10x a second
  const A = CONFIG.handDrawn.boil;
  if (!ROWDX || ROWDX.length !== h) ROWDX = new Int8Array(h);
  if (!COLDY || COLDY.length !== w) COLDY = new Int8Array(w);
  const p1 = Math.random()*TAU, p2 = Math.random()*TAU, p3 = Math.random()*TAU, p4 = Math.random()*TAU, f1 = rand(0.05, 0.09), f2 = rand(0.11, 0.17);
  for (let y = 0; y < h; y++) ROWDX[y] = Math.round(A*(0.7*Math.sin(y*f1 + p1) + 0.45*Math.sin(y*f2 + p2)));
  for (let x = 0; x < w; x++) COLDY[x] = Math.round(A*(0.7*Math.sin(x*f1*0.9 + p3) + 0.45*Math.sin(x*f2*1.1 + p4)));
}
function posterBW(c2, w, h){
  const src = c2.getImageData(0, 0, w, h), sd = src.data;
  if (!OUTBUF || OUTBUF.width !== w || OUTBUF.height !== h) OUTBUF = c2.createImageData(w, h);
  const d = OUTBUF.data, useSpot = SPOT.on, boilOn = CONFIG.handDrawn.boil > 0 && !reduced;
  const bf = Math.floor(G.time*CONFIG.handDrawn.boilFps);
  if (boilOn && (bf !== boilFrame || !ROWDX || ROWDX.length !== h)) { boilField(w, h); boilFrame = bf; }
  for (let y = 0, i = 0; y < h; y++) {
    const rdx = boilOn ? ROWDX[y] : 0;
    for (let x = 0; x < w; x++, i += 4) {
      let si = i;
      if (boilOn) { const sx = x + rdx, sy = y + COLDY[x]; si = (sx < 0 || sy < 0 || sx >= w || sy >= h) ? -1 : (sy*w + sx)*4; }
      if (si < 0 || sd[si + 3] < 110) { d[i + 3] = 0; continue; }
      const r = sd[si], g = sd[si + 1], b = sd[si + 2];
      posterPix(d, i, r, g, b, useSpot);
    }

  const g = c.createLinearGradient(x - s*0.5, 0, x + s*0.5, 0); g.addColorStop(0, '#a99ad0'); g.addColorStop(1, '#6f5f9e');
  c.fillStyle = g; c.strokeStyle = P.plum; c.lineWidth = Math.max(1.2, s*0.06);
  c.beginPath(); c.moveTo(x - s*0.45, y); c.lineTo(x - s*0.45, y - s*0.8); c.arc(x, y - s*0.8, s*0.45, Math.PI, 0); c.lineTo(x + s*0.45, y); c.closePath(); c.fill(); ink(c);
  c.fillStyle = P.plum; c.font = `${Math.max(6, s*0.24)}px ${FD}`; c.textAlign = 'center'; c.fillText('RIP', x, y - s*0.68);
  c.strokeStyle = 'rgba(61,21,89,.6)'; c.lineWidth = Math.max(1, s*0.03); c.beginPath(); c.moveTo(x + s*0.2, y - s*1.1); c.lineTo(x + s*0.1, y - s*0.95); c.lineTo(x + s*0.22, y - s*0.85); c.stroke();
  c.fillStyle = '#5ccf6e'; ellipse(c, x - s*0.3, y - s*0.05, s*0.2, s*0.08); c.fill();
  if (r() < 0.6) blossom(c, x + s*0.4, y - s*0.08, s*0.1, '#ffb8df');
}

function moonPos(){ return { x: W*0.78, y: Math.max(SAFE.t + 130, HZ*0.36), r: clamp(U*0.08, 28, 74) }; }

function drawHills(c, r){
  const hill = (base, amp, col, edge, seed) => {
    const rr = seeded(seed); const a1 = rr()*TAU, a2 = rr()*TAU;
    const yAt = x => base - Math.sin(x/W*3.1 + a1)*amp - Math.sin(x/W*7.3 + a2)*amp*0.35;
    c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 8) c.lineTo(x, yAt(x) + Math.sin(x*0.7)*0.8);
    c.lineTo(W, H); c.closePath(); c.fill();
    c.strokeStyle = edge; c.lineWidth = 3; c.beginPath();
    for (let x = 0; x <= W + 10; x += 8) x ? c.lineTo(x, yAt(x)) : c.moveTo(x, yAt(x));
    ink(c);
    // hand-drawn hatching under the ridge
    c.strokeStyle = 'rgba(20,6,40,.25)'; c.lineWidth = 1.2;
    for (let x = 6; x < W; x += 11) { const y = yAt(x) + 6 + rr()*4; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 5, y + 9); c.stroke(); }
    return yAt;
  };
  const far = hill(HZ - 16, H*0.035, '#2a1d58', '#6a58b0', 3);
  // tiny graveyard on the far hill
  for (let i = 0; i < 7; i++) { const x = W*(0.3 + r()*0.4); drawTomb(c, x, far(x) + 4, clamp(U*0.025, 7, 16), r); }
  for (let i = 0; i < 6; i++) { const x = r()*W; spiral(c, x, far(x) + 8, 7, 1.3, r() < 0.5 ? 1 : -1, 2, 'rgba(170,150,240,.6)'); }
  return hill(HZ + 2, H*0.02, '#1b4a3e', '#5fc092', 9);
}
function buildBG(){
  BG = document.createElement('canvas');
  const c = toLayer(BG);
  const r = seeded(42), m = U;
  drawSky(c);
  const near = drawHills(c, r);

  const tree = (x, y, len, ang, w, d) => {

    const x2 = x + Math.cos(ang)*len, y2 = y + Math.sin(ang)*len;
    c.strokeStyle = '#22103d'; c.lineWidth = w; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo((x+x2)/2 + (r()-0.5)*len*0.4, (y+y2)/2, x2, y2); c.stroke();
    tree(x2, y2, len*0.7, ang - rand(0.3,0.6), w*0.66, d-1);

    c.fillRect(x - s*0.3, y + s*0.25, s*0.6, s*0.12);
  }

  const gr = c.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, '#1d5a3c'); gr.addColorStop(0.5, '#0f3e40'); gr.addColorStop(1, '#061a20');
  c.fillStyle = gr; c.beginPath(); c.moveTo(0, HZ + 8);
  for (let x = 0; x <= W; x += 8) c.lineTo(x, near(x) + 6);
  c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  c.save(); c.beginPath(); c.rect(0, HZ + 6, W, H); c.clip();
  const vx = W/2, vy = HZ - H*0.08;
  for (let i = -8; i <= 8; i += 2) {
    const x1 = W/2 + i*W*0.16, x2 = W/2 + (i + 1)*W*0.16;
    c.fillStyle = 'rgba(200,170,255,.045)'; c.beginPath(); c.moveTo(vx, vy);
    c.lineTo(vx + (x1 - vx)*3, H*1.5); c.lineTo(vx + (x2 - vx)*3, H*1.5); c.closePath(); c.fill();
  }
  c.strokeStyle = 'rgba(20,50,40,.35)'; c.lineWidth = 2;
  for (let i = 1; i < 10; i++) { const y = depthY(i/10); c.beginPath(); c.moveTo(0, y); c.quadraticCurveTo(W/2, y + 5*depthS(i/10), W, y); c.stroke(); }
  // grass tick marks, like pen strokes
  c.strokeStyle = 'rgba(150,240,180,.25)'; c.lineWidth = 1.3;
  for (let i = 0; i < 160; i++) { const d = r(), x = r()*W, y = depthY(d), s = depthS(d)*6; c.beginPath(); c.moveTo(x, y); c.lineTo(x - s*0.3, y - s); c.moveTo(x + s*0.4, y); c.lineTo(x + s*0.5, y - s*0.9); c.stroke(); }
  c.restore();

  for (let i = 0; i < 6; i++) {
    const d = 0.2 + r()*0.8, y = depthY(d), s = depthS(d);
    const pts = []; for (let x = -20; x <= W + 40; x += 60*s + 20) pts.push([x, y + (r() - 0.5)*24*s]);
    curlyVine(c, pts, Math.max(2, 4*s), 'rgba(40,120,70,.9)', r);
    pts.forEach(([x, yy], k) => {
      if (k % 2) spiral(c, x, yy - 10*s, 9*s, 1.4, k % 4 ? 1 : -1, Math.max(1.5, 2.4*s), 'rgba(120,220,150,.9)');
      leaf(c, x + 10*s, yy, 18*s, -0.8 + r()*0.6, '#4fc07e', '#2a7a4a');

    });
  }
  // field clutter, back to front: mushrooms (fairy rings), candies, blossoms, mini pumpkins, tiny tombstones
  const items = [];
  for (let i = 0; i < 36; i++) items.push({ d: 0.06 + r()*0.94, x: r()*W, k: r() });
  items.sort((a, b) => a.d - b.d).forEach(it => {
    const y = depthY(it.d), s = depthS(it.d)*clamp(m*0.035, 10, 26), x = it.x;
    c.fillStyle = 'rgba(30,10,50,.25)'; ellipse(c, x, y + s*0.35, s*1.1, s*0.25); c.fill();
    if (it.k < 0.28) {
      const ring = it.k < 0.12 ? 3 : 1;
      for (let q = 0; q < ring; q++) {
        const qx = x + (q - (ring - 1)/2)*s*1.1, qy = y - (q % 2)*s*0.25, qs = s*(ring > 1 ? 0.7 : 1);
        const gl = c.createRadialGradient(qx, qy - qs*0.5, 0, qx, qy - qs*0.5, qs*2); gl.addColorStop(0, 'rgba(200,150,255,.35)'); gl.addColorStop(1, 'rgba(200,150,255,0)');
        c.fillStyle = gl; c.fillRect(qx - qs*2, qy - qs*2.5, qs*4, qs*4);
        c.fillStyle = '#fff4e6'; c.fillRect(qx - qs*0.18, qy - qs*0.5, qs*0.36, qs*0.85);
        c.fillStyle = (it.k*100 + q) % 2 < 1 ? '#b06cff' : '#ff6fae'; c.strokeStyle = P.plum; c.lineWidth = Math.max(1, qs*0.08);
        c.beginPath(); c.arc(qx, qy - qs*0.45, qs*0.65, Math.PI, 0); c.closePath(); c.fill(); ink(c);
        c.fillStyle = '#fff'; [[-0.3,-0.75,0.1],[0.2,-0.85,0.12],[0.42,-0.55,0.08]].forEach(([dx,dy,rr]) => { ellipse(c, qx + dx*qs, qy + dy*qs, rr*qs, rr*qs); c.fill(); });
      }
    } else if (it.k < 0.42) {
      const col = it.k < 0.35 ? '#8ff0c4' : '#ffb8df';
      c.save(); c.translate(x, y - s*0.2); c.rotate(-0.4);
      c.fillStyle = col; c.strokeStyle = P.plum; c.lineWidth = Math.max(1, s*0.07);
      [-1, 1].forEach(sd => { c.beginPath(); c.moveTo(sd*s*0.35, 0); c.lineTo(sd*s*0.8, -s*0.3); c.lineTo(sd*s*0.8, s*0.3); c.closePath(); c.fill(); c.stroke(); });

      c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, s*0.08); c.beginPath(); c.moveTo(-s*0.15, -s*0.25); c.lineTo(s*0.1, s*0.25); c.stroke();
      c.restore();
    } else if (it.k < 0.66) {
      for (let j = 0; j < 3; j++) blossom(c, x + (j - 1)*s*0.55, y - s*0.25 - (j % 2)*s*0.3, s*0.3, j % 2 ? '#d7c0ff' : '#ffb8df');
      leaf(c, x - s*0.2, y, s*0.7, Math.PI + 0.4, '#4fc07e', '#2a7a4a'); leaf(c, x + s*0.2, y, s*0.7, -0.4, '#4fc07e', '#2a7a4a');
    } else if (it.k < 0.82) {
      c.fillStyle = '#ff9a3c'; c.strokeStyle = P.plum; c.lineWidth = Math.max(1, s*0.07);
      ellipse(c, x, y - s*0.15, s*0.6, s*0.45); c.fill(); ink(c);
      c.strokeStyle = 'rgba(122,42,10,.5)'; c.beginPath(); c.moveTo(x, y - s*0.58); c.lineTo(x, y + s*0.28); c.stroke();
      c.fillStyle = '#5ccf6e'; c.fillRect(x - s*0.06, y - s*0.75, s*0.12, s*0.2);
      sparkle(c, x - s*0.3, y - s*0.35, s*0.12, 'rgba(255,255,255,.8)');
    } else {
      drawTomb(c, x, y, s*1.1, r);

  });
  const corner = (x, y, dir) => {
    const s = clamp(m*0.09, 34, 80);

    spiral(c, x + dir*s*1.4, y - s*0.25, s*0.3, 1.5, -dir, Math.max(2, s*0.06), 'rgba(255,224,102,.75)');

/* ============ background: the boss hall ============ */
function buildArena(){
  ARENA = document.createElement('canvas');
  const c = toLayer(ARENA);
  const r = seeded(77);
  // dark lawn around the hall
  const gr = c.createLinearGradient(0, HZ - 4, 0, H);
  gr.addColorStop(0, '#3a2466'); gr.addColorStop(0.3, '#24164a'); gr.addColorStop(1, '#140a2c');
  c.fillStyle = gr; c.fillRect(0, HZ - 2, W, H - HZ + 2);
  // tiled floor receding to the far end
  const rows = 26, cols = 8;
  for (let k = 0; k < rows; k++) {
    const d0 = k/rows*1.25, d1 = (k + 1)/rows*1.25;
    const y0 = depthY(d0), y1 = depthY(d1);
    if (y0 > H) break;
    for (let j = 0; j < cols; j++) {
      const a0 = -1 + 2*j/cols, a1 = -1 + 2*(j + 1)/cols;
      c.fillStyle = (j + k) % 2 ? '#5a3a96' : '#2f7a63';
      c.beginPath(); c.moveTo(W/2 + hallW(d0)*a0, y0); c.lineTo(W/2 + hallW(d0)*a1, y0); c.lineTo(W/2 + hallW(d1)*a1, y1); c.lineTo(W/2 + hallW(d1)*a0, y1); c.closePath(); c.fill();
    }
  }
  // tile grout + carpet runner
  c.strokeStyle = 'rgba(20,6,40,.45)'; c.lineWidth = 1.2;
  for (let j = 0; j <= cols; j++) { const a = -1 + 2*j/cols; c.beginPath(); for (let k = 0; k <= 30; k++) { const d = k/30*1.25; const x = W/2 + hallW(d)*a, y = depthY(d); k ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); }
  c.fillStyle = 'rgba(176,108,255,.32)';
  c.beginPath(); for (let k = 0; k <= 30; k++) { const d = k/30*1.25; c.lineTo(W/2 - hallW(d)*0.28, depthY(d)); } for (let k = 30; k >= 0; k--) { const d = k/30*1.25; c.lineTo(W/2 + hallW(d)*0.28, depthY(d)); } c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,224,102,.55)'; c.lineWidth = 2;
  [-0.28, 0.28].forEach(a => { c.beginPath(); for (let k = 0; k <= 30; k++) { const d = k/30*1.25; const x = W/2 + hallW(d)*a, y = depthY(d); k ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); });
  // fog at the far end
  const fog = c.createLinearGradient(0, HZ, 0, depthY(0.35));
  fog.addColorStop(0, 'rgba(150,255,170,.35)'); fog.addColorStop(1, 'rgba(150,255,170,0)');
  c.fillStyle = fog; c.fillRect(0, HZ - 4, W, depthY(0.35) - HZ + 4);
  // graveyard along both sides
  const stones = [];
  for (let i = 0; i < 18; i++) { const d = 0.05 + r()*1.0, s = r() < 0.5 ? -1 : 1; stones.push({ d, s, off: 1.15 + r()*0.6 }); }
  stones.sort((a, b) => a.d - b.d).forEach(st => {
    const x = W/2 + st.s*hallW(st.d)*st.off, y = depthY(st.d), sz = depthS(st.d)*clamp(U*0.07, 20, 52);
    if (x < -sz || x > W + sz) return;
    drawTomb(c, x, y, sz, r);
    if (r() < 0.5) { c.fillStyle = '#fff4e6'; c.fillRect(x + sz*0.55, y - sz*0.32, sz*0.12, sz*0.3); }
  });
  if (TOON()) { paintWash(c, 23); if (CONFIG.handDrawn.brush) brushStrokes(c, 29); softFocus(c, CONFIG.handDrawn.bgBlur); }
  addGrain(c, W, H, 0.09);
  if (BW()) toneBG(c);
}
function drawArch(c, d, t, alpha){
  const y = depthY(d), half = hallW(d), pw = Math.max(3, half*0.14), top = archTop(d);
  const spring = top + (half + pw)*1.05;
  const lw = Math.max(1.2, pw*0.12);
  c.save(); c.globalAlpha *= alpha;
  const stone = (x0, x1) => { const g = c.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, '#4a2c80'); g.addColorStop(0.45, '#8a66c4'); g.addColorStop(1, '#3a1e66'); return g; };
  c.strokeStyle = P.plum; c.lineWidth = lw;
  [-1, 1].forEach(s => {
    const x0 = W/2 + s*half, x1 = x0 + s*pw, lo = Math.min(x0, x1), hiX = Math.max(x0, x1);
    const ptop = Math.max(spring, -20);
    c.fillStyle = stone(lo, hiX); c.beginPath(); c.rect(lo, ptop, pw, y - ptop); c.fill(); ink(c);
    // capital + base
    c.fillStyle = '#9b7ad8'; c.beginPath(); c.rect(lo - pw*0.2, y - pw*0.35, pw*1.4, pw*0.35); c.fill(); ink(c);

    // ivy

/* ============ pumpkin patch layout ============ */
const ROWS = {5:[2,3],6:[3,3],7:[3,4],8:[4,4],9:[4,5],10:[3,3,4],11:[3,4,4],12:[4,4,4]};
const pumpkinsFor = r => Math.min(CONFIG.pumpkinsMax, CONFIG.pumpkinsStart + Math.floor((r - 1) / CONFIG.roundsPerBoss));
function layoutHoles(n, keep){
  const rows = ROWS[n] || ROWS[5], R = rows.length;
  const dFront = 0.93, dBack = R === 2 ? 0.5 : 0.36;
  const Rb = Math.min(W*0.12, H*0.085);
  const old = G.holes, holes = [];
  let idx = 0;
  rows.forEach((cnt, k) => {
    const d = R === 1 ? dFront : lerp(dBack, dFront, k/(R - 1));
    // squeeze the patch up toward the middle of the screen so it's easier to reach
    const yFrontRaw = depthY(dFront), yFront = Math.min(yFrontRaw, H*CONFIG.patchFrontY);
    const y = HZ + (depthY(d) - HZ) * (yFront - HZ) / (yFrontRaw - HZ), sc = depthS(d);
    const spread = Math.min(W*0.94, H*1.1) * lerp(0.62, 1, clamp((d - 0.3)/0.65, 0, 1));
    const sp = spread / Math.max(cnt, 3);
    const r = Math.min(sp*0.38, Rb*sc);
    for (let i = 0; i < cnt; i++) {
      const o = keep && old[idx];
      holes.push({ x: W/2 + (i - (cnt - 1)/2)*sp, y, r, d, row: k, idx,
        pop: o ? o.pop : null, cd: o ? o.cd : 0, carved: o ? o.carved : false, seed: o ? o.seed : Math.random()*10 });
      idx++;
    }
  });
  G.holes = holes;
  applyCarving(false);
}
function applyCarving(fx){
  const n = G.holes.length;
  G.holes.forEach(h => {
    const should = ((h.idx * 7 + 3) % n) < G.carved;
    if (should && !h.carved && fx) burst(h.x, h.y, P.glow, 10, 160);
    h.carved = should;
  });
}

/* ============ particles & juice ============ */
const BURST_COLS = [P.mint, P.lilac, P.pink, P.gold];
function burst(x, y, color, n=12, spd=220){
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd*0.4, spd);
    G.parts.push({ kind: i % 3 ? 'dot' : 'star', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.7, max: 0.7, size: rand(3, 8),
      color: i % 2 ? color : BURST_COLS[i % 4] });
  }
  G.parts.push({ kind:'ring', x, y, life: 0.35, max: 0.35, size: 12, color });
}
function floatText(x, y, text, color=P.gold, size=18){
  G.parts.push({ kind:'text', x, y, vx: 0, vy: -70, life: 0.9, max: 0.9, text, color, size });
}
function pow(x, y){ G.parts.push({ kind:'pow', x, y, life: 0.2, max: 0.2, size: 24 }); }
function hype(text){ G.hype = { text, t: 0, dur: 1.4 }; }
function launchFlares(n){
  for (let i = 0; i < n; i++) {
    G.flares.push({ x: W*rand(0.12, 0.88), y: H + 10, vy: -rand(H*0.9, H*1.25), ty: rand(SAFE.t + 110, HZ*0.95),

  }

}
function lightning(){
  const x0 = W*rand(0.15, 0.85), pts = [[x0, -10]];
  let x = x0, y = -10; const yEnd = HZ - rand(0, 30);
  while (y < yEnd) { y += rand(18, 38); x += rand(-26, 26); pts.push([x, Math.min(y, yEnd)]); }
  const br = []; const bi = 2 + (Math.random()*(pts.length - 3) | 0);
  let bx = pts[bi][0], by = pts[bi][1]; br.push([bx, by]);
  for (let k = 0; k < 4; k++) { bx += rand(-30, 30); by += rand(16, 30); br.push([bx, by]); }
  G.bolt = { pts, br, life: 0.45 }; G.lflash = 0.35;
  SFX.thunder();
}
function batSwarm(n=10){
  const dir = Math.random() < 0.5 ? 1 : -1;
  for (let i = 0; i < n; i++) BATS.push({ temp: true, dir, x: dir > 0 ? -40 - i*28 : W + 40 + i*28, y: rand(SAFE.t + 90, HZ*0.9), v: rand(220, 340), wait: 0, p: Math.random()*TAU, s: rand(0.8, 1.4) });

function addStreak(x, y){
  G.streak++; G.streakPulse = 0.3;
  if (G.streak > G.bestStreak) G.bestStreak = G.streak;
  const S = CONFIG.streak;
  if (G.streak % S.multEvery === 0 && streakMult() > 1) floatText(x, y - 40, `x${streakMult()} SCORE!`, P.mint, 24);
  if (G.streak % S.milestoneEvery === 0) {
    hype(S.words[G.streak] || S.bigWord);
    launchFlares(Math.min(7, 2 + Math.floor(G.streak/5)));
    wispSwarm(Math.min(10, 3 + Math.floor(G.streak/5)));
    if (G.streak >= 10) lightning();
    if (G.streak >= 15) batSwarm(8 + Math.floor(G.streak/5));
    if (G.streak >= 10) G.chorus = { t: 0, dur: 2.6 };
    if (G.phase === 'round') G.level = Math.min(CONFIG.adapt.maxLevel, G.level + CONFIG.adapt.streakBump);

/* ============ drop-in art: put PNGs in an art/ folder next to this file and they replace the drawn characters ============ */
const ART = {};
function loadArt(){

function artDraw(c, key, x, y, w, h, flash){
  const img = ART[key]; if (!img) return false;

/* ============ characters ============ */
function drawPumpkin(c, x, y, r, carved, t, seed, angry){
  if (!angry && artDraw(c, carved && ART.pumpkinLit ? 'pumpkinLit' : 'pumpkin', x, y - r*0.2, r*2.6, r*2.3, false)) return;
  ellipse(c, x, y + r*0.84, r*1.25, r*0.24); c.fillStyle = 'rgba(30,10,50,.35)'; c.fill();
  const w = r*1.2, h = r*0.92, lw = Math.max(1.5, r*0.06);
  const g = c.createRadialGradient(x - r*0.35, y - r*0.45, r*0.1, x, y, r*1.35);
  g.addColorStop(0, '#ffc679'); g.addColorStop(0.55, '#ff8a2a'); g.addColorStop(1, '#d9531a');
  c.strokeStyle = P.plum; c.lineWidth = lw;

  lobe(-w*0.5, w*0.5, h*0.92); lobe(w*0.5, w*0.5, h*0.92);
  lobe(-w*0.26, w*0.5, h*0.98); lobe(w*0.26, w*0.5, h*0.98);
  lobe(0, w*0.48, h);
  // hatch shading on the lower right

  c.strokeStyle = 'rgba(122,30,10,.28)'; c.lineWidth = Math.max(1, r*0.03);
  for (let k = 0; k < 6; k++) { const hx = x + r*0.2 + k*r*0.13; c.beginPath(); c.moveTo(hx, y + r*0.9); c.lineTo(hx + r*0.35, y + r*0.3); c.stroke(); }
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.55)'; ellipse(c, x - r*0.42, y - r*0.5, r*0.2, r*0.11, -0.5); c.fill();
  sparkle(c, x + r*0.55, y - r*0.55, r*0.12, 'rgba(255,255,255,.8)');
  c.fillStyle = '#5ccf6e'; c.strokeStyle = '#1f6b4a'; c.lineWidth = lw*0.8;
  c.beginPath(); c.moveTo(x - r*0.12, y - h*0.86); c.quadraticCurveTo(x - r*0.16, y - h*1.3, x + r*0.12, y - h*1.38);
  c.lineTo(x + r*0.18, y - h*1.22); c.quadraticCurveTo(x + r*0.08, y - h*1.12, x + r*0.12, y - h*0.86); c.closePath(); c.fill(); ink(c);

  spiral(c, x - r*0.32, y - h*1.12, r*0.16, 1.4, -1, Math.max(1.2, r*0.04), '#2a8a52');
  if (carved) {
    const fl = 0.75 + 0.25 * Math.sin(t*9 + seed) * Math.sin(t*3.3 + seed*2);

      c.beginPath();
      if (angry) { c.moveTo(ex - s*r*0.26, ey - r*0.16); c.lineTo(ex + s*r*0.22, ey + r*0.02); c.lineTo(ex - s*r*0.12, ey + r*0.17); }
      else { c.moveTo(ex, ey - r*0.22); c.lineTo(ex + r*0.21, ey + r*0.15); c.lineTo(ex - r*0.21, ey + r*0.15); }

    c.beginPath(); c.moveTo(x - gw, gy);

      c.lineTo(x - gw*0.22, gy + r*0.5); c.lineTo(x - gw*0.22, gy + r*0.18); c.lineTo(x - gw*0.42, gy + r*0.18); c.lineTo(x - gw*0.42, gy + r*0.46); c.quadraticCurveTo(x - gw*0.85, gy + r*0.4, x - gw, gy); }
    c.closePath(); c.fill(); c.stroke();

    c.beginPath(); c.arc(x, y + r*0.06, r*0.08, 0.15*Math.PI, 0.85*Math.PI); c.stroke();

  }

const GHOST_COL = { basic:'#f7f0ff', zippy:'#b8f7dc', chunky:'#d9c2ff' };

  c.strokeStyle = '#000'; c.lineWidth = Math.max(1, rx*0.22); ellipse(c, x, y, rx*1.2, ry*1.12); c.stroke();

function drawGhost(c, x, y, h, g, t, angry, hurt, seed=0){
  const col = GHOST_COL[g] || GHOST_COL.basic;
  const R = h*0.36, cy = y - h*0.5 + R, bot = y + h*0.44;
  if (artDraw(c, angry && ART.ghostAngry ? 'ghostAngry' : 'ghost', x, y, h*1.2, h*1.15, hurt > 0)) { if (g === 'chunky') drawWitchHat(c, x + R*0.15, cy - R*0.8, R, 0); return; }

  for (let i = 0; i < sc; i++) { const off = Math.sin(t*6 + i*1.7 + seed)*h*0.025, x1 = rx - (i + 1)*span/sc; c.quadraticCurveTo(rx - (i + 0.5)*span/sc, bot + h*0.1 + off, x1, bot - (i < sc - 1 ? h*0.012 : 0)); }
  c.bezierCurveTo(x - R*1.08 + sw, bot - h*0.16, x - R*1.02, cy + R*0.9, x - R, cy);

  else { const gr = c.createLinearGradient(0, y - h*0.5, 0, bot); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, col); c.fillStyle = gr; }

// will-o'-wisp: a flickering spirit flame whose tail streams behind it
const WISP_RGB = { '#9ff7c9': '150,255,200', '#a8e6ff': '160,225,255', '#c9a3ff': '200,165,255' };
function drawWisp(c, f, t){
  const rgb = WISP_RGB[f.col] || WISP_RGB['#9ff7c9'];
  const vx = f.x - (f.px ?? f.x), vy = f.y - (f.py ?? f.y);
  f.px = f.x; f.py = f.y;
  const ang = Math.atan2(vy, vx) + Math.PI, sp = Math.min(1, Math.hypot(vx, vy)/3);
  const fl = 1 + Math.sin(t*17 + f.p)*0.12 + Math.sin(t*29 + f.p*2)*0.08;
  const s = (f.temp ? 9 : 7.5)*fl;
  const glow = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, s*4);
  glow.addColorStop(0, `rgba(${rgb},.55)`); glow.addColorStop(0.4, `rgba(${rgb},.18)`); glow.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = glow; c.fillRect(f.x - s*4, f.y - s*4, s*8, s*8);
  c.save(); c.translate(f.x, f.y); c.rotate(ang);
  const tail = s*(2.2 + sp*2.5) + Math.sin(t*12 + f.p)*s*0.4;
  const wob = Math.sin(t*9 + f.p)*s*0.5;
  c.fillStyle = `rgba(${rgb},.55)`;

  c.fillStyle = `rgba(${rgb},.9)`;
  c.beginPath(); c.moveTo(0, -s*0.6); c.quadraticCurveTo(tail*0.35, -s*0.4 + wob*0.5, tail*0.6, wob*0.4); c.quadraticCurveTo(tail*0.35, s*0.4 + wob*0.5, 0, s*0.6); c.arc(0, 0, s*0.6, Math.PI/2, Math.PI*1.5); c.closePath(); c.fill();
  c.restore();
  c.fillStyle = '#f4fff8'; ellipse(c, f.x, f.y, s*0.38, s*0.38); c.fill();
}

/* ============ poppers (things in pumpkins) ============ */
function popSize(h, p){
  if (p.type === 'cat') return h.r*1.75;
  if (p.type === 'heart') return h.r*1.3;
  return h.r*(p.g === 'chunky' ? 2.0 : p.g === 'zippy' ? 1.55 : 1.75);
}
function popCenter(h, p){
  const s = popSize(h, p);
  const k = CONFIG.riseHeight[p.type] || 1.45;
  const y = h.y + s*0.3 - p.rise*s*k + (p.phase === 'up' ? Math.sin(G.time*3 + p.seed)*s*0.04 : 0);
  let x = h.x;
  if (p.type === 'ghost' && p.phase === 'up' && p.up - p.t < 0.45) x += Math.sin(G.time*60)*h.r*0.06;
  return { x, y, s };
}
function pickGhost(r){
  const roll = Math.random();
  if (r >= CONFIG.chunkyFrom) return roll < 0.45 ? 'basic' : roll < 0.75 ? 'zippy' : 'chunky';
  if (r >= CONFIG.zippyFrom) return roll < 0.6 ? 'basic' : 'zippy';
  return 'basic';
}
function spawn(){
  const free = G.holes.filter(h => !h.pop && h.cd <= 0);
  if (!free.length) return;
  const h = free[Math.random()*free.length | 0];
  const r = G.level, roll = Math.random();
  let type = 'ghost';
  if (G.mode === 'play') {
    if (roll < CONFIG.heartChance && G.hearts < CONFIG.maxHearts) type = 'heart';
    else if (roll < CONFIG.heartChance + inc(CONFIG.catChance, r)) type = 'cat';
  }
  const g = type === 'ghost' ? pickGhost(Math.max(G.round, Math.floor(G.level))) : null;
  let up = dec(CONFIG.upTime, r);
  if (g === 'zippy') up *= 0.6;
  if (type === 'cat') up *= 1.1;
  if (type === 'heart') up *= 0.85;
  h.pop = { type, g, rise: 0, phase: 'rise', t: 0, up, hp: g === 'chunky' ? 2 : 1, hurt: 0, hit: false, seed: Math.random()*10 };
}
// pick an end point in a high, middle or low lane, plus a bend point so paths curve
function flightPath(x0, y0, end){
  const F = CONFIG.flight, top = SAFE.t + 150, bot = H - SAFE.b - 50 - end*0.4;
  const lane = F.lanes[Math.random()*F.lanes.length | 0];
  const tx = W*rand(0.14, 0.86), ty = lerp(top, Math.max(top + 40, bot), rand(lane[0], lane[1]));
  const k = clamp(F.curve[0] + F.curve[1]*(G.level - 1), 0, F.curve[2]);
  return { tx, ty, cx: (x0 + tx)/2 + rand(-1, 1)*W*0.35*k, cy: (y0 + ty)/2 + rand(-1, 1)*H*0.14*k };
}
function launchGhost(h, p){
  const c = popCenter(h, p), grow = 3.6 * (1 - h.d*0.4);
  G.flyers.push(Object.assign({ kind:'ghost', g: p.g, was: p.was, x0: c.x, y0: c.y, x: c.x, y: c.y, dir: 1,
    z: 0, dur: dec(CONFIG.flyTime, G.level) * (p.g === 'zippy' ? 0.8 : 1), base: c.s, s: c.s, grow, hp: p.hp, hurt: 0, seed: p.seed }, flightPath(c.x, c.y, c.s*(1 + grow))));
  SFX.whoosh();
}
function addFlyer(kind, x, y, o={}){
  const scale = clamp(U/500, 0.8, 1.6);
  const base = (o.base || 24) * scale, grow = o.grow || 4;
  G.flyers.push(Object.assign({ kind, x0: x, y0: y, x, y, z: 0, dir: 1, dur: o.dur || 2.4,
    base, s: base, grow, hp: 1, hurt: 0, seed: Math.random()*10 }, flightPath(x, y, base*(1 + grow))));
}

/* ============ flow ============ */
function setHUD(on){ $('hudbtns').hidden = !on; }
function banner(text, sub, dur, then){ G.banner = { text, sub, t: 0, dur, then }; }

function newGame(){
  Object.assign(G, { mode: 'play', paused: false, round: 1, score: 0, shown: 0, hearts: CONFIG.startHearts, popped: 0,
    flyers: [], parts: [], flares: [], boss: null, banner: null, hype: null, shake: 0, flash: 0, carved: 0, streak: 0, bestStreak: 0, env: 0, level: 1, lastPerf: 0.5 });
  G.holes = []; layoutHoles(pumpkinsFor(1), false);
  ['scrTitle', 'scrOver', 'scrPause'].forEach(id => $(id).hidden = true);

function startRound(r){

  G.goal = CONFIG.baseGoal + CONFIG.goalPerRound*(r - 1);
  const n = pumpkinsFor(r);
  const more = n !== G.holes.length;
  if (more) layoutHoles(n, false);
  const newCarved = Math.min(n, Math.floor((r - 1) * 1.5));
  if (newCarved !== G.carved) { G.carved = newCarved; applyCarving(true); SFX.carve(); }
  let sub = `Pop ${G.goal} ghosts`;
  if (r === 1) sub = 'Pop the ghosts. Skip the kitties!';
  else if (r === CONFIG.zippyFrom) sub = 'Mint ghosts are zippy!';
  else if (r === CONFIG.chunkyFrom) sub = 'Witch ghosts take 2 bops!';
  else if (more) sub = 'More pumpkins!';

}
function clearField(puff){

}
function rate(rs){

  // speed: how quickly ghosts get popped (0 = the instant they appear, 1 = just before they fly, more if they got away)
  const total = rs.pump + rs.fly, avg = total ? rs.react/total : 1.3;
  const speed = clamp(1 - avg/1.1, 0, 1), acc = total/Math.max(1, total + rs.miss);

}
function roundClear(){

/* ============ bosses ============ */
function makeBoss(idx, tier){
  if (idx === 0) {
    const C = CONFIG.bosses.eyeball, n = Math.min(8, C.eyes + tier);
    return { kind:'eyeball', name:'The Eyeball Blob', tier, x: W/2, d: (C.depth[0] + C.depth[1])/2, y: 0, R: 1, vx: 0.8, vd: 0.4, dirT: 2,
      eyes: Array.from({length: n}, (_, i) => ({ a: -Math.PI/2 + i/n*TAU, open: true, t: 0, pulse: 0 })),
      hits: 0, need: C.hitsNeeded, reopen: Math.max(1.6, C.reopen - tier*0.5), spitT: 2.5,
      spitEvery: Math.max(1.3, C.spitEvery - tier*0.5), speed: C.speed + tier*25, hurt: 0, t: 0, nag: 0, enter: 0, dead: 0 };
  }
  if (idx === 1) {
    const C = CONFIG.bosses.king, hp = C.hp + tier*10;
    return { kind:'king', name:'The Pumpkin King', tier, x: W/2, y: 0, d: C.depth, R: 1, hp, max: hp, throwT: 1.2, t: 0, hurt: 0, nag: 0, enter: 0, dead: 0 };
  }
  const C = CONFIG.bosses.bubble, hp = C.hp + tier*250;
  const zones = Array.from({length: C.zones}, (_, i) => ({ a: i/C.zones*TAU, size: 1, wait: 0 }));
  return { kind:'bubble', name:'Bubble Belly', tier, x: W/2, y: 0, d: C.stages[0].d, R: 1, hp, max: hp, spitT: 1.5, t: 0, squish: 0, snd: 0,
    stage: 0, stageT: C.stages[0].time, zones, combo: 0, lastZone: -9, enter: 0, dead: 0 };
}
function eyePos(b, e){ return { x: b.x + Math.cos(e.a)*b.R*0.56, y: b.y + Math.sin(e.a)*b.R*0.56, r: b.R*0.27 }; }
function zonePos(b, z){ return { x: b.x + Math.cos(z.a)*b.R*0.72, y: b.y + Math.sin(z.a)*b.R*0.72, r: Math.max(13, b.R*0.2)*(0.35 + 0.65*z.size) }; }
function bubblePts(b){ return CONFIG.bosses.bubble.stages.reduce((best, s) => Math.abs(s.d - b.d) < Math.abs(best.d - b.d) ? s : best).pts; }
function hallClampX(x, d, r){ const room = Math.max(0, hallW(d) - r*0.85); return clamp(x, W/2 - room, W/2 + room); }

function updateBoss(b, dt){

  if (b.kind === 'eyeball') {
    const C = CONFIG.bosses.eyeball;
    const sp = b.speed * (1 + b.hits*0.45) * (live ? 1 : 0.3);
    b.dirT -= dt;
    if (b.dirT <= 0) { b.vx = rand(-1, 1); b.vd = rand(-1, 1); b.dirT = rand(1.2, 2.6); }
    b.x += b.vx*sp*dt;
    b.d += b.vd*sp*dt/(H*0.6);
    if (b.d < C.depth[0]) { b.d = C.depth[0]; b.vd = Math.abs(b.vd); } if (b.d > C.depth[1]) { b.d = C.depth[1]; b.vd = -Math.abs(b.vd); }

        b.spitT = b.spitEvery*rand(0.8, 1.2);
        const open = b.eyes.filter(e => e.open);
        if (open.length) { const p = eyePos(b, open[Math.random()*open.length | 0]); addFlyer('blob', p.x, p.y, { base: 14*depthS(b.d), grow: 5, dur: Math.max(1.6, 2.7 - b.tier*0.25) }); }

      b.throwT -= dt;

    b.y = Math.min(depthY(b.d) - b.R*0.55, H - SAFE.b - b.R*0.85);
    b.y = Math.max(b.y, SAFE.t + 110 + b.R*0.6);

      else if (z.grow) { z.size = Math.min(1, z.size + dt*4); if (z.size >= 1) z.grow = false; }

      if (b.spitT <= 0) {
        b.spitT = C.spitEvery * rand(0.8, 1.2) * Math.pow(0.88, b.tier);
        const a = rand(0.15, 0.85)*Math.PI;
        addFlyer('bubble', b.x + Math.cos(a)*b.R, b.y + Math.sin(a)*b.R*0.6, { base: 10, grow: 6, dur: 2.8 });
      }
    }
  }
}
function tapBoss(b, x, y){
  if (b.dead || G.phase !== 'boss') return false;
  if (b.kind === 'eyeball') {
    for (const e of b.eyes) {
      if (!e.open) continue;
      const p = eyePos(b, e);
      if (Math.hypot(x - p.x, y - p.y) < Math.max(p.r*1.35, 20)) {
        e.open = false; e.t = b.reopen; G.score += 50*streakMult();
        burst(p.x, p.y, P.mint, 8, 160); SFX.pop(G.streak); addStreak(p.x, p.y); return true;
      }
    }

      if (b.vuln) {
        b.hits++; b.hurt = 0.4; G.shake = 0.5; G.freeze = 0.08; G.score += 300*streakMult();
        burst(b.x, b.y, P.lilac, 20, 320); floatText(b.x, b.y - b.R, b.hits >= b.need ? 'KO!' : `HIT ${b.hits}!`, P.gold, 26);

        if (b.nag <= 0) { floatText(b.x, b.y - b.R*0.2, 'Pop all the eyes!', P.cream, 15); b.nag = 1.2; }
      }
      return true;
    }

    if (Math.hypot(x - b.x, y - b.y) < Math.max(b.R, 30)) {
      SFX.thunk();
      if (b.nag <= 0) { floatText(b.x, b.y + b.R*1.6, 'Tap rockets to send them back!', P.cream, 12); b.nag = 1.2; }
      return true;
    }
  } else {
    const C = CONFIG.bosses.bubble;
    for (const z of b.zones) {
      if (z.wait > 0 || z.size < 0.3) continue;
      const p = zonePos(b, z);
      if (Math.hypot(x - p.x, y - p.y) < Math.max(p.r*1.3, 24)) {
        b.combo = (b.t - b.lastZone < C.comboWindow) ? Math.min(C.comboMax, b.combo + 1) : 1;

        if (b.hp <= 0) bossDefeated();
        return true;
      }
    }
    if (Math.hypot(x - b.x, y - b.y) < b.R*1.1 + 10) {

  const fl = G.flyers.slice().sort((a, b) => b.z - a.z);
  for (const f of fl) {
    if (Math.hypot(x - f.x, y - f.y) < Math.max(f.s*0.6, 30)) {
      if (f.kind === 'missile') {

/* ============ 1930s film: grain, burned edges, flicker, dust and hairs ============ */
let GRAINTILE = null, BURN = null;
function buildFilm(){
  GRAINTILE = document.createElement('canvas'); GRAINTILE.width = GRAINTILE.height = 256;
  const nc = GRAINTILE.getContext('2d'), id = nc.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - 0.5)*255*0.9; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  nc.putImageData(id, 0, 0);
  BURN = document.createElement('canvas'); BURN.width = Math.ceil(W*DPR); BURN.height = Math.ceil(H*DPR);
  const bc = BURN.getContext('2d'); bc.scale(DPR, DPR);
  const g = bc.createRadialGradient(W/2, H/2, Math.min(W, H)*0.32, W/2, H/2, Math.hypot(W, H)*0.6);
  const B = CONFIG.film.burn;
  g.addColorStop(0, 'rgba(60,30,0,0)'); g.addColorStop(0.6, `rgba(45,22,0,${0.22*B})`); g.addColorStop(1, `rgba(20,10,0,${0.85*B})`);

  bc.save(); bc.shadowColor = `rgba(10,5,0,${0.9*B})`; bc.shadowBlur = Math.min(W, H)*0.06;
  bc.beginPath(); bc.rect(-200, -200, W + 400, H + 400);
  const x0 = 4, y0 = 4, x1 = W - 4, y1 = H - 4;
  bc.moveTo(x0 + rr, y0); bc.arcTo(x1, y0, x1, y1, rr); bc.arcTo(x1, y1, x0, y1, rr); bc.arcTo(x0, y1, x0, y0, rr); bc.arcTo(x0, y0, x1, y0, rr); bc.closePath();

}
const DUST = [], SCRATCH = [];
function filmPost(m){
  if (!GRAINTILE || !BURN) buildFilm();
  m.drawImage(BURN, 0, 0, W, H);
  m.save(); m.globalCompositeOperation = 'overlay'; m.globalAlpha = CONFIG.film.grain;
  const ox = reduced ? 0 : (Math.random()*256) | 0, oy = reduced ? 0 : (Math.random()*256) | 0;
  m.translate(-ox, -oy); m.fillStyle = m.createPattern(GRAINTILE, 'repeat'); m.fillRect(0, 0, W + 256, H + 256);
  m.restore();
  if (reduced) return;
  const f = Math.random();
  const FK = CONFIG.film.flicker;
  m.fillStyle = f < 0.5 ? `rgba(255,240,200,${f*FK})` : `rgba(20,10,0,${(f - 0.5)*FK*1.4})`; m.fillRect(0, 0, W, H);
  if (Math.random() < 0.3) DUST.push({ x: Math.random()*W, y: Math.random()*H, r: rand(1, 3.2), life: 2 + (Math.random()*3 | 0), light: Math.random() < 0.3 });
  if (Math.random() < 0.05) DUST.push({ hair: true, x: Math.random()*W, y: Math.random()*H, a: rand(0, TAU), len: rand(18, 46), life: 3 });
  for (let i = DUST.length - 1; i >= 0; i--) {
    const d = DUST[i];
    if (d.hair) {
      m.strokeStyle = 'rgba(20,10,0,.55)'; m.lineWidth = 1.2; m.beginPath(); m.moveTo(d.x, d.y);
      m.bezierCurveTo(d.x + Math.cos(d.a)*d.len*0.4, d.y + Math.sin(d.a)*d.len*0.4 + 8, d.x + Math.cos(d.a + 0.8)*d.len*0.7, d.y + Math.sin(d.a + 0.8)*d.len*0.7, d.x + Math.cos(d.a + 0.4)*d.len, d.y + Math.sin(d.a + 0.4)*d.len); m.stroke();
    } else { m.fillStyle = d.light ? 'rgba(255,245,220,.75)' : 'rgba(20,10,0,.7)'; m.beginPath(); m.arc(d.x, d.y, d.r, 0, TAU); m.fill(); }
    if (--d.life <= 0) DUST.splice(i, 1);
  }
  if (Math.random() < 0.08) { const x = Math.random()*W; m.fillStyle = 'rgba(255,245,220,.3)'; m.fillRect(x, 0, 1, H); }
  // long scratches that drift back and forth across the frame, the way a worn print wanders in the gate
  while (SCRATCH.length < CONFIG.film.scratches) SCRATCH.push({ x: Math.random(), v: 0, p: Math.random()*TAU, dark: SCRATCH.length % 2 === 1 });
  SCRATCH.forEach(sc => {
    sc.v += (Math.random() - 0.5)*0.0009; sc.v *= 0.96; sc.x += sc.v + Math.sin(G.time*0.7 + sc.p)*0.0012;
    if (sc.x < 0.04 || sc.x > 0.96) { sc.v = -sc.v; sc.x = clamp(sc.x, 0.04, 0.96); }
    if (Math.random() < 0.12) return;   // flickers out now and then
    const x = sc.x*W, a = 0.25 + Math.random()*0.3, top = Math.random() < 0.3 ? Math.random()*H*0.4 : 0;
    m.strokeStyle = sc.dark ? `rgba(20,10,0,${a})` : `rgba(255,248,226,${a + 0.1})`; m.lineWidth = sc.dark ? 1 : 1.5;
    m.beginPath(); m.moveTo(x, top); m.bezierCurveTo(x + 1.5, H*0.33, x - 1.5, H*0.66, x + Math.sin(G.time*3 + sc.p), H); m.stroke();
  });
}

/* ============ iris wipes, the classic cartoon scene change ============ */
function irisIn(dur=0.8){ G.iris = { mode: 'in', t: 0, dur }; }
function irisOut(then, dur=0.55){ G.iris = { mode: 'out', t: 0, dur, then }; }
function drawIris(m){

/* ============ resize & loop ============ */
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight; U = Math.min(W, H);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const cs = getComputedStyle($('probe'));
  SAFE = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  HZ = Math.max(H*0.36, SAFE.t + 170);
  PX = BW() ? (U > 700 ? 1.25 : 1) : TOON() ? 1/Math.min(DPR, CONFIG.cartoonResolution) : clamp(Math.round(U/190), 2, 5); PU = TOON() ? 2 : PX;
  LW = Math.ceil(W/PX); LH = Math.ceil(H/PX); LO.width = LW; LO.height = LH; FGC.width = LW; FGC.height = LH; GRAINTILE = null; BURN = null;
  if (BW()) buildEdge(LW, LH); else EDGE = null;
  buildBG(); buildArena(); buildVignette();
  layoutHoles(G.holes.length || 5, true);
}
let resizeT = null;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

let last = performance.now();
function frame(now){
  let dt = Math.min(0.05, (now - last)/1000); last = now;
  if (G.freeze > 0) { G.freeze -= dt; dt *= 0.15; }
  if (!G.paused) update(dt);
  render(dt);
  requestAnimationFrame(frame);
}

$('btnPlay').addEventListener('click', () => { unlockAudio(); newGame(); });
$('btnAgain').addEventListener('click', () => { unlockAudio(); newGame(); });
$('btnMenu').addEventListener('click', toTitle);
$('btnPause').addEventListener('click', pause);
$('btnResume').addEventListener('click', () => { unlockAudio(); resume(); });
$('btnRestart').addEventListener('click', () => { unlockAudio(); newGame(); });
$('btnQuit').addEventListener('click', toTitle);
$('btnMute').addEventListener('click', () => {
  muted = !muted; try { localStorage.setItem('wag.muted', muted ? '1' : '0'); } catch(e){}
  unlockAudio(); if (master) master.gain.setTargetAtTime(muted ? 0 : 1, AC.currentTime, 0.05); paintMute();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (AC && AC.state === 'running') AC.suspend(); }
  else if (AC && AC.state === 'suspended') AC.resume();
});

function drawIcons(){
  document.querySelectorAll('canvas[data-icon]').forEach(c => {
    const n = TOON() ? 144 : 48;
    if (c.width !== n) { c.width = n; c.height = n; }
    const x = c.getContext('2d', { willReadFrequently: true }); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, n, n);
    x.setTransform(n/144, 0, 0, n/144, 0, 0);
    const k = c.dataset.icon;
    if (k === 'ghost') drawGhost(x, 72, 80, 96, 'basic', 0.2, false, 0);
    else if (k === 'cat') drawCat(x, 72, 82, 100, 0, false);
    else drawHeart(x, 72, 74, 32, 0.3);
    if (!TOON()) quantize(x, 48, 48, false, 48);
  });
}
function setStyle(v){
  STYLE = v; try { localStorage.setItem('wag.style', v); } catch(e){}
  FD = FH = TOON() ? FONT_TOON : FONT_PIX;
  FLASH = BW() ? ['#f3e9d2', '#e2d2b0', '#c9ad7e', '#fffaf0'] : TOON() ? FLASH_TOON : FLASH_PIX;
  document.body.classList.toggle('toon', TOON());
  document.body.classList.toggle('bw', BW());
  cv.style.filter = BW() ? 'contrast(1.04)' : TOON() ? 'sepia(.3) saturate(1.3) contrast(1.08) brightness(1.04)' : STYLE === 'film' ? 'grayscale(1) contrast(1.12)' : '';
  cv.style.imageRendering = TOON() ? 'auto' : 'pixelated';
  ['btnFilmT', 'btnFilmP'].forEach(id => { $(id).textContent = `STYLE: ${STYLE_NAMES[STYLE]}`; });
  if (W) resize();
  drawIcons();
}
const nextStyle = () => setStyle(STYLES[(STYLES.indexOf(STYLE) + 1) % STYLES.length]);
$('btnFilmT').addEventListener('click', nextStyle);
$('btnFilmP').addEventListener('click', nextStyle);

// playtest shortcuts from the browser console: __wagBoss(0|1|2) jumps to a boss, __wagStreak(n) sets a streak
window.__wagBoss = idx => { newGame(); G.banner = null; G.iris = null; G.round = (idx + 1)*CONFIG.roundsPerBoss; startBoss(); G.env = 1; };
window.__wagStreak = n => { G.streak = n - 1; addStreak(W/2, H/2); };

loadArt();
fetchTrack();
paintMute();
setStyle(STYLE);
resize();
toTitle();
drawIcons();
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`16px ${FONT_PIX}`), document.fonts.load(`16px ${FONT_TOON}`), document.fonts.load('16px Limelight')]).then(() => { drawIcons(); buildBG(); buildArena(); }).catch(() => {});
requestAnimationFrame(frame);
})();
</script>

</body>
