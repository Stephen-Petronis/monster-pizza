<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monster General</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheeky 90s British hospital sim, a bit grubby, very silly
   IDEA: a hospital clipboard + PA system wrapped around an isometric ward
   PICTURE: the hospital itself, full screen, cutaway walls, wobbling patients
   COLOUR and TYPE: scrub teal chrome, mint floors, emergency red accent; Fredoka
   LAYOUT: HUD strip on top, announcer ticker, canvas fills, tabbed clipboard at bottom */
:root{color-scheme:light dark;--chrome:#0f4c5c;--chrome2:#0b3a46;--mint:#b8f2e6;--red:#ff4f5e;--ink:#10262c;--paper:#fffdf5;--gold:#ffd166}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06262e;font:16px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;background:var(--chrome);color:#fff;padding:6px 10px;font-weight:600;font-size:14px;z-index:3}
.st{display:flex;gap:4px;align-items:baseline;white-space:nowrap}.st i{font-style:normal;opacity:.65;font-weight:400;font-size:12px}
.st b.bad{color:var(--red)}.st b.good{color:#7dffb0}
#speed{margin-left:auto;display:flex;gap:3px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
#speed button,#voiceBtn{background:var(--chrome2);color:#fff;min-width:38px;height:34px;font-size:13px}
#speed button.on{background:var(--gold);color:var(--ink)}
#ticker{background:#082f38;color:var(--mint);font-size:14px;padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;border-bottom:2px solid var(--red)}
#ticker b{color:var(--red);margin-right:6px}
#stage{position:relative;flex:1}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#eventBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 4px 0 #a3202c;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#placeBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;width:max-content;background:var(--paper);padding:6px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:96%}
#placeBar button{height:44px;padding:0 14px;font-weight:600;background:#e8efe9}
#placeBar #pOk{background:#2bb673;color:#fff}#pSizes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#pSizes button{background:var(--chrome);color:#fff}#pSizes button.draw{background:#ffd166;color:var(--ink)}#pSizes button:disabled{opacity:.45}
.pclose{display:block;position:sticky;top:0;z-index:3;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;font-size:24px;line-height:1;font-weight:700;margin:0 0 -42px auto;box-shadow:0 3px 0 #a3202c}.stick .pclose{float:right;position:static;margin:0 0 6px 8px}.pclose:focus-visible{outline:3px solid var(--gold)}
#panel.full{top:0;max-height:none;border-radius:0}#panel.full .stick{border-radius:0}
.stick{position:sticky;top:-12px;background:var(--paper);z-index:2;margin:-12px -12px 0;padding:12px 12px 4px;border-radius:18px 18px 0 0}#placeBar #pNo{background:var(--red);color:#fff}
#pMsg{font-size:13px;padding:0 6px;max-width:180px}
#info{position:absolute;right:8px;top:8px;width:min(300px,92vw);background:var(--paper);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14px}
#info h3{margin:0 0 2px;font-size:18px}#info .sub{opacity:.7;margin-bottom:8px}
.bar{height:9px;background:#dfe6e2;border-radius:6px;overflow:hidden;margin:2px 0 7px}.bar>span{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--chrome);color:#fff;height:40px;padding:0 14px;font-weight:600}
.btn.red{background:var(--red)}.btn.ghost{background:#e3ebe7;color:var(--ink)}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:12px;box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:#fff;border:2px solid #d6e5df;border-radius:12px;padding:8px 10px;text-align:left;color:var(--ink);min-height:44px}
.card:disabled{opacity:.45}.card b{display:block;font-size:15px}.card small{display:block;opacity:.7;font-size:12px;line-height:1.3}
.card .price{color:#1b7f53;font-weight:700;font-size:13px}
.card .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#panel h4{margin:4px 0 8px;font-size:16px}
#panel label{display:block;font-weight:600;margin-top:8px}
input[type=range]{width:100%;height:32px;accent-color:var(--chrome)}
.goal{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:#eef5f1;margin:4px 0}.goal.done{background:#c9f5dc}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{background:#e3ebe7;color:var(--ink);height:38px;padding:0 12px;font-weight:600;font-size:14px}.chip.on{background:var(--chrome);color:#fff}
.cand{display:flex;flex-direction:column;gap:3px}.cand .btn{margin-top:auto;height:40px;white-space:nowrap;font-size:14px;padding:0 10px}.cand .blurb{margin-bottom:6px}.rank{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#0f4c5c}.rank svg{width:18px;height:18px}
.badge{display:inline-block;color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin:1px 3px 1px 0}
.pips{display:flex;gap:2px;align-items:center;font-size:12px}.pips i{width:7px;height:7px;border-radius:2px;background:#d6e5df}.pips i.on{background:#0f9d8a}.pips span{width:56px;opacity:.75}
.blurb{font-style:italic;font-size:12.5px;opacity:.8;line-height:1.3}
#toolbar{display:flex;background:var(--chrome);z-index:3}
#toolbar button{flex:1;height:52px;background:none;color:#fff;font-weight:600;font-size:15px;border-radius:0;border-top:3px solid transparent}
#toolbar button.on{background:var(--chrome2);border-top-color:var(--gold)}
#toast{position:absolute;left:50%;top:50px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#modal{position:fixed;inset:0;background:rgba(4,30,36,.82);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.mbox{background:var(--paper);border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 12px 0 #062a32}
.mbox h1{font-size:clamp(34px,8vw,52px);line-height:1.05;margin:0;color:var(--chrome);letter-spacing:-.5px}
.mbox h1 span{color:var(--red)}
.mbox h2{margin:0 0 6px;font-size:28px;color:var(--chrome)}
.lvl{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:2px solid #cfe3db;border-radius:14px;padding:12px;margin:8px 0;text-align:left;color:var(--ink);min-height:56px}
.lvl:disabled{opacity:.5}.lvl b{font-size:17px}.lvl small{display:block;opacity:.7}
.mbox ul{padding-left:20px;margin:8px 0}.mbox li{margin:3px 0;font-size:15px}
.hidden{display:none!important}
@media(max-width:600px){#hud{font-size:13px;gap:2px 8px}.st i{display:none}#speed button,#voiceBtn{min-width:34px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="st"><i>Cash</i><b id="hCash">$0</b></span>
    <span class="st"><i>Rep</i><b id="hRep">50</b></span>
    <span class="st"><i>Cured</i><b id="hCured">0</b></span>
    <span class="st"><i>Date</i><b id="hDate">Jan 1</b></span>
    <span class="st"><i>Temp</i><b id="hTemp">20°</b></span>
    <span id="speed"><button data-s="0">II</button><button data-s="1" class="on">&#9654;</button><button data-s="2">&#9654;&#9654;</button><button data-s="4">&#9654;&#9654;&#9654;</button></span>
    <button id="voiceBtn" title="Announcer voice">PA on</button>
  </div>
  <div id="ticker"><b>PA</b><span id="tickerText">Welcome to Monster General.</span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="eventBar" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div id="info" class="hidden"></div>
    <div id="panel" class="hidden"></div>
    <div id="placeBar" class="hidden"><span id="pSizes"></span><button id="pSize">Change size</button><button id="pRot">Move door</button><span id="pMsg"></span><button id="pOk">Place</button><button id="pNo">&#10005;</button></div>
  </div>
  <div id="toolbar">
    <button data-tab="rooms">Rooms</button><button data-tab="items">Items</button><button data-tab="staff">Staff</button><button data-tab="hosp">Hospital</button>
  </div>
</div>
<div id="modal"></div>

<script>
{
// =================== CONFIG (tunables) ===================
const CONFIG={
  TW:64, TH:32,

const OBJ_TYPES={

  plant:{name:'Pot Plant',cost:80,block:true,corridor:1,rooms:'any',max:3,desc:'Cheers the place up. Inside a room, staff there get tired more slowly.'},
  bin:{name:'Bin',cost:60,block:true,corridor:1,desc:'Patients nearby put rubbish in it instead of on the floor.'},
  radiator:{name:'Radiator',cost:250,block:true,corridor:1,rooms:'any',max:2,desc:'Warms the tiles around it. Running cost depends on radiator power.'},

};
// who: which kind of patient can catch it
const DISEASES={
  tummy:{gp:90,name:'Grumbly Tummy',who:'any',room:'pharmacy',price:300,desc:'Their tummy growls, and sometimes it talks back.'},
  echo:{gp:90,name:'Echo Sneeze',who:'human',room:'pharmacy',price:350,desc:'Every sneeze repeats. Louder each time.'},
  scary:{gp:60,name:'Lost Their Scary',who:'monster',room:'psych',price:600,desc:'Says "boo" and nobody jumps. Very sad about it.'},
  humanitis:{gp:55,name:'Human-itis',who:'monster',room:'psych',price:650,desc:'A monster who suddenly wants a tie and a briefcase.'},
  fuzz:{gp:55,name:'Fuzz Loss',who:'monster',room:'shower',price:750,desc:'All their fur fell out. Leaves fluffy clumps everywhere.'},

  teeth:{gp:45,name:'Too Many Teeth',who:'monster',room:'flip',price:900,desc:'Their mouth is all teeth. They cannot close it.'},

const STAFF_TYPES={
  doctor:{name:'Doctor',body:'#3a86ff',desc:'Big gentle monster. Runs Check-Ups, Scare School, Tooth Trimmer.'},
  nurse:{name:'Nurse',body:'#ff8fb1',desc:'Small speedy monster. Runs the Snack Lab and Fur Salon.'},
  handyman:{name:'Janitor',body:'#ff9f1c',desc:'Eats messes (yum) and fixes machines.'},
  receptionist:{name:'Receptionist',body:'#9b5de5',desc:'Human with a clipboard. Nobody gets seen without one.'},
};
// Each hospital adds a couple of new things so players learn one idea at a time.
// f = which systems are switched on: bladder (toilets), trash (bins), temp (radiators)
const LEVELS=[
  {name:'Fuzzy Corners Clinic',W:12,H:10,cash:12000,spawn:.9,goals:{cash:16000,rep:50,cured:15},f:{},
   diseases:['tummy','echo'],rooms:['gp','pharmacy','staffroom'],items:['bench','drinks','plant'],events:[],
   blurb:'A little clinic on the corner where monsters and humans live side by side.',
   intro:['Pick a room, then a size: <b>3×3</b>, <b>4×4</b> or <b>Draw my own</b>. Tap the floor to drop it, then drag it around to line it up (it scrolls when you reach the edge). Tap a wall to move the door, and press Place. Bigger rooms cost a bit more.','Patients check in at the front desk, see the Doctor in the <b>Check-Up Room</b>, then get treated.','The <b>Snack Lab</b> cures Grumbly Tummy and Echo Sneeze. It needs a Nurse.','Tap <b>Staff</b> to see who is applying. Juniors are cheap but slow, Consultants are quick and clever but pricey. Hire a Receptionist, a Doctor, a Nurse and a Janitor to start.','<b>Benches</b> keep waiting patients calm. A <b>Staff Room</b> lets tired staff nap.']},
  {name:'Puddle Lane Hospital',W:13,H:11,holes:[[4,4,1,1],[8,4,1,1]],cash:13000,spawn:1.05,goals:{cash:22000,rep:55,cured:30},f:{bladder:1,trash:1},
   diseases:['tummy','echo','scary'],rooms:['gp','pharmacy','psych','toilet','staffroom'],items:['bench','drinks','bin','plant'],events:['emergency'],
   blurb:'A busier street, with busier tummies.',
   intro:['This building has <b>pillars</b>. With <b>Draw my own</b>, rooms wrap around pillars and other rooms, so they don\'t have to be square. A bigger <b>Toilets</b> room fits more stalls.','<b>Scare School</b> helps monsters who have Lost Their Scary. It only works with a Doctor who has the <b>Scare Expert</b> badge. Look for one in the applicants.','Patients need the loo now, and juice makes it worse. Build <b>Toilets</b> or there will be puddles.','<b>Bins</b> stop patients dropping wrappers and cans on the floor.','<b>Emergencies:</b> sometimes a helicopter drops off several sick patients at once. Cure them all for a bonus.']},
  {name:'Snowmonster Valley Hospital',W:14,H:12,holes:[[10,0,4,3],[5,5,1,1],[9,6,1,1]],cash:15000,spawn:1.2,goals:{cash:30000,rep:58,cured:45},f:{bladder:1,trash:1,temp:1},
   diseases:['tummy','echo','scary','humanitis'],rooms:['gp','scanner','pharmacy','psych','toilet','staffroom'],items:['bench','drinks','bin','radiator','plant','sofa','tv','cabinet'],events:['emergency'],
   blurb:'It is snowing. Everyone is cold, and some cases are tricky.',
   intro:['An odd-shaped building! Squeeze rooms into the corners.','<b>Filing Cabinets</b> inside the Check-Up Room or Snot Scanner make doctors more sure. Plants and radiators can go inside rooms too.','It gets cold here! <b>Radiators</b> warm the floor around them. Blue floor means cold, orange means hot.','Turn radiator power up or down under <b>Hospital</b>. Cold patients run out of patience fast.','Tricky illnesses like Human-itis need a <b>Snot Scanner</b> before the Doctor is sure.','Put a <b>Sofa</b> or <b>TV</b> in the Staff Room so breaks are shorter.']},
  {name:'Fluffington Heights',W:15,H:12,holes:[[0,0,3,3],[5,5,1,1],[10,5,1,1]],cash:17000,spawn:1.35,goals:{cash:40000,rep:60,cured:60},f:{bladder:1,trash:1,temp:1},

   blurb:'A fancy neighbourhood where everyone cares about their fur.',

  {name:'Grizzle Bay General',W:16,H:13,holes:[[12,0,4,4],[0,8,3,5],[7,4,1,1]],cash:19000,spawn:1.55,goals:{cash:55000,rep:65,cured:90},f:{bladder:1,trash:1,temp:1},
   diseases:['tummy','echo','scary','humanitis','fuzz','monsteritis','teeth','floppy'],rooms:['gp','scanner','xray','pharmacy','psych','shower','flip','ward','toilet','staffroom','training'],items:['bench','drinks','bin','radiator','plant','sofa','tv','pool','cabinet','extinguisher'],events:['emergency','epidemic'],
   blurb:'A big seaside hospital. Lots of teeth. Lots of bendy bones.',

  {name:'Mount Grumble Medical Centre',W:18,H:14,holes:[[0,0,4,3],[14,0,4,3],[7,4,4,2],[4,8,1,1],[13,8,1,1]],cash:20000,spawn:1.75,goals:{cash:75000,rep:70,cured:120},f:{bladder:1,trash:1,temp:1},
   diseases:['tummy','echo','scary','humanitis','fuzz','monsteritis','teeth','floppy'],rooms:['gp','scanner','xray','pharmacy','psych','shower','flip','ward','toilet','staffroom','training','research'],items:['bench','drinks','bin','radiator','plant','sofa','tv','pool','cabinet','extinguisher'],events:['emergency','epidemic','earthquake'],
   blurb:'Built on a sleeping giant monster. It rolls over sometimes.',
   intro:['The <b>Mad Lab</b> needs a <b>Mad Scientist</b>. They invent upgrades. Check progress under Hospital.','<b>Earthquakes!</b> The giant rolls over, machines get damaged and rubble falls. Keep your Janitors busy.']},
];
const FLAVOR=[
  "Would the monster eating the waiting-room chairs please stop. Those are for sitting.",
  "Reminder: please do not scare the receptionist. She has asked very nicely.",
  "Humans, please stop petting the monsters without asking first.",
  "Monsters, please stop petting the humans without asking first.",
  "The juice machine has swamp juice and apple juice. Please check which one you pressed.",

function beep(f1,f2,dur=0.18,vol=0.06){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(f1,actx.currentTime);
  o.frequency.linearRampToValueAtTime(f2,actx.currentTime+dur);g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);}catch(e){}}

// =================== pathfinding ===================
function isDoorEdge(r,ax,ay,bx,by){const d=r.door;return (ax===d.ix&&ay===d.iy&&bx===d.ox&&by===d.oy)||(bx===d.ix&&by===d.iy&&ax===d.ox&&ay===d.oy)}
function canStep(ax,ay,bx,by){
  const a=T(ax,ay),b=T(bx,by);if(!a||!b)return false;if(blocks(a)||blocks(b))return false;
  if(a.room===b.room)return true;if(a.room&&b.room)return false;
  return isDoorEdge(a.room||b.room,ax,ay,bx,by);
}
function field(key,sources){
  let f=G.fields.get(key);if(f)return f;
  const W=G.W,H=G.H;f=new Int32Array(W*H).fill(1e9);const q=[];
  for(const s of sources){const t=T(s.x,s.y);if(!t||blocks(t))continue;f[s.y*W+s.x]=0;q.push(s.x,s.y)}
  for(let i=0;i<q.length;i+=2){const x=q[i],y=q[i+1],d=f[y*W+x];
    for(const [dx,dy] of NB){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;
      if(f[ny*W+nx]<=d+1||!canStep(nx,ny,x,y))continue;f[ny*W+nx]=d+1;q.push(nx,ny)}}
  G.fields.set(key,f);return f;
}
const tileField=(x,y)=>field('T'+x+','+y,[{x,y}]);
function drinksField(){return field('DRINKS',G.objs.filter(o=>o.type==='drinks').flatMap(o=>NB.map(([dx,dy])=>({x:o.x+dx,y:o.y+dy}))).filter(p=>{const t=T(p.x,p.y);return t&&!t.room&&!blocks(t)}))}
function lobbyField(){const b=G.objs.filter(o=>o.type==='bench');if(b.length)return field('LOBBY',b);
  const s=G.recep.servSpot,c=[];for(let dx=-3;dx<=3;dx++)for(let dy=-1;dy<=1;dy++){const x=s.x+dx,y=s.y+dy,t=T(x,y);if(t&&!t.room&&!t.res&&!blocks(t)&&Math.abs(dx)>1)c.push({x,y})}
  return field('LOBBY',c.length?c:[s])}
function clearFields(){G.fields.clear();for(const a of allAgents())a.nx=null}
function allAgents(){return [...G.patients,...G.staff,...G.rats]}
function step(a,f,dt){
  if(a.nx!=null){const dx=a.nx-a.x,dy=a.ny-a.y,d=Math.hypot(dx,dy),s=a.speed*dt;
    const sx=dx-dy;if(Math.abs(sx)>.05)a.face=sx<0?-1:1;
    if(d<=s){a.x=a.nx;a.y=a.ny;a.nx=null}else{a.x+=dx/d*s;a.y+=dy/d*s}a.moving=true;return false}
  const cx=Math.floor(a.x),cy=Math.floor(a.y),W=G.W,d=f[cy*W+cx];
  if(d===0){const tx=cx+.5+(a.ox||0),ty=cy+.5+(a.oy||0),dx=tx-a.x,dy=ty-a.y,dd=Math.hypot(dx,dy);
    if(dd<.03){a.moving=false;return true}const s=a.speed*dt;if(dd<=s){a.x=tx;a.y=ty}else{a.x+=dx/dd*s;a.y+=dy/dd*s}a.moving=true;return false}
  if(d>=1e9){a.moving=false;a.stuck=(a.stuck||0)+dt;return false}
  const o=[];for(const [dx,dy] of NB){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=G.H)continue;if(f[ny*W+nx]===d-1&&canStep(cx,cy,nx,ny))o.push([nx,ny])}
  if(!o.length){a.stuck=(a.stuck||0)+dt;return false}
  const n=pick(o);a.nx=n[0]+.5;a.ny=n[1]+.5;a.stuck=0;return false;
}
const reachable=(f,x,y)=>f[y*G.W+x]<1e9;

// =================== rooms & objects ===================
const minSize=type=>ROOM_TYPES[type].min||3;
const ck=(x,y)=>x+','+y,OPP={N:'S',S:'N',E:'W',W:'E'};
const roomCost=(type,cells)=>ROOM_TYPES[type].cost+CONFIG.tileCost*Math.max(0,cells.length-minSize(type)**2);
const inRect=(R,x,y)=>x>=R.x&&y>=R.y&&x<R.x+R.w&&y<R.y+R.h;
const rectCells=R=>{const c=[];for(let y=R.y;y<R.y+R.h;y++)for(let x=R.x;x<R.x+R.w;x++)c.push({x,y});return c};
const cellSet=cells=>new Set(cells.map(c=>ck(c.x,c.y)));
const freeCell=(x,y)=>{const t=T(x,y);return !!t&&!t.void&&!t.room&&!t.obj&&!t.res&&!isDoorOutside(x,y)};
// Draw-your-own rooms take the free tiles inside the dragged box that join up with where you started,
// so they wrap around pillars, items and other rooms instead of having to be square.
function fitCells(R,sx,sy){
  const ok=new Set(rectCells(R).filter(c=>freeCell(c.x,c.y)).map(c=>ck(c.x,c.y)));
  let start=ok.has(ck(sx,sy))?{x:sx,y:sy}:null;
  if(!start){let bd=1e9;for(const k of ok){const [x,y]=k.split(',').map(Number),d=Math.abs(x-sx)+Math.abs(y-sy);if(d<bd){bd=d;start={x,y}}}}
  if(!start)return [];const seen=new Set([ck(start.x,start.y)]),out=[start];
  for(let i=0;i<out.length;i++){const c=out[i];for(const [dx,dy] of NB){const k=ck(c.x+dx,c.y+dy);if(ok.has(k)&&!seen.has(k)){seen.add(k);out.push({x:c.x+dx,y:c.y+dy})}}}

function binNear(p,r=2.6){return G.objs.some(o=>o.type==='bin'&&Math.hypot(o.x+.5-p.x,o.y+.5-p.y)<r)}

function maybeToilet(p){
  if(p.bladder<75||(p.room&&p.room.type==='toilet')||p.state==='queue'&&p.room&&p.room.queue[0]===p)return false;
  const r=chooseRoom('toilet',p);if(!r){if(p.bladder>85)hint('toilet','Patients are crossing their legs. Some Toilets would be lovely.');return false}
  const back=p.state==='queueRecep'||p.state==='arrive'?'arrive':needState(p);detach(p);p.after=back;p.room=r;p.state='toRoom';return true;
}
function chooseRoom(type,p){
  let best=null,bs=1e9;for(const r of G.rooms){if(r.type!==type)continue;
    const f=tileField(r.door.ox,r.door.oy),d=f[Math.floor(p.y)*G.W+Math.floor(p.x)];if(d>=1e9)continue;
    const s=r.queue.length*6+r.occ.length*3/cap(r)+(r.staff?0:8)+(r.broken?15:0)+d*.4;if(s<bs){bs=s;best=r}}
  return best;
}
function maybeDrink(p){

  if(p.state==='queue'&&p.room&&p.room.queue[0]===p)return false;
  const f=drinksField();if(!reachable(f,Math.floor(p.x),Math.floor(p.y)))return false;
  const back=p.state==='queueRecep'||p.state==='arrive'?'arrive':needState(p);

}
function updPatient(p,dt){

  if(p.state!=='leaving'){
    const waiting=p.state==='queue'||p.state==='queueRecep'||p.state==='wait';

    if(p.dis==='scary'&&!p.cured&&Math.random()<dt*.06)bubble(p,'boo? ...boo.',1.6);
    if(p.infected&&Math.random()<dt*.1)bubble(p,'*hic* hehehe',1.4);
    if(p.infected&&G.epidemic)for(const q of G.patients)if(q!==p&&!q.infected&&q.state!=='dead'&&q.state!=='leaving'&&Math.hypot(q.x-p.x,q.y-p.y)<.9&&Math.random()<dt*.04){q.infected=true;bubble(q,'*hic?*')}
  }
  switch(p.state){
    case 'arrive':{const s=G.recep.servSpot;if(step(p,tileField(s.x,s.y),dt)){G.recep.queue.push(p);p.state='queueRecep';p.checkT=0}break}
    case 'queueRecep':queueWait(p,G.recep.queue,G.recep.servSpot,dt);if(maybeToilet(p))break;if(!G.recep.staff)hint('recep','Nobody is at the front desk. A monster is trying to check in with a pot plant. Hire a Receptionist.');maybeDrink(p);break;
    case 'needGP':case 'needTreat':case 'needDiag':{
      const type=p.state==='needGP'?'gp':p.state==='needDiag'?p.diagType:DISEASES[p.diag].room,r=chooseRoom(type,p);
      if(r){p.room=r;p.state='toRoom';p.need=p.state}
      else{p.need=p.state;p.state='wait';p.recheck=2;p.waitFor=type;bubble(p,'Where is the '+ROOM_TYPES[type].name+'?',3);
        hint('room'+type,`Patients need a ${ROOM_TYPES[type].name}. They are standing about looking poorly.`)}
      break}
    case 'wait':if(maybeDrink(p)||maybeToilet(p))break;if(!p.seat&&(p.seatT=(p.seatT||0)-dt)<=0){p.seatT=1;findSeat(p,{x:Math.floor(p.x),y:Math.floor(p.y)})}
      if(p.seat){p.ox=p.seat.i?.22:-.22;p.oy=.03;step(p,tileField(p.seat.b.x,p.seat.b.y),dt)}else step(p,lobbyField(),dt);if((p.recheck-=dt)<=0&&!p.moving)p.state=needState(p);break;
    case 'toRoom':{const r=p.room;if(!r||r.sold){p.state=needState(p);break}
      if(step(p,tileField(r.door.ox,r.door.oy),dt)){r.queue.push(p);p.state='queue'}break}
    case 'queue':{const r=p.room;if(!r||r.sold){p.state=needState(p);break}

      maybeDrink(p);break}
    case 'enterRoom':{const r=p.room;if(!r){p.state=needState(p);break}const c=patientSpot(r,p);
      if(step(p,tileField(c.x,c.y),dt)){p.state='inRoom';const s=r.staff;
        p.timer=ROOM_TYPES[r.type].dur*(s&&s.energy<CONFIG.tiredAt?1.6:1)*(s?(1.25-.2*lvl(s))*(1.08-(s.focus||5)*.016):1)*(G.res.speed&&r.type!=='toilet'?.75:1)}break}
    case 'inRoom':{const r=p.room;if(!r){p.state=needState(p);break}if(staffReady(r))p.timer-=dt;if(p.timer<=0)resolveRoom(p,r);break}
    case 'toDrink':if(step(p,drinksField(),dt)){p.thirst=0;if(G.L.f.bladder)p.bladder=Math.min(100,p.bladder+30);earn(CONFIG.drinkPrice,p.x,p.y);bubble(p,'*slurp*',1.5);
      if(Math.random()<.35)dropTrash(p,'can');p.state=p.after;}break;
    case 'leaving':if(step(p,tileField(G.entrance.x,G.entrance.y),dt))G.patients.splice(G.patients.indexOf(p),1);break;
  }
}
function resolveRoom(p,r){
  const k=r.occ.indexOf(p);if(k>=0)r.occ.splice(k,1);p.room=null;const s=r.staff,RT=ROOM_TYPES[r.type];
  if(r.type==='toilet'){p.bladder=0;p.state=p.after||needState(p);p.after=null;bubble(p,'Ahhh.',1.5);return}
  if(s)s.energy=Math.max(0,s.energy-6);if(r.staff2)r.staff2.energy=Math.max(0,r.staff2.energy-6);
  if(RT.machine){const ext=itemsIn(r,'extinguisher');r.cond-=CONFIG.machineWear*(G.res.wear?.5:1)*(1-.25*Math.min(2,ext));if(r.cond<=0){r.cond=0;r.broken=true;

    else if(r.cond<30&&!r.warned){r.warned=true;announce(`The ${RT.name} is making a noise it should not make.`)}}
  if(r.type==='gp'||RT.diag){
    const tired=s&&s.energy<CONFIG.tiredAt,sk=s?lvl(s):1;
    if(Math.random()<(tired?.3:.05)*[1.6,1,.4][sk-1])p.wrong=true;
    const gain=(r.type==='gp'?DISEASES[p.dis].gp:RT.diag)*(.85+.15*sk)*(G.res.diag?1.15:1)*(1+.1*Math.min(3,itemsIn(r,'cabinet')));p.cert=Math.min(100,p.cert+gain);
    if(r.type==='gp')earn(Math.round(CONFIG.gpFee*G.price),p.x,p.y);else{earn(Math.round(CONFIG.diagFee*G.price),p.x,p.y);p.visited.push(r.type)}
    p.diagType=null;
    if(p.cert>=CONFIG.needCert){
      p.diag=p.wrong?pick(G.L.diseases.filter(d=>d!==p.dis&&d!=='hiccup'&&(DISEASES[d].who==='any'||DISEASES[d].who===p.species)))||p.dis:p.dis;
      const refuse=Math.max(0,(G.price-1)*.5-G.rep/400);
      if(Math.random()<refuse){leave(p,'HOW much?!');return}
      bubble(p,DISEASES[p.diag].name+'?!',2.5);p.state='needTreat';return;
    }
    const opts=G.L.rooms.filter(t=>ROOM_TYPES[t].diag&&!p.visited.includes(t)&&G.rooms.some(q=>q.type===t));
    if(opts.length){p.diagType=pick(opts);p.state='needDiag';bubble(p,'Off to the '+ROOM_TYPES[p.diagType].name,2.5)}
    else{p.state='needGP';bubble(p,'Hmm, back to the doctor...',2.5);
      if(G.L.rooms.includes('scanner')&&!G.rooms.some(q=>q.type==='scanner'))hint('diag',"The doctors aren't sure what's wrong with some patients. A Snot Scanner would help them be sure.")}
    return;
  }
  if(p.diag===p.dis){
    p.cured=true;p.infected=false;G.cured++;earn(Math.round(DISEASES[p.dis].price*G.price*(G.res.price?1.2:1)),p.x,p.y);
    rep(1.4-Math.max(0,G.price-1)*.8);bubble(p,'Cured!',2.5);beep(880,1320,.12);

  }else{leave(p,"This isn't what I have!");rep(-2);announce('A patient got the wrong treatment. A human now has very fluffy ears. Perhaps the doctor needs a nap.')}
}

function findHandyJob(s){
  if(s.energy<CONFIG.tiredAt&&staffRoomFree()){goRest(s);return}
  const mr=G.rooms.filter(r=>ROOM_TYPES[r.type].machine&&!r.repairBy&&(r.broken||r.cond<55)).sort((a,b)=>a.cond-b.cond)[0];
  if(mr){const c=mr.lay.pspot;mr.repairBy=s;s.job={room:mr,x:c.x,y:c.y};s.state='toJob';return}
  let best=null,bd=1e9;const sx=Math.floor(s.x),sy=Math.floor(s.y);

  if(best&&reachable(tileField(best.x,best.y),sx,sy)){best.t.resBy=s;s.job={tile:best.t,x:best.x,y:best.y};s.state='toJob'}

function updRat(r,dt){
  if(r.nx==null){const cx=Math.floor(r.x),cy=Math.floor(r.y),o=NB.filter(([dx,dy])=>canStep(cx,cy,cx+dx,cy+dy));
    if(o.length){const [dx,dy]=pick(o);r.nx=cx+dx+.5+rand(-.2,.2);r.ny=cy+dy+.5+rand(-.2,.2)}}
  else{const dx=r.nx-r.x,dy=r.ny-r.y,d=Math.hypot(dx,dy),s=r.speed*dt;if(d<=s){r.x=r.nx;r.y=r.ny;r.nx=null}else{r.x+=dx/d*s;r.y+=dy/d*s;r.dir=dx-dy}}
}
function squash(r){G.rats.splice(G.rats.indexOf(r),1);earn(25,r.x,r.y);addFx(r.x,r.y-0.4,'POOF','#9aa5b1');beep(200,60,.15,.1)}

// =================== events ===================
function startEvent(){
  const kind=pick(G.L.events);
  if(kind==='emergency'){const dis=pick(G.L.diseases),n=3+Math.floor(Math.random()*3);
    G.emergency={dis,total:n,cured:0,lost:0,t:120,spawned:0,spawnT:0,reward:n*600};
    announce(`Emergency! ${n} patients with ${DISEASES[dis].name} are arriving by helicopter. Cure them all for a ${money(n*600)} bonus.`,true)}
  if(kind==='epidemic'){const pool=G.patients.filter(p=>p.state!=='dead'&&p.state!=='leaving');
    const n=Math.min(pool.length,3+Math.floor(Math.random()*2));if(n<2){G.eventT=20;return}
    for(let i=0;i<n;i++)pick(pool).infected=true;
    G.epidemic={t:75};announce('Giggle Hiccups are going round! Tap the patients with green faces to give them a hiccup shot before the health inspector arrives.',true)}
  if(kind==='earthquake'){G.shake=4;announce('Earthquake! Please remain calm. Or at least remain somewhere.',true);beep(80,40,1.5,.12);
    for(const r of G.rooms)if(ROOM_TYPES[r.type].machine){r.cond=Math.max(0,r.cond-35);if(r.cond===0)r.broken=true}
    for(let i=0;i<6;i++){const x=Math.floor(Math.random()*G.W),y=Math.floor(Math.random()*G.H),t=T(x,y);if(!blocks(t)&&!t.litter)t.litter='rubble'}}
}
function updEvents(dt){
  const em=G.emergency;
  if(em){em.t-=dt;if(em.spawned<em.total&&(em.spawnT-=dt)<=0){spawnPatient({dis:em.dis,emergency:true});em.spawned++;em.spawnT=1.2}
    if(em.cured+em.lost>=em.total||em.t<=0){
      if(em.cured>=em.total){earn(em.reward);rep(5);announce(`Emergency handled. Bonus of ${money(em.reward)} received. Try not to let it go to your head.`,true)}
      else{rep(-3*(em.total-em.cured));announce(`Emergency over. ${em.cured} of ${em.total} saved. The helicopter pilot is disappointed in you.`,true)}
      for(const p of G.patients)p.emergency=false;G.emergency=null}}
  const ep=G.epidemic;
  if(ep){ep.t-=dt;if(ep.t<=0){const n=G.patients.filter(p=>p.infected&&p.state!=='dead').length;
    if(n===0){earn(1500);rep(5);announce('The health inspector found no Giggle Hiccups. She is almost smiling. Bonus $1,500.',true)}
    else{const fine=n*500;spend(fine);rep(-2*n);announce(`The inspector found ${n} giggling, hiccuping patients. Fine of ${money(fine)}. She giggled too, which she did not enjoy.`,true)}
    G.epidemic=null}}
  if(!G.emergency&&!G.epidemic&&G.day>12&&(G.eventT-=dt)<=0){startEvent();G.eventT=rand(80,140)}
}

// =================== main update ===================
function update(dt){
  G.dayT+=dt;if(G.dayT>=CONFIG.dayLength){G.dayT=0;G.day++;if(G.day%CONFIG.monthDays===0)monthEnd()}
  if((G.spawnT-=dt)<=0){const alive=G.patients.filter(p=>p.state!=='dead').length;if(alive<CONFIG.maxPatients)spawnPatient();
    G.spawnT=Math.max(2,(CONFIG.spawnBase-G.rep*.06)/G.L.spawn)*rand(.7,1.3)}
  updEvents(dt);
  for(const r of G.rooms){const RT=ROOM_TYPES[r.type];if(!RT.dur)continue;
    const ready=!r.broken&&staffReady(r);
    while(ready&&r.occ.length<cap(r)&&r.queue.length){const p=r.queue.shift();releaseSeat(p);p.slot=freeSlot(r);r.occ.push(p);p.state='enterRoom';p.ox=p.jx;p.oy=p.jy}}
  for(const p of [...G.patients])updPatient(p,dt);
  for(const s of [...G.staff])updStaff(s,dt);
  for(const r of G.rats)updRat(r,dt);
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<1.6);
  if(G.shake>0)G.shake-=dt;
  if((G.checkT-=dt)<=0){G.checkT=1;computeTemps();
    let lit=0;for(const t of G.tiles)if(t.litter)lit++;G.litter=lit;
    const plants=G.objs.filter(o=>o.type==='plant').length;
    const ps=G.patients.filter(p=>p.state!=='dead'),unc=ps.length?ps.filter(p=>comfort(p)>1).length/ps.length:0;
    rep(-lit*.004-G.rats.length*.012-unc*.02+Math.min(.012,plants*.002)+.004);
    if(lit>=8&&G.rats.length<6&&Math.random()<.12){const e=G.entrance;G.rats.push({kind:'rat',x:e.x+.5,y:e.y+.5,speed:2.4,nx:null});
      if(G.rats.length===1)announce('Dust bunnies have moved in. They love a messy floor. Tap them to shoo them out!')}
    if(lit<3&&G.rats.length&&Math.random()<.2)G.rats.pop();
    if(lit>=6)hint('dirty','The floors are getting slimy. A Janitor would gobble that right up.');
    checkEnd();}
  if((G.flavorT-=dt)<=0){G.flavorT=rand(30,55);if(!annQ.length)announce(pick(FLAVOR))}
}
function monthEnd(){
  const sal=G.staff.filter(s=>s.state!=='leaving').reduce((a,s)=>a+salary(s),0),heat=G.objs.filter(o=>o.type==='radiator').length*G.heat*CONFIG.radCost;
  spend(sal+heat);G.lastMonth={in:G.mIn,out:G.mOut};
  toast(`${MONTHS[(Math.floor(G.day/30)+11)%12]} report: earned ${money(G.mIn)}, spent ${money(G.mOut)} (salaries ${money(sal)}, heating ${money(heat)})`);
  G.mIn=0;G.mOut=0;refreshCandidates();if(tab==='staff')renderPanel();
}
function goalsDone(){const g=G.L.goals;return {cash:G.cash>=g.cash,rep:G.rep>=g.rep,cured:G.cured>=g.cured}}
function checkEnd(){
  if(G.over)return;const d=goalsDone();
  if(d.cash&&d.rep&&d.cured){G.over=true;store.unlocked=Math.max(store.unlocked||1,G.li+2);saveStore();beep(523,1046,.5);
    showModal(`<h2>Promoted!</h2><p>The board is thrilled with ${G.L.name}. ${G.cured} cured, ${G.died} lost, ${money(G.cash)} in the bank.</p>
    ${G.li<LEVELS.length-1?`<p><b>${LEVELS[G.li+1].name}</b> is now unlocked.</p>`:'<p>You have run every hospital in the land. Everyone, monster and human, is very impressed.</p>'}
    <div class="btns">${G.li<LEVELS.length-1?`<button class="btn" data-go="${G.li+1}">Next hospital</button>`:''}<button class="btn ghost" data-menu>Menu</button></div>`)}

const ptrs=new Map();let drag=null,pinch=null;
function screenToWorld(cx,cy){const r=cv.getBoundingClientRect();return {x:(cx-r.left-CW/2)/cam.z+cam.x,y:(cy-r.top-CH/2)/cam.z+cam.y}}
function worldToTile(w){const a=w.x/(CONFIG.TW/2),b=w.y/(CONFIG.TH/2);return {x:(a+b)/2,y:(b-a)/2}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false};
    if(G&&G.place){const P=G.place,tp=worldToTile(screenToWorld(e.clientX,e.clientY)),tx=Math.floor(tp.x),ty=Math.floor(tp.y);
      // grabbing the ghost drags it around; anywhere else draws (draw mode) or pans
      const onGhost=P.kind==='room'?!!(P.cells&&cellSet(P.cells).has(ck(tx,ty))):(P.x===tx&&P.y===ty);
      if(onGhost)drag.move={tx,ty,rect:P.rect&&{...P.rect},door:P.door&&{...P.door},anchor:P.anchor&&{...P.anchor},ox:P.x,oy:P.y};
      else if(P.kind==='room'&&P.mode==='draw')drag.build={x:tx,y:ty,prev:P.rect,prevCells:P.cells}}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};
    if(drag&&drag.build&&G.place){G.place.rect=drag.build.prev;G.place.cells=drag.build.prevCells;validatePlace()}drag=null}});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){if(e.pointerType==='mouse'&&G&&G.place){const tp=worldToTile(screenToWorld(e.clientX,e.clientY));
    if(G.place.kind==='room'){if(!G.place.cells&&G.place.mode){const m=G.place.size||minSize(G.place.type);G.place.hover={x:Math.floor(tp.x)-(m>>1),y:Math.floor(tp.y)-(m>>1),w:m,h:m}}}else setGhost(tp)}return}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];cam.z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.35,3);return}
  if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;drag.px=e.clientX;drag.py=e.clientY;if(Math.hypot(dx,dy)>8)drag.moved=true;if(!drag.moved)return;
    if(drag.build||drag.move)dragPlaceAt(e.clientX,e.clientY);
    else{cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z}}});
function dragPlaceAt(cx,cy){const P=G&&G.place;if(!P||!drag)return;const tp=worldToTile(screenToWorld(cx,cy)),x2=Math.floor(tp.x),y2=Math.floor(tp.y);
  if(drag.build){const b=drag.build;P.rect={x:Math.min(b.x,x2),y:Math.min(b.y,y2),w:Math.abs(x2-b.x)+1,h:Math.abs(y2-b.y)+1};P.hover=null;setCells(P,b.x,b.y);return}
  const m=drag.move;
  if(P.kind==='obj'){const nx=clamp(m.ox+x2-m.tx,0,G.W-1),ny=clamp(m.oy+y2-m.ty,0,G.H-1);if(nx!==P.x||ny!==P.y)setGhost({x:nx+.5,y:ny+.5});return}
  const R=m.rect,dx=clamp(x2-m.tx,-R.x,G.W-R.x-R.w),dy=clamp(y2-m.ty,-R.y,G.H-R.y-R.h);
  if(P.rect&&P.rect.x===R.x+dx&&P.rect.y===R.y+dy)return;
  P.rect={x:R.x+dx,y:R.y+dy,w:R.w,h:R.h};
  if(m.door)P.door={...m.door,ix:m.door.ix+dx,iy:m.door.iy+dy,ox:m.door.ox+dx,oy:m.door.oy+dy};
  const a=m.anchor||{x:R.x,y:R.y};setCells(P,a.x+dx,a.y+dy)}
// while dragging a room or item near the screen edge, scroll the view along with it
function edgePan(dt){if(!drag||!drag.moved||!(drag.move||drag.build)||drag.px==null)return;const r=cv.getBoundingClientRect(),M=56;
  const vx=drag.px<r.left+M?-(1-(drag.px-r.left)/M):drag.px>r.right-M?1-(r.right-drag.px)/M:0;
  const vy=drag.py<r.top+M?-(1-(drag.py-r.top)/M):drag.py>r.bottom-M?1-(r.bottom-drag.py)/M:0;
  if(!vx&&!vy)return;cam.x+=clamp(vx,-1,1)*520*dt/cam.z;cam.y+=clamp(vy,-1,1)*520*dt/cam.z;dragPlaceAt(drag.px,drag.py)}
// prefab sizes need the whole square free; draw-your-own wraps around whatever is in the way
function setCells(P,sx,sy){P.anchor={x:sx,y:sy};P.cells=P.mode==='draw'?fitCells(P.rect,sx,sy):rectCells(P.rect);
  if(!P.door||!edgeDoors(P.cells).some(d=>sameDoor(d,P.door)))P.door=bestDoor(P.cells);validatePlace()}
function validatePlace(){const P=G.place;if(P.kind==='room')P.msg=P.cells?validateRoom(P.type,P.cells,P.door):P.mode==='prefab'?'Tap the floor to place it':'Drag on the floor to draw the room';updatePlaceBar()}
function endPtr(e){if(drag&&!drag.moved&&ptrs.size===1)tap(e.clientX,e.clientY);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);drag=null;pinch=null});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=clamp(cam.z*(e.deltaY<0?1.1:.9),.35,3)},{passive:false});
function setGhost(tp){const P=G.place;{P.x=Math.floor(tp.x);P.y=Math.floor(tp.y);P.msg=validateObj(P.type,P.x,P.y)}updatePlaceBar()}
function tap(cx,cy){
  if(!G||G.over)return;const w=screenToWorld(cx,cy),tp=worldToTile(w);
  if(G.place&&G.place.kind==='room'){const P=G.place;if(!P.mode)return;const tx=Math.floor(tp.x),ty=Math.floor(tp.y),d=P.cells&&doorAt(P.cells,tp.x,tp.y);
    if(d&&edgeDoors(P.cells).some(q=>sameDoor(q,d)))P.door=d;
    else if(!P.cells||!cellSet(P.cells).has(ck(tx,ty))){const m=P.size||minSize(P.type);P.rect={x:tx-(m>>1),y:ty-(m>>1),w:m,h:m};P.hover=null;P.door=null;setCells(P,tx,ty);return}
    validatePlace();return}
  if(G.place){const P=G.place,ox=P.x,oy=P.y;setGhost(tp);if(P.x===ox&&P.y===oy&&!P.msg)commitPlace();return}
  const hit=(list,r)=>{let best=null,bd=r;for(const a of list){if(a.state==='dead')continue;const c=iso(a.x,a.y),d=Math.hypot(c.x-w.x,c.y-14-w.y);if(d<bd){bd=d;best=a}}return best};
  const rat=hit(G.rats,18);if(rat){squash(rat);return}
  const pt=hit(G.patients,16);
  if(pt&&pt.infected&&G.epidemic){if(G.cash>=CONFIG.vaccineCost){spend(CONFIG.vaccineCost);pt.infected=false;bubble(pt,'Ow! Thanks.');addFx(pt.x,pt.y,'-$60','#ff4f5e');beep(900,700,.1)}else toast('No cash for vaccines');return}
  const a=pt||hit(G.staff,16);if(a){select(a);return}
  const t=T(Math.floor(tp.x),Math.floor(tp.y));
  if(t&&t.room){select(t.room);return}if(t&&t.obj&&t.obj.type!=='desk'){select(t.obj);return}select(null);
}
function startPlace(kind,type){closePanel();select(null);G.place={kind,type,mode:null,size:0,x:null,y:null,rect:null,door:null,msg:kind==='room'?'Pick a size':'Tap the floor to position'};updatePlaceBar()}
function pickSize(v){const P=G.place;if(!P)return;P.rect=null;P.cells=null;P.hover=null;P.door=null;if(v==='draw'){P.mode='draw';P.size=0;P.msg='Drag on the floor to draw the room'}
  else{P.mode='prefab';P.size=+v;P.msg='Tap the floor to place it'}updatePlaceBar()}
$('pSizes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pickSize(b.dataset.size)});
$('pSize').onclick=()=>{const P=G.place;if(P){P.mode=null;P.rect=null;P.cells=null;P.hover=null;P.door=null;P.msg='Pick a size';updatePlaceBar()}};
function commitPlace(){const P=G.place;if(P.kind==='room'){buildRoom(P.type,P.cells,P.door);G.place=null}
  else{buildObj(P.type,P.x,P.y,P.flip);P.x=null;P.msg='Placed. Tap to place another'}updatePlaceBar()}
function updatePlaceBar(){const P=G&&G.place;$('placeBar').classList.toggle('hidden',!P);if(!P)return;
  const name=P.kind==='room'?ROOM_TYPES[P.type].name:OBJ_TYPES[P.type].name;
  $('pSizes').classList.toggle('hidden',!(P.kind==='room'&&!P.mode));$('pSize').classList.toggle('hidden',!(P.kind==='room'&&P.mode));
  if(P.kind==='room'&&!P.mode){const mn=minSize(P.type);$('pSizes').innerHTML=[3,4].map(n=>`<button data-size="${n}" ${n<mn?'disabled':''}>${n}×${n} · ${money(roomCost(P.type,rectCells({x:0,y:0,w:Math.max(n,mn),h:Math.max(n,mn)})))}</button>`).join('')+'<button class="draw" data-size="draw">Draw my own</button>';
    $('pMsg').textContent=`${name}: pick a size`;$('pRot').classList.add('hidden');$('pOk').classList.add('hidden');return}
  $('pOk').classList.remove('hidden');
  if(P.kind==='room'){$('pRot').textContent='Move door';$('pMsg').textContent=P.cells?(P.msg||`${name} ${sizeLabel(P.cells)}: ${money(roomCost(P.type,P.cells))}. Tap a wall to move the door.`):`${name}: ${P.msg}`;
    $('pRot').classList.toggle('hidden',!P.cells);$('pOk').disabled=!P.cells||!!P.msg;return}
  $('pMsg').textContent=P.x==null?name+': '+P.msg:(P.msg||name+': tap again or press Place');$('pRot').textContent='Rotate';$('pRot').classList.remove('hidden');$('pOk').disabled=P.x==null||!!P.msg}
$('pRot').onclick=()=>{const P=G.place;if(P&&P.kind==='obj'){P.flip=!P.flip;return}if(!P||!P.cells)return;const ds=edgeDoors(P.cells);if(!ds.length)return;const i=ds.findIndex(d=>sameDoor(d,P.door));P.door=ds[(i+1)%ds.length];validatePlace()};

document.querySelectorAll('#toolbar button').forEach(b=>b.onclick=()=>{tab=tab===b.dataset.tab?null:b.dataset.tab;if(G&&G.place){G.place=null;updatePlaceBar()}renderPanel()});
function closePanel(){tab=null;renderPanel()}
function renderPanel(){
  document.querySelectorAll('#toolbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const el=$('panel');el.classList.toggle('full',tab==='staff');if(!tab||!G){el.classList.add('hidden');return}el.classList.remove('hidden');let h='';
  if(tab==='rooms')h='<h4>Build a room</h4><div class="grid">'+G.L.rooms.map(k=>{const R=ROOM_TYPES[k];
    return `<button class="card" data-room="${k}" ${G.cash<R.cost?'disabled':''}><b><span class="sw" style="background:${R.color}"></span>${R.name}</b><span class="price">${money(R.cost)}</span><small>${R.desc}</small></button>`}).join('')+'</div>';
  if(tab==='items')h='<h4>Buy items</h4><div class="grid">'+Object.entries(OBJ_TYPES).filter(([k,O])=>!O.hidden&&(G.L.items||[]).includes(k)).map(([k,O])=>
    `<button class="card" data-obj="${k}" ${G.cash<O.cost?'disabled':''}><b>${O.name}</b><span class="price">${money(O.cost)}</span><small>${O.desc}</small></button>`).join('')+'</div>';
  if(tab==='staff'){const cnt=r=>G.staff.filter(s=>s.role===r&&s.state!=='leaving').length,role=G.hireRole||'doctor';
    h=`<div class="stick"><button class="pclose" data-close aria-label="Close">&#10005;</button><h4>Applicants <small style="font-weight:400;opacity:.7">signing fee is half a month's pay. New applicants arrive every month.</small></h4>
    <div class="chips">${Object.entries(STAFF_TYPES).map(([k,S])=>`<button class="chip ${k===role?'on':''}" data-hrole="${k}">${S.name}s (${cnt(k)})</button>`).join('')}<button class="chip" data-newapps>New applicants ($150)</button></div></div>
    <div class="grid">${G.cands[role].map((c,i)=>`<div class="card cand"><b>${c.name}</b><div>${rankHTML(c)} ${badgeHTML(c)}</div>${pipsHTML('Stamina',c.stamina)}${pipsHTML('Focus',c.focus)}
      <span class="price">${money(salary(c))}/month</span><div class="blurb">${c.blurb}</div><button class="btn" data-hirec="${i}">Hire (${money(Math.round(salary(c)*.5))} fee)</button></div>`).join('')}</div>
    <small>Juniors are cheap and learn fast but are slow and make mistakes. Consultants are quick and clever, and can teach. Stamina: how long before they need a nap. Focus: high works faster in busy rooms, low walks faster.</small>`;}
  if(tab==='hosp'){const g=G.L.goals,d=goalsDone(),sal=G.staff.reduce((a,s)=>a+salary(s),0),nr=G.objs.filter(o=>o.type==='radiator').length,pr=RESEARCH[G.resI],hasLab=G.L.rooms.includes('research');
    h=`<h4>${G.L.name}</h4><div class="goal ${d.cash?'done':''}"><span>Bank balance</span><b>${money(G.cash)} / ${money(g.cash)}</b></div>
    <div class="goal ${d.rep?'done':''}"><span>Reputation</span><b>${Math.round(G.rep)} / ${g.rep}</b></div><div class="goal ${d.cured?'done':''}"><span>Patients cured</span><b>${G.cured} / ${g.cured}</b></div>
    <label for="price">Treatment prices: ${Math.round(G.price*100)}%</label><input id="price" type="range" min="50" max="200" step="10" value="${G.price*100}">
    <small>Higher prices earn more but some patients refuse, and cures earn less reputation.</small>
    ${G.L.f.temp?`<label for="heat">Radiator power: ${['Off','Low','Medium','High','Sauna'][G.heat]} (${nr} radiators, ${money(nr*G.heat*CONFIG.radCost)}/month)</label><input id="heat" type="range" min="0" max="4" step="1" value="${G.heat}">
    <small>Patients feel ${Math.round(G.temp)}°C on average. Radiators warm the tiles around them (blue floor = cold, orange = hot). Aim for 17–25°C.</small>`:''}
    ${hasLab?`<h4 style="margin-top:12px">Mad Lab research</h4>${pr?`<div class="goal"><span>${pr.name}: ${pr.desc}</span><b>${Math.floor(G.rp/pr.cost*100)}%</b></div>`:'<div class="goal done"><span>Everything invented!</span></div>'}
    ${RESEARCH.slice(0,G.resI).map(r=>`<div class="goal done"><span>${r.name}</span><b>Done</b></div>`).join('')}${G.rooms.some(r=>r.type==='research')?'':'<small>Build a Mad Lab and give it a Doctor to start inventing.</small>'}`:''}
    <div class="goal"><span>Monthly salaries</span><b>${money(sal)}</b></div><div class="goal"><span>Last month in / out</span><b>${money(G.lastMonth.in)} / ${money(G.lastMonth.out)}</b></div>
    <div class="goal"><span>Fainted / stormed out</span><b>${G.died} / ${G.sentHome}</b></div><div class="goal"><span>Art style</span><span><button class="chip ${artOn?'on':''}" data-art="sylli">Sylli Town</button> <button class="chip ${artOn?'':'on'}" data-art="classic">Classic</button></span></div>
    <div class="btns"><button class="btn red" data-quit>Quit to menu</button></div>`}
  if(tab!=='staff')h='<button class="pclose" data-close aria-label="Close">&#10005;</button>'+h;
  el.innerHTML=h;
  const pr=$('price'),ht=$('heat');if(pr)pr.oninput=()=>{G.price=pr.value/100;el.querySelector('label[for=price]').textContent=`Treatment prices: ${pr.value}%`};
  if(ht)ht.oninput=()=>{G.heat=+ht.value;renderPanel()};
}
$('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.room)startPlace('room',b.dataset.room);if(b.dataset.obj)startPlace('obj',b.dataset.obj);
  if(b.dataset.quit!=null){G.prevSpeed=speed||1;setSpeed(0);showModal(`<h2>Quit to menu?</h2><p>You will lose everything at ${G.L.name}: rooms, staff and money. Unlocked hospitals stay unlocked.</p>
    <div class="btns"><button class="btn ghost" data-resume>Keep playing</button><button class="btn red" data-menu>Yes, quit</button></div>`)}
  if(b.dataset.close!=null){closePanel();return}
  if(b.dataset.art){artOn=b.dataset.art==='sylli';store.art=artOn?'sylli':'classic';saveStore();renderPanel();return}
  if(b.dataset.hrole){G.hireRole=b.dataset.hrole;renderPanel()}
  if(b.dataset.newapps!=null){if(G.cash<150)toast('Not enough cash');else{spend(150);refreshCandidates(G.hireRole||'doctor');renderPanel()}}
  if(b.dataset.hirec!=null){const role=G.hireRole||'doctor',i=+b.dataset.hirec;if(hireCandidate(G.cands[role][i])){G.cands[role][i]=makeCandidate(role);renderPanel()}}});

// =================== HUD, speed, modal ===================
function setSpeed(s){speed=s;document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s))}
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
$('voiceBtn').onclick=()=>{voiceOn=!voiceOn;$('voiceBtn').textContent=voiceOn?'PA on':'PA off';if(!voiceOn)try{speechSynthesis.cancel()}catch(e){}};
function updateHUD(){if(!G)return;const g=G.L.goals,d=goalsDone();
  $('hCash').textContent=money(G.cash);$('hCash').className=G.cash<0?'bad':d.cash?'good':'';
  $('hRep').textContent=Math.round(G.rep);$('hRep').className=G.rep<25?'bad':d.rep?'good':'';
  $('hCured').textContent=G.cured+'/'+g.cured;$('hCured').className=d.cured?'good':'';
  const m=Math.floor(G.day/30);$('hDate').textContent=`${MONTHS[m%12]} ${G.day%30+1}, Yr ${Math.floor(m/12)+1}`;
  $('hTemp').textContent=Math.round(G.temp)+'°';$('hTemp').className=G.temp<17||G.temp>25?'bad':'';
  const eb=$('eventBar');let t='';
  if(G.emergency){const e=G.emergency;t=`Emergency: ${DISEASES[e.dis].name} — ${e.cured}/${e.total} cured — ${Math.ceil(e.t)}s`}
  else if(G.epidemic){t=`Hiccups: tap green faces for a shot ($60) — ${G.patients.filter(p=>p.infected&&p.state!=='dead').length} infected — inspector in ${Math.ceil(G.epidemic.t)}s`}
  eb.textContent=t;eb.classList.toggle('hidden',!t);
  if(tab&&tab!=='hosp'){document.querySelectorAll('#panel .card[data-room],#panel .card[data-obj]').forEach(b=>{const c=b.dataset.room?ROOM_TYPES[b.dataset.room].cost:OBJ_TYPES[b.dataset.obj].cost;b.disabled=G.cash<c})}
  if(selected&&selected.kind==='patient'&&!G.patients.includes(selected))select(null);
  else if(selected&&selected.kind==='staff'&&!G.staff.includes(selected))select(null);
  else if(selected&&(selected.kind==='patient'||selected.kind==='staff'))renderInfo();
}
function showModal(h){$('modal').innerHTML=`<div class="mbox">${h}</div>`;$('modal').classList.remove('hidden')}
function hideModal(){$('modal').classList.add('hidden')}
$('modal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(er){}
  if(b.dataset.go!=null){hideModal();setSpeed(1);newGame(+b.dataset.go)}if(b.dataset.start!=null){hideModal();setSpeed(1)}if(b.dataset.resume!=null){hideModal();setSpeed(G&&G.prevSpeed||1)}if(b.dataset.menu!=null)menu()});
document.addEventListener('click',e=>{if(e.target.closest('[data-menu]')&&!e.target.closest('#modal'))menu()});
function menu(){G=null;selected=null;tab=null;renderPanel();renderInfo();$('placeBar').classList.add('hidden');$('eventBar').classList.add('hidden');const un=store.unlocked||1;
  showModal(`${ART.logo&&artOn?'<img src="art/logo.webp" alt="Sylli Town Monster Hospital" style="display:block;width:min(300px,80%);margin:0 auto 4px">':'<h1>Monster <span>General</span></h1>'}<p style="margin:6px 0 14px;opacity:.8">The hospital where monsters and humans get better together. Mostly.</p>
  ${LEVELS.map((L,i)=>`<button class="lvl" data-go="${i}" ${i>=un?'disabled':''}><span><b>${i+1}. ${L.name}</b><small>${i>=un?'Locked — finish the previous hospital':L.blurb}</small></span><span>${i>=un?'Locked':'Play'}</span></button>`).join('')}
  <details style="margin-top:10px"><summary style="font-weight:600;cursor:pointer;min-height:32px">How to run a hospital</summary><ul>
  <li>Patients go: front desk → Check-Up Room (diagnosis) → treatment room → pay up → home.</li>
  <li>Build rooms from <b>Rooms</b>: pick 3×3, 4×4 or Draw my own, tap or drag on the floor, tap a wall to put the door there, then press Place.</li>
  <li>Hire a Receptionist, Doctors, Nurses and a Janitor from <b>Staff</b>. Staff walk to rooms that need them.</li>
  <li>Tired staff misdiagnose. A Staff Room fixes that. Messy floors bring dust bunnies — tap them to shoo them away.</li>
  <li>Each new hospital adds a couple of new rooms or problems, and explains them when you arrive.</li>
  <li>Drag to pan, pinch or scroll to zoom. Tap anyone or any room for details.</li></ul></details>`)}

// =================== loop ===================
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;animT+=dt;edgePan(dt);
  if(G&&!G.over&&speed>0)for(let i=0;i<speed;i++)update(dt);
  if(annT>0)annT-=dt;else if(annQ.length)showNextAnnouncement();
  if(toastT>0&&(toastT-=dt)<=0)$('toast').classList.add('hidden');
  if((hudT-=dt)<=0){hudT=.25;updateHUD()}
  try{render()}catch(e){console.error(e)}requestAnimationFrame(loop)}
addEventListener('resize',()=>{resize()});
window.BP={get G(){return G},quickRoom,hireCandidate,makeCandidate,cam,buildRoom,validateRoom,validateObj,hire,buildObj,spawnPatient,sendTrain};
resize();menu();requestAnimationFrame(loop);
}
</script>
</body>
