<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Rubik+Doodle+Shadow&family=Silkscreen&display=swap">
<style>
/* Layout: a full-screen street scene with the Monster Pizza shop, then one sideways
   hallway built from repeating wall segments — one segment per arcade cabinet. */
:root{
  --ink:#1f1512;      /* marker lines */
  --sauce:#d6452d;    /* shop red */
  --cheese:#f4b63e;   /* signs, highlights */
  --basil:#3d8752;    /* wainscot green */
  --dusk:#2a2147;     /* night sky */
  --paper:#fbf0d6;    /* notes, bubbles */
  --f-display:"Rubik Doodle Shadow","Gaegu","Comic Sans MS",cursive;
  --f-body:"Gaegu","Comic Sans MS","Chalkboard SE",cursive;
  --f-arcade:"Silkscreen","Courier New",monospace;
  --u:9px;            /* 1/100 of the hallway height, set by script */
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--dusk);color:var(--paper);font-family:var(--f-body);font-size:20px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px dashed var(--cheese);outline-offset:4px}

/* ---------- Intro: the street ---------- */
#intro{position:fixed;inset:0;overflow:hidden;background:var(--dusk);z-index:20}
#town{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 80%;transition:transform .9s cubic-bezier(.6,0,.35,1),opacity .9s}
#intro.entering #town{transform:scale(4.5);opacity:0}
#intro.entering .bubble,#intro.entering .enter{opacity:0;transition:opacity .3s}
#shutter{position:absolute;inset:0;z-index:5;cursor:pointer;display:grid;place-items:center;border:0;padding:0;width:100%;
  background:repeating-linear-gradient(#8d8a96 0 22px,#6d6a78 22px 26px,#a19eaa 26px 28px);
  transition:transform 1.1s cubic-bezier(.7,0,.3,1)}
#shutter.up{transform:translateY(-102%)}
#shutter .tag{font-family:var(--f-display);font-size:clamp(34px,9vw,84px);line-height:1;color:var(--sauce);background:var(--paper);
  padding:.25em .5em .3em;border:4px solid var(--ink);transform:rotate(-4deg);box-shadow:8px 8px 0 var(--ink);filter:url(#wob)}
#shutter .tag small{display:block;font-family:var(--f-body);font-size:.32em;color:var(--ink);text-align:center;margin-top:.2em}
#shutter .lockwrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(86vw,760px)}
#shutter .lockup{width:100%;height:auto;display:block;filter:drop-shadow(6px 8px 0 rgba(31,21,18,.45));transform:rotate(-3deg)}
#shutter .tap{font-family:var(--f-body);font-weight:700;font-size:clamp(20px,3.6vw,30px);color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:14px;padding:2px 16px;box-shadow:4px 4px 0 var(--ink);transform:rotate(1.5deg)}
#shutter::after{content:"";position:absolute;left:50%;bottom:6%;width:60px;height:14px;margin-left:-30px;background:var(--ink);border-radius:8px}
.bubble{position:absolute;left:50%;top:calc(4% + env(safe-area-inset-top,0px));transform:translateX(-50%) rotate(-1.5deg);
  width:min(88vw,560px);box-sizing:border-box;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:28px;
  padding:14px 22px 16px;font-size:clamp(21px,4.6vw,32px);font-weight:700;line-height:1.15;text-align:center;filter:url(#wob);min-height:2.6em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-26px;border:14px solid transparent;border-top:16px solid var(--ink);margin-left:-14px}
.bubble em{font-style:normal;color:var(--sauce)}
.caret{display:inline-block;width:.45em;border-bottom:3px solid var(--ink);animation:blink 1s steps(1) infinite}
.enter{position:absolute;left:50%;bottom:calc(4% + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(1deg);z-index:2;
  font-family:var(--f-display);font-size:clamp(26px,6vw,44px);color:var(--ink);background:var(--cheese);border:4px solid var(--ink);
  border-radius:18px;padding:.15em .7em .25em;cursor:pointer;box-shadow:6px 6px 0 var(--ink);white-space:nowrap;
  transition:transform .15s,box-shadow .15s,opacity .4s}
.enter:hover{transform:translateX(-50%) rotate(-1deg) scale(1.05)}
.enter:active{box-shadow:2px 2px 0 var(--ink);transform:translateX(-50%) translate(4px,4px)}
.enter[data-wait]{opacity:0;pointer-events:none}

/* ---------- The hallway ---------- */
#hall{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;background:var(--ink);scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab}
#hall::-webkit-scrollbar{display:none}
#hall.dragging{cursor:grabbing}
#hall.dragging .cab{pointer-events:none}
#track{position:relative;height:100%;display:flex;width:max-content}
.seg{position:relative;flex:none;height:100%;overflow:hidden;z-index:1}
#bgstrip{position:absolute;left:0;top:0;height:100%;display:flex;z-index:0;pointer-events:none;overflow:hidden}
#bgstrip img{height:100%;width:auto;flex:none;display:block;user-select:none}
#floor{position:absolute;left:0;bottom:0;z-index:0;pointer-events:none;background-repeat:repeat-x;background-position:0 0}
.seg>.wall{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
#lights{position:fixed;left:0;right:0;top:0;height:calc(15*var(--u));pointer-events:none;background-repeat:repeat-x;z-index:3}

/* cabinet */
.cab{position:absolute;left:calc(50% - 20.5*var(--u));top:calc(19*var(--u));width:calc(41*var(--u));height:calc(74*var(--u));
  display:block;color:var(--ink);text-decoration:none;--cab:#2f7fd0;transition:transform .2s;z-index:1}
.cab:hover,.cab:focus-visible{transform:translateY(calc(-1*var(--u)))}
.cab:hover .shell,.cab:focus-visible .shell{animation:boil .45s steps(1) infinite}
.cab .shadow{position:absolute;left:-8%;right:-8%;bottom:-2.5%;height:6%;background:radial-gradient(ellipse at 50% 40%,rgba(20,8,4,.6),rgba(20,8,4,0) 70%);border-radius:50%}
.shell{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:url(#wob)}
.shell .body{fill:var(--cab);stroke:var(--ink);stroke-width:calc(.7*var(--u));stroke-linejoin:round}
.shell .side{fill:rgba(0,0,0,.18)}
.shell .kick{fill:var(--ink)}
.cab .marquee{position:absolute;left:8%;right:8%;top:3%;height:13%;background:var(--cheese);border:calc(.5*var(--u)) solid var(--ink);
  border-radius:calc(.8*var(--u));overflow:hidden;display:grid;place-items:center;box-shadow:0 0 calc(3*var(--u)) rgba(255,214,120,.55)}
.cab .marquee img{width:100%;height:100%;object-fit:cover;display:block}
.cab .marquee span{font-family:var(--f-display);font-size:calc(3.4*var(--u));line-height:1;text-align:center;padding:0 4%;text-wrap:balance}
.cab .bezel{position:absolute;left:15%;right:15%;top:23.5%;height:31%;background:#120c0a;border:calc(.5*var(--u)) solid var(--ink);
  border-radius:calc(1*var(--u));padding:calc(1.4*var(--u));box-sizing:border-box}
.cab .screen{display:block;position:relative;width:100%;height:100%;overflow:hidden;border-radius:calc(1.6*var(--u))/calc(2.4*var(--u));background:#04140c}
.cab .screen img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.cab .screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,.22) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.12),transparent 60%)}
.attract{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.2*var(--u));
  text-align:center;font-family:var(--f-arcade);color:var(--cab);background:radial-gradient(circle at 50% 50%,#0d2a1d,#030a06)}
.attract b{font-weight:400;font-size:calc(2.2*var(--u));line-height:1.1;color:#fff4c9;text-shadow:0 0 6px var(--cab);padding:0 6%;text-wrap:balance}
.attract i{font-style:normal;font-size:calc(1.5*var(--u));color:var(--cheese);animation:blink 1.1s steps(1) infinite}
.cab .panel{position:absolute;left:6%;right:6%;top:58%;height:8%;background:#2a2023;border:calc(.5*var(--u)) solid var(--ink);
  border-radius:calc(.6*var(--u));transform:perspective(calc(20*var(--u))) rotateX(28deg);display:flex;align-items:center;justify-content:center;gap:9%}
.cab .panel .stick{width:calc(2.2*var(--u));height:calc(2.2*var(--u));border-radius:50%;background:var(--sauce);border:calc(.35*var(--u)) solid var(--ink);margin-right:10%}
.cab .panel .btn{width:calc(2*var(--u));height:calc(2*var(--u));border-radius:50%;background:var(--cheese);border:calc(.35*var(--u)) solid var(--ink)}
.cab .panel .btn+.btn{background:#59c3ff}
.cab .coin{position:absolute;left:33%;right:33%;top:72%;height:14%;background:#3a3036;border:calc(.45*var(--u)) solid var(--ink);
  border-radius:calc(.5*var(--u));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(.6*var(--u))}
.cab .coin s{display:block;width:calc(.8*var(--u));height:calc(2.6*var(--u));background:#d24a2f;box-shadow:0 0 calc(1*var(--u)) #ff7b55;border-radius:2px;text-decoration:none}
.cab .coin small{font-family:var(--f-arcade);font-size:calc(1.05*var(--u));color:var(--cheese);letter-spacing:.06em;white-space:nowrap}

/* a cabinet drawn as one piece of art */
.cab.art{width:calc(74*var(--u)*var(--ar,.54));left:50%;transform:translateX(-50%);filter:drop-shadow(0 0 calc(2*var(--u)) rgba(255,214,120,.25))}
.cab.art:hover,.cab.art:focus-visible{transform:translateX(-50%) translateY(calc(-1*var(--u))) rotate(-.6deg)}
.cab.art .cabimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.cab.art .artscreen{position:absolute;overflow:hidden;border-radius:calc(1*var(--u))}
.cab.art .artscreen img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.cab.art .shadow{left:4%;right:4%}

/* the paper note pinned beside each cabinet */
.note{position:absolute;left:calc(50% + 25*var(--u));top:calc(24*var(--u));width:calc(22*var(--u));box-sizing:border-box;
  background:var(--paper);color:var(--ink);padding:calc(1.6*var(--u)) calc(1.6*var(--u)) calc(1.8*var(--u));
  transform:rotate(3deg);box-shadow:3px 4px 0 rgba(0,0,0,.25);filter:url(#wob);font-size:calc(2*var(--u));line-height:1.1}
.note::before{content:"";position:absolute;left:50%;top:calc(-1.4*var(--u));width:calc(8*var(--u));height:calc(2.6*var(--u));margin-left:calc(-4*var(--u));
  background:rgba(255,236,170,.75);transform:rotate(-6deg)}
.note h3{margin:0 0 calc(.6*var(--u));font-size:calc(2.8*var(--u));line-height:1;text-wrap:balance}
.note p{margin:0}
.note .num{font-family:var(--f-arcade);font-size:calc(1.2*var(--u));color:var(--sauce);display:block;margin-bottom:calc(.6*var(--u));letter-spacing:.08em}

.exitdoor{position:absolute;left:calc(14*var(--u));top:calc(30*var(--u));width:calc(26*var(--u));height:calc(52*var(--u));
  background:transparent;border:0;cursor:pointer;border-radius:calc(2*var(--u))}

/* ---------- Top bar + menu ---------- */
.topbar{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px))}
.topbar>*{pointer-events:auto}
.logo{font-family:var(--f-display);font-size:clamp(22px,4.4vw,34px);line-height:1;background:var(--sauce);color:var(--paper);
  border:3px solid var(--ink);border-radius:14px;padding:.12em .45em .2em;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.logo:has(img){background:none;border:0;box-shadow:none;padding:0;transform:rotate(-3deg)}
.logo img{display:block;width:clamp(150px,22vw,230px);height:auto;filter:drop-shadow(3px 4px 0 rgba(31,21,18,.55))}
.burger{width:54px;height:50px;border-radius:14px;background:var(--cheese);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  cursor:pointer;display:grid;place-items:center;padding:0}
.burger svg{width:30px;height:26px;filter:url(#wob)}
.burger svg path{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none;transition:transform .2s;transform-origin:center}
.burger[aria-expanded="true"] svg path:nth-child(1){transform:translateY(9px) rotate(45deg)}
.burger[aria-expanded="true"] svg path:nth-child(2){opacity:0}
.burger[aria-expanded="true"] svg path:nth-child(3){transform:translateY(-9px) rotate(-45deg)}
#menu{position:fixed;z-index:7;right:calc(12px + env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));
  width:min(320px,calc(100vw - 24px));max-height:calc(100% - 110px);overflow:auto;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:10px}
#menu h2{font-family:var(--f-arcade);font-weight:400;font-size:13px;letter-spacing:.12em;margin:6px 10px 8px;color:var(--sauce)}
#menu ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#menu button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;
  padding:8px 10px;cursor:pointer;font-size:22px;font-weight:700;line-height:1.05}
#menu button:hover,#menu button[aria-current="true"]{background:rgba(244,182,62,.45)}
#menu .chip{flex:none;width:22px;height:28px;border:3px solid var(--ink);border-radius:5px 5px 2px 2px}
#menu .num{font-family:var(--f-arcade);font-size:12px;font-weight:400;margin-left:auto;opacity:.6}
#menu hr{border:0;border-top:2px dashed rgba(31,21,18,.3);margin:8px 6px}

.nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:12px}
.nav button{width:54px;height:48px;border-radius:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-size:24px;font-weight:700;padding:0}
.nav button:disabled{opacity:.35;cursor:default}
.nav output{font-family:var(--f-arcade);font-size:14px;color:var(--paper);background:var(--ink);padding:6px 10px;border-radius:8px;
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Game player ---------- */
#player{position:fixed;inset:0;z-index:30;background:var(--ink);display:flex;flex-direction:column}
#player .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));background:var(--sauce)}
#player .bar button{background:var(--cheese);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:2px 14px;font-weight:700;cursor:pointer;font-size:20px}
#player .bar strong{font-family:var(--f-display);font-weight:400;font-size:24px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player .bar a{color:var(--paper);font-weight:700}
#frame{flex:1;width:100%;border:0;background:#000}

@keyframes blink{50%{opacity:0}}
@keyframes boil{0%{filter:url(#wob)}50%{filter:url(#wob2)}}
@media (prefers-reduced-motion:reduce){
  #town,#shutter,.cab{transition:none}
  .attract i,.caret{animation:none}
  .cab:hover .shell{animation:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  <filter id="wob2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

<!-- The street -->
<section id="intro" aria-label="Monster Pizza, outside">
  <canvas id="town" aria-hidden="true"></canvas>
  <div class="bubble" aria-live="polite"><span id="say"></span><span class="caret"></span></div>
  <button class="enter" id="enterBtn" data-wait>Come on in!</button>
  <button id="shutter" aria-label="Open the shop">
    <span class="lockwrap"><img class="lockup" src="art/logo.webp" alt="Monster Pizza" draggable="false"><span class="tap">tap to open up</span></span>
  </button>
</section>

<!-- The arcade hallway -->
<main id="hall" tabindex="0" aria-label="Arcade hallway. Scroll sideways to see the games." hidden>
  <div id="track"></div>
</main>
<div id="lights" aria-hidden="true" hidden></div>

<div class="topbar" id="topbar" hidden>
  <button class="logo" id="logoBtn" title="Back outside"><img src="art/logo-small.webp" alt="Monster Pizza" draggable="false"></button>
  <button class="burger" id="burger" aria-expanded="false" aria-controls="menu" aria-label="Game list">
    <svg viewBox="0 0 30 26"><path d="M3 4 L27 4"/><path d="M3 13 L27 13"/><path d="M3 22 L27 22"/></svg>
  </button>
</div>
<nav id="menu" hidden aria-label="Games">
  <h2>THE ARCADE</h2>
  <ol id="menuList"></ol>
  <hr>
  <ol><li><button id="menuOutside"><span class="chip" style="background:var(--sauce)"></span>Back outside</button></li></ol>
</nav>
<div class="nav" id="nav" hidden>
  <button id="prev" aria-label="Previous game">&lsaquo;</button>
  <output id="count">1 / 1</output>
  <button id="next" aria-label="Next game">&rsaquo;</button>
</div>

<!-- Game player -->
<div id="player" hidden>
  <div class="bar">
    <button id="closePlayer">&larr; Back to the arcade</button>
    <strong id="playerTitle"></strong>
    <a id="playerOpen" href="#" target="_blank" rel="noopener">Open in its own tab &nearr;</a>
  </div>
  <iframe id="frame" title="Game" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>
</div>

<script>document.write('<script src="games.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
"use strict";
const CFG = window.MONSTER_PIZZA || {};
const GAMES = CFG.games || [];
const WALLS = CFG.walls || [];
const INK = "#1f1512";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
const $ = (id) => document.getElementById(id);

/* ============ hand-drawn pen ============ */
function seeded(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function pen(ctx, seed, wob) {
  const r = seeded(seed), j = () => (r() - .5) * 2 * wob;
  const P = {
    r,
    line(x1, y1, x2, y2, w = 2, c = INK, n = 2) {
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (let i = 0; i < n; i++) {
        ctx.beginPath(); ctx.moveTo(x1 + j(), y1 + j());
        ctx.quadraticCurveTo((x1 + x2) / 2 + j() * 1.4, (y1 + y2) / 2 + j() * 1.4, x2 + j(), y2 + j());
        ctx.stroke();
      }
    },
    shape(pts, fill, w = 2, c = INK) {
      ctx.beginPath();
      pts.forEach(([x, y], i) => i ? ctx.lineTo(x + j() * .4, y + j() * .4) : ctx.moveTo(x + j() * .4, y + j() * .4));
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (w) for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; P.line(a[0], a[1], b[0], b[1], w, c); }
    },
    rect(x, y, w, h, fill, lw = 2, c = INK) { P.shape([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, lw, c); },
    circ(cx, cy, rx, ry, fill, lw = 2, c = INK) {
      ry = ry || rx;
      const n = Math.max(12, Math.min(40, rx / 2 | 0));
      for (let pass = 0; pass < (lw ? 2 : 1); pass++) {
        ctx.beginPath();
        const o = r() * 0.4;
        for (let k = 0; k <= n; k++) {
          const a = k / n * Math.PI * 2 + o;
          const x = cx + Math.cos(a) * (rx + j() * .35), y = cy + Math.sin(a) * (ry + j() * .35);
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        if (pass === 0 && fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = c; ctx.stroke(); }
      }
    },
  };
  return P;
}

/* ============ the street ============ */
const intro = $("intro"), town = $("town"), tctx = town.getContext("2d");
let TW = 0, TH = 0, frame = 0, mouth = null, eyeTarget = { x: .5, y: .3 }, townTimer = 0;
const L = seeded(42);
const skyline = [];
for (let i = 0; i < 40; i++) skyline.push({ w: 60 + L() * 90, h: .18 + L() * .3, c: ["#3b2f5c", "#45376a", "#352a52", "#4f3d76"][i % 4],
  lit: Array.from({ length: 30 }, () => L() > .55) });
const stars = Array.from({ length: 50 }, () => [L(), L() * .5, .6 + L() * 1.4]);
const walkers = Array.from({ length: 8 }, (_, i) => ({ x0: L(), sp: (L() > .5 ? 1 : -1) * (22 + L() * 30), size: 16 + L() * 12,
  col: ["#59c3ff", "#9adf5e", "#ff8fb1", "#c9a2ff", "#ffcf5a", "#7be0c9", "#ff9a5c", "#b6b2c4"][i], horns: L() > .45, eyes: L() > .7 ? 3 : 2 }));

const LOGO = new Image();
LOGO.onload = () => { if (!intro.hidden) drawTown(performance.now() / 1000); };
LOGO.src = CFG.logo || "art/logo.webp";

function sizeTown() {
  TW = intro.clientWidth; TH = intro.clientHeight;
  town.width = TW * DPR; town.height = TH * DPR;
}
function drawTown(t) {
  const c = tctx, W = TW, H = TH;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const p = pen(c, 1 + (frame % 3), Math.max(1.2, H / 420));

  const g = c.createLinearGradient(0, 0, 0, H * .8);
  g.addColorStop(0, "#211a3d"); g.addColorStop(.6, "#4a2f5e"); g.addColorStop(1, "#c4614a");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = "#fff4c9";
  stars.forEach(([x, y, s]) => { c.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * 1.3 + x * 20)); c.fillRect(x * W, y * H, s, s); });
  c.globalAlpha = 1;
  p.circ(W * .12, H * .13, Math.min(W, H) * .05, 0, "#fbf0d6", lw);
  const G = H * .8;

  let x = -20, k = 0;
  while (x < W + 20) {
    const b = skyline[k % skyline.length], bh = b.h * H;
    p.rect(x, G - bh, b.w, bh + 4, b.c, lw * .8, "#1b1430");
    let wi = 0;
    for (let wy = G - bh + 14; wy < G - 22; wy += 26) for (let wx = x + 12; wx < x + b.w - 18; wx += 22) {
      if (b.lit[wi++ % 30]) { c.fillStyle = "#ffd77a"; c.fillRect(wx, wy, 10, 12); }
    }
    x += b.w + 4; k++;
  }
  // street
  p.rect(-10, G, W + 20, H * .06, "#8b7f92", lw);
  c.fillStyle = "#2b2433"; c.fillRect(0, G + H * .06, W, H);
  for (let dx = (-(t * 0) % 80); dx < W; dx += 80) p.line(dx, G + H * .13, dx + 40, G + H * .13, lw * 1.4, "#f4b63e", 1);

  // ---- Monster Pizza ----
  const bw = Math.min(W * .9, H * .55), bh = bw * .74, bx = (W - bw) / 2, by = G - bh;
  // horns
  p.shape([[bx + bw * .02, by + bh * .14], [bx - bw * .03, by - bh * .1], [bx + bw * .14, by + bh * .1]], "#fbf0d6", lw);
  p.shape([[bx + bw * .98, by + bh * .14], [bx + bw * 1.03, by - bh * .1], [bx + bw * .86, by + bh * .1]], "#fbf0d6", lw);
  // body with lumpy roof
  const roof = [];
  for (let i = 0; i <= 10; i++) roof.push([bx + bw * i / 10, by + bh * .08 + (i % 2 ? -bh * .03 : 0)]);
  p.shape([...roof, [bx + bw, G], [bx, G]], "#d6452d", lw * 1.3);
  // fur scribbles
  for (let i = 0; i < 14; i++) { const fx = bx + bw * (.05 + (i * .067)), fy = by + bh * (.2 + (i % 3) * .1);
    if (fx > bx + bw * .42 && fx < bx + bw * .58 && fy > by + bh * .5) continue;
    p.line(fx, fy, fx + bw * .015, fy + bh * .03, lw * .7, "#a8301f", 1); }

    const lx = bx + (bw - lw2) / 2, ly = by + bh * .1 - lh2;
    p.line(bx + bw * .3, ly + lh2 * .7, bx + bw * .3, by + bh * .1, lw * 1.2, INK, 1);
    p.line(bx + bw * .7, ly + lh2 * .7, bx + bw * .7, by + bh * .1, lw * 1.2, INK, 1);
    c.save(); c.translate(lx + lw2 / 2, ly + lh2 / 2); c.rotate(-.025 + (frame % 3) * .005);
    c.drawImage(LOGO, -lw2 / 2, -lh2 / 2, lw2, lh2); c.restore();
  } else {
  const sx = bx + bw * .13, sy = by - bh * .1, sw = bw * .74, sh = bh * .2;
  p.line(sx + sw * .2, sy + sh, sx + sw * .2, by + bh * .12, lw, INK, 1);
  p.line(sx + sw * .8, sy + sh, sx + sw * .8, by + bh * .12, lw, INK, 1);
  p.rect(sx, sy, sw, sh, "#f4b63e", lw * 1.3);
  c.fillStyle = INK; c.textAlign = "center"; c.textBaseline = "middle";
  let fs = sh * .62; c.font = `${fs}px "Rubik Doodle Shadow", "Gaegu", cursive`;
  while (c.measureText("MONSTER PIZZA").width > sw * .9 && fs > 8) { fs -= 1; c.font = `${fs}px "Rubik Doodle Shadow", "Gaegu", cursive`; }
  c.save(); c.translate(sx + sw / 2, sy + sh * .54); c.rotate(-.02 + (frame % 3) * .006); c.fillText("MONSTER PIZZA", 0, 0); c.restore();
  }
  // eyes
  const blink = (t % 4.2) < .14;
  [.3, .7].forEach((ex) => {
    const cx = bx + bw * ex, cy = by + bh * .34, er = bw * .1;
    if (blink) { p.circ(cx, cy, er, er, "#a8301f", lw * 1.2); p.line(cx - er, cy, cx + er, cy, lw * 1.4); return; }
    p.circ(cx, cy, er, er, "#fbf0d6", lw * 1.2);
    const ax = (eyeTarget.x * W - cx), ay = (eyeTarget.y * H - cy), d = Math.hypot(ax, ay) || 1, m = Math.min(er * .45, d * .1);
    p.circ(cx + ax / d * m, cy + ay / d * m, er * .42, er * .42, INK, 0);
    c.fillStyle = "#fff"; c.fillRect(cx + ax / d * m - er * .18, cy + ay / d * m - er * .2, er * .12, er * .12);
    p.line(cx - er * 1.1, cy - er * 1.25, cx + er * .9, cy - er * (ex < .5 ? 1.0 : 1.5), lw * 1.6);
  });
  // windows with pizza
  [[.06], [.72]].forEach(([wx]) => {
    const x0 = bx + bw * wx, y0 = by + bh * .58, ww = bw * .22, wh = bh * .26;
    p.rect(x0, y0, ww, wh, "#ffd77a", lw * 1.1);
    p.line(x0 + ww / 2, y0, x0 + ww / 2, y0 + wh, lw * .8, INK, 1);
    p.shape([[x0 + ww * .15, y0 + wh * .25], [x0 + ww * .42, y0 + wh * .3], [x0 + ww * .26, y0 + wh * .85]], "#f4b63e", lw * .7);
    p.circ(x0 + ww * .27, y0 + wh * .45, ww * .035, 0, "#d6452d", 0);
    // awning
    for (let i = 0; i < 5; i++) p.shape([[x0 - ww * .06 + i * ww * .224, y0 - wh * .2], [x0 - ww * .06 + (i + 1) * ww * .224, y0 - wh * .2],
      [x0 - ww * .06 + (i + 1) * ww * .224, y0 - wh * .02], [x0 - ww * .06 + i * ww * .224, y0 - wh * .02]], i % 2 ? "#fbf0d6" : "#3d8752", lw * .6);
  });

  const mx = bx + bw * .34, my = by + bh * .55, mw = bw * .32, mh = G - my;
  mouth = { x: mx, y: my, w: mw, h: mh };
  p.shape([[mx, G], [mx, my + mh * .25], [mx + mw * .15, my], [mx + mw * .85, my], [mx + mw, my + mh * .25], [mx + mw, G]], "#160e0c", lw * 1.3);
  const glow = c.createRadialGradient(mx + mw / 2, G - mh * .3, 2, mx + mw / 2, G - mh * .3, mw * .7);
  glow.addColorStop(0, "rgba(255,190,90,.55)"); glow.addColorStop(1, "rgba(255,190,90,0)");
  c.fillStyle = glow; c.fillRect(mx, my, mw, mh);

  p.circ(mx + mw / 2, G - mh * .04, mw * .42, mh * .08, "#e8798a", lw);

  const span = W + 120;

    const s = w.size * Math.max(.8, H / 700);
    const wx = (((w.x0 * span + w.sp * t) % span) + span) % span - 60, wy = G + H * .035;
    const step = (frame + i) % 2;
    p.line(wx - s * .3, wy - s * .4, wx - s * .3 + (step ? 5 : -5), wy + s * .15, lw);
    p.line(wx + s * .3, wy - s * .4, wx + s * .3 + (step ? -5 : 5), wy + s * .15, lw);
    if (w.horns) { p.line(wx - s * .5, wy - s * 1.6, wx - s * .7, wy - s * 2.05, lw); p.line(wx + s * .5, wy - s * 1.6, wx + s * .7, wy - s * 2.05, lw); }
    p.circ(wx, wy - s * .95, s * .75, s * .85, w.col, lw);
    const dir = w.sp > 0 ? 1 : -1;
    for (let e = 0; e < w.eyes; e++) {

  });
}
function tick() { frame++; drawTown(performance.now() / 1000); }
function startTown() { sizeTown(); tick(); if (!REDUCED && !townTimer) townTimer = setInterval(tick, 130); }

intro.addEventListener("pointermove", (e) => { eyeTarget = { x: e.clientX / TW, y: e.clientY / TH }; });
town.addEventListener("click", (e) => {
  if (mouth && e.clientX > mouth.x && e.clientX < mouth.x + mouth.w && e.clientY > mouth.y && e.clientY < mouth.y + mouth.h) enter();

/* jingle — only plays after someone taps */
let audio = null;
function jingle() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notes = [[392, .14], [392, .14], [659, .2], [523, .3], [0, .1], [392, .14], [392, .14], [659, .2], [523, .3], [0, .12],
      [440, .12], [523, .12], [587, .12], [659, .12], [784, .2], [659, .12], [784, .45]];
    let at = audio.currentTime + .05;
    notes.forEach(([f, d]) => {
      if (f) { const o = audio.createOscillator(), g = audio.createGain(); o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(.05, at); g.gain.exponentialRampToValueAtTime(.001, at + d * .95);
        o.connect(g).connect(audio.destination); o.start(at); o.stop(at + d); }
      at += d;
    });
  } catch (e) { /* no sound, no problem */ }
}

/* the jingle in the speech bubble */
const say = $("say"), enterBtn = $("enterBtn");
const LINES = ["<em>Monster Pizza!</em> ", "<em>Monster Pizza!</em><br>", "Come on in and get some <em>Monster Pizza!</em>"];
let typing = 0;
function typeJingle() {
  clearTimeout(typing); say.innerHTML = ""; enterBtn.setAttribute("data-wait", "");
  if (REDUCED) { say.innerHTML = LINES.join(""); enterBtn.removeAttribute("data-wait"); return; }
  let li = 0, ci = 0, done = "";
  const step = () => {
    const raw = LINES[li]; const plain = raw.replace(/<[^>]+>/g, "");
    ci++;
    // reveal by visible characters while keeping the tags intact
    let count = 0, out = "", inTag = false;
    for (const ch of raw) { if (ch === "<") inTag = true; if (inTag || count < ci) out += ch; if (!inTag) count++; if (ch === ">") inTag = false; }
    say.innerHTML = done + out;
    if (ci >= plain.length) { done += raw; li++; ci = 0;
      if (li >= LINES.length) { enterBtn.removeAttribute("data-wait"); return; }
      typing = setTimeout(step, 420); return; }
    typing = setTimeout(step, 48);
  };
  typing = setTimeout(step, 300);
}

const shutter = $("shutter");
let shutterUp = false, shutterTimer = 0;
function liftShutter(withSound) {
  if (shutterUp) return; shutterUp = true; clearTimeout(shutterTimer);
  shutter.classList.add("up"); shutter.setAttribute("tabindex", "-1");
  if (withSound) jingle();
  setTimeout(typeJingle, REDUCED ? 0 : 700);
  setTimeout(() => { shutter.hidden = true; }, REDUCED ? 0 : 1200);
}
shutter.addEventListener("click", () => liftShutter(true));
enterBtn.addEventListener("click", () => enter());

/* ============ the hallway ============ */
const hall = $("hall"), track = $("track"), lights = $("lights");
let U = 9, SEG = 1200, CAP = 540, current = 0;

function drawWall(ctx, w, h, seed, kind, gx, decorOnly) {
  const u = h / 100, R = seeded(seed * 977 + 13), p = pen(ctx, seed, u * .3), lw = Math.max(1.5, u * .45);
  if (!decorOnly) {
  // ceiling
  ctx.fillStyle = "#2b1d18"; ctx.fillRect(0, 0, w, 8 * u);
  // wallpaper
  const papers = [["#e9a93c", "#d18a26"], ["#e6a03a", "#cc7f24"], ["#eeb24b", "#d79a31"]];
  const [pa, pb] = papers[seed % 3];
  ctx.fillStyle = pa; ctx.fillRect(0, 8 * u, w, 50 * u);
  const sp = 10 * u;
  for (let x = Math.ceil(gx / sp) * sp - gx; x < w + sp; x += sp) {
    p.line(x, 8 * u, x, 57 * u, u * .9, pb, 1);
    for (let y = 14; y < 56; y += 9) { const yy = (y + ((Math.round((x + gx) / sp)) % 2) * 4.5) * u;
      ctx.fillStyle = "rgba(214,69,45,.55)"; ctx.beginPath(); ctx.arc(x + sp / 2, yy, u * .7, 0, 7); ctx.fill(); }
  }
  p.line(0, 8 * u, w, 8 * u, lw * 1.4);
  // chair rail + wainscot
  ctx.fillStyle = "#7a4a2a"; ctx.fillRect(0, 57 * u, w, 2.6 * u);
  p.line(0, 57 * u, w, 57 * u, lw); p.line(0, 59.6 * u, w, 59.6 * u, lw);
  ctx.fillStyle = "#3d8752"; ctx.fillRect(0, 59.6 * u, w, 21 * u);
  const pl = 6 * u;
  for (let x = Math.ceil(gx / pl) * pl - gx; x < w; x += pl) p.line(x, 60 * u, x, 80.5 * u, u * .35, "#2a6338", 1);
  ctx.fillStyle = "#2b1d18"; ctx.fillRect(0, 80.5 * u, w, 2.2 * u);
  p.line(0, 80.5 * u, w, 80.5 * u, lw);
  // checkered floor
  const rows = [[82.7, 85.8], [85.8, 89.6], [89.6, 94.2], [94.2, 100]];
  rows.forEach(([y0, y1], ri) => {
    const tw = (6 + ri * 1.6) * u;
    for (let col = Math.floor(gx / tw) - 1; col * tw - gx < w; col++) {
      ctx.fillStyle = (col + ri) % 2 ? "#f3e6c8" : "#2b1d18";
      ctx.fillRect(col * tw - gx, y0 * u, tw + 1, (y1 - y0) * u + 1);
    }
    p.line(0, y0 * u, w, y0 * u, u * .25, "rgba(31,21,18,.6)", 1);
  });
  }

  if (kind === "game") {
    if (decorOnly) return;
    // hanging lamp over the cabinet
    const cx = w / 2;
    const gl = ctx.createRadialGradient(cx, 14 * u, u, cx, 30 * u, 40 * u);
    gl.addColorStop(0, "rgba(255,235,170,.55)"); gl.addColorStop(1, "rgba(255,235,170,0)");
    ctx.fillStyle = gl; ctx.fillRect(cx - 45 * u, 8 * u, 90 * u, 50 * u);
    // a picture frame on the left
    const fw = (16 + R() * 8) * u, fh = (18 + R() * 9) * u, fx = cx - 22 * u - fw - (2 + R() * 6) * u, fy = (16 + R() * 6) * u;
    if (fx > 2 * u) {
      p.line(fx + fw / 2, fy, fx + fw * .2, 9 * u, u * .3, INK, 1); p.line(fx + fw / 2, fy, fx + fw * .8, 9 * u, u * .3, INK, 1);
      p.rect(fx - u, fy - u, fw + 2 * u, fh + 2 * u, "#7a4a2a", lw * 1.2);
      p.rect(fx + u * .4, fy + u * .4, fw - u * .8, fh - u * .8, "#fbf0d6", lw * .8);
      const pick = Math.floor(R() * 4), mx = fx + fw / 2, my = fy + fh / 2, s = Math.min(fw, fh) * .32;
      if (pick === 0) { // pizza slice
        p.shape([[mx - s, my - s * .8], [mx + s, my - s * .8], [mx, my + s * 1.1]], "#f4b63e", lw);
        p.line(mx - s, my - s * .8, mx + s, my - s * .8, u * 1.2, "#c8874a", 1);
        p.circ(mx - s * .3, my - s * .3, s * .17, 0, "#d6452d", lw * .6); p.circ(mx + s * .25, my - s * .1, s * .15, 0, "#d6452d", lw * .6);
        p.circ(mx, my + s * .4, s * .12, 0, "#d6452d", lw * .6);
      } else if (pick === 1) { // monster portrait
        p.circ(mx, my + s * .2, s * .95, s, "#9adf5e", lw);
        p.circ(mx - s * .35, my, s * .25, 0, "#fff", lw * .6); p.circ(mx + s * .35, my, s * .25, 0, "#fff", lw * .6);
        p.circ(mx - s * .35, my, s * .1, 0, INK, 0); p.circ(mx + s * .35, my, s * .1, 0, INK, 0);
        p.line(mx - s * .4, my + s * .55, mx + s * .4, my + s * .55, lw);
        p.line(mx - s * .7, my - s * .6, mx - s * .9, my - s * 1.1, lw); p.line(mx + s * .7, my - s * .6, mx + s * .9, my - s * 1.1, lw);
      } else if (pick === 2) { // night window
        p.rect(fx + u * .4, fy + u * .4, fw - u * .8, fh - u * .8, "#2a2147", lw * .8);
        p.circ(mx + s * .4, my - s * .4, s * .35, 0, "#fbf0d6", lw * .6);
        p.line(mx, fy + u * .4, mx, fy + fh - u * .4, lw); p.line(fx + u * .4, my, fx + fw - u * .4, my, lw);
      } else { // high score sheet
        for (let i = 0; i < 5; i++) p.line(fx + fw * .18, fy + fh * (.25 + i * .14), fx + fw * (.5 + R() * .3), fy + fh * (.25 + i * .14), lw * .7, INK, 1);
        p.line(fx + fw * .15, fy + fh * .12, fx + fw * .85, fy + fh * .12, lw * 1.4, "#d6452d", 1);

    p.rect(dx, dy, dw, dh, "#d6452d", lw * 1.2);
    p.rect(dx + 4 * u, dy + 5 * u, dw - 8 * u, 16 * u, "#2a2147", lw);
    p.circ(dx + dw - 4 * u, dy + dh * .58, 1.3 * u, 0, "#f4b63e", lw * .7);
    p.rect(dx + 2 * u, dy - 9 * u, dw - 4 * u, 6 * u, "#3d8752", lw);
    ctx.fillStyle = "#fbf0d6"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 ${3.6 * u}px "Gaegu", cursive`; ctx.fillText("← OUTSIDE", dx + dw / 2, dy - 5.8 * u);
  } else {
    // the end of the hall: a cabinet under a sheet
    const cx = w * .45;
    p.shape([[cx - 15 * u, 84 * u], [cx - 13 * u, 30 * u], [cx - 8 * u, 22 * u], [cx + 9 * u, 21 * u], [cx + 14 * u, 30 * u], [cx + 16 * u, 84 * u],
      [cx + 9 * u, 82 * u], [cx + 3 * u, 85 * u], [cx - 4 * u, 82 * u], [cx - 10 * u, 85 * u]], "#efe7d6", lw * 1.2);
    for (let i = 0; i < 4; i++) p.line(cx - 8 * u + i * 5 * u, 32 * u, cx - 10 * u + i * 6 * u, 80 * u, u * .3, "rgba(31,21,18,.35)", 1);
    p.rect(cx - 13 * u, 40 * u, 26 * u, 11 * u, "#fbf0d6", lw);
    ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 ${3.2 * u}px "Gaegu", cursive`;
    ctx.fillText("MORE GAMES", cx, 43.6 * u); ctx.fillText("COMING SOON", cx, 47.6 * u);
  }
}

function lightsPattern(u) {
  const w = Math.round(30 * u), h = Math.round(15 * u), cv = document.createElement("canvas");
  cv.width = w * DPR; cv.height = h * DPR;
  const c = cv.getContext("2d"); c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const p = pen(c, 5, u * .15);
  c.strokeStyle = INK; c.lineWidth = Math.max(1.5, u * .35);
  c.beginPath(); c.moveTo(0, 4 * u); c.quadraticCurveTo(w / 2, 10 * u, w, 4 * u); c.stroke();
  const bx = w / 2, by = 7 * u + 1.4 * u, col = ["#d6452d", "#f4b63e", "#59c3ff", "#9adf5e"];
  const glow = c.createRadialGradient(bx, by + u, 0, bx, by + u, 4.5 * u);
  glow.addColorStop(0, "rgba(255,220,140,.6)"); glow.addColorStop(1, "rgba(255,220,140,0)");
  c.fillStyle = glow; c.fillRect(bx - 5 * u, by - 4 * u, 10 * u, 10 * u);
  p.rect(bx - .8 * u, by - 1.6 * u, 1.6 * u, 1.4 * u, INK, 0);
  p.circ(bx, by + 1.2 * u, 1.3 * u, 1.8 * u, col[0], Math.max(1, u * .25));
  return { url: cv.toDataURL(), w, h };
}
let lightsPat = null;

function cabinetHTML(g, i) {
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  const note = `<div class="note"><span class="num">GAME ${String(i + 1).padStart(2, "0")}</span><h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p></div>`;
  if (g.cabinet) {
    const b = g.screenBox;
    const scr = g.screen && b ? `<span class="artscreen" style="left:${+b[0]}%;top:${+b[1]}%;width:${+b[2]}%;height:${+b[3]}%"><img src="${esc(g.screen)}" alt="" draggable="false" loading="lazy" onerror="this.parentNode.remove()"></span>` : "";
    return `
  <a class="cab art" href="${esc(g.url)}" target="_blank" rel="noopener" data-i="${i}" aria-label="Play ${esc(g.title)}">
    <span class="shadow"></span>
    <img class="cabimg" src="${esc(g.cabinet)}" alt="" draggable="false"
      onload="this.parentNode.style.setProperty('--ar', this.naturalWidth / this.naturalHeight)">
    ${scr}
  </a>${note}`;
  }
  return `
  <a class="cab" href="${esc(g.url)}" target="_blank" rel="noopener" data-i="${i}" style="--cab:${esc(g.color || "#2f7fd0")}" aria-label="Play ${esc(g.title)}">
    <span class="shadow"></span>
    <svg class="shell" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="body" vector-effect="non-scaling-stroke" points="4,0 96,0 96,18 88,21 88,57 98,64 98,100 2,100 2,64 12,57 12,21 4,18"/>
      <polygon class="side" points="12,21 18,21 18,57 12,57"/>
      <rect class="kick" x="2" y="94" width="96" height="6"/>
    </svg>
    <span class="marquee">${g.marquee ? `<img src="${esc(g.marquee)}" alt="" draggable="false">` : ""}<span ${g.marquee ? "hidden" : ""}>${esc(g.title)}</span></span>
    <span class="bezel"><span class="screen">
      ${g.screen ? `<img src="${esc(g.screen)}" alt="" draggable="false" loading="lazy">` : ""}
      <span class="attract" ${g.screen ? "hidden" : ""}><b>${esc(g.title)}</b><i>PRESS START</i></span>
    </span></span>
    <span class="panel"><i class="stick"></i><i class="btn"></i><i class="btn"></i></span>
    <span class="coin"><s></s><small>1 SLICE</small></span>
  </a>
  <div class="note"><span class="num">GAME ${String(i + 1).padStart(2, "0")}</span><h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p></div>`;
}

const io = new IntersectionObserver((entries) => {
  entries.forEach((en) => {
    if (!en.isIntersecting) return;
    const cv = en.target; io.unobserve(cv);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
    const c = cv.getContext("2d"); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawWall(c, w, h, +cv.dataset.seed, cv.dataset.kind, +cv.dataset.gx, cv.dataset.decor === "1");
  });
}, { root: hall, rootMargin: "0px 120% 0px 120%" });

function wallEl(kind, i, gx, src, decor) {
  if (src) { const im = new Image(); im.className = "wall"; im.alt = ""; im.draggable = false; im.src = src; return im; }
  const cv = document.createElement("canvas"); cv.className = "wall";
  cv.dataset.kind = kind; cv.dataset.seed = String(i + 1); cv.dataset.gx = String(gx); cv.dataset.decor = decor ? "1" : "";
  return cv;
}

/* your wall tiles: learn each one's shape before laying them down */
const TILES = (CFG.walls || []).map((w) => typeof w === "string" ? { src: w, weight: 1 } : { weight: 1, ...w });
const tilesReady = Promise.all(TILES.map((t) => new Promise((res) => {
  const im = new Image();
  im.onload = () => { t.aspect = im.naturalWidth / im.naturalHeight; res(); };
  im.onerror = () => { t.bad = true; res(); };
  im.src = t.src;
})));

function layTiles(total, H) {
  const tiles = TILES.filter((t) => !t.bad && t.aspect);
  const strip = document.createElement("div"); strip.id = "bgstrip"; strip.style.width = total + "px";
  const sum = tiles.reduce((s, t) => s + t.weight, 0);
  const plain = tiles.reduce((a, b) => (b.weight > a.weight ? b : a));
  const R = seeded(CFG.wallSeed || 2026);
  let x = 0, lastSpecial = true; // start on a plain wall
  while (x < total) {
    let t = plain;
    if (!lastSpecial) { let r = R() * sum; t = tiles.find((tt) => (r -= tt.weight) < 0) || plain; }
    lastSpecial = t !== plain;
    const im = new Image(); im.src = t.src; im.alt = ""; im.draggable = false; im.decoding = "async";
    strip.appendChild(im); x += H * t.aspect;
  }
  track.prepend(strip);
  if (CFG.floor) {
    const f = document.createElement("div"); f.id = "floor";
    const top = CFG.floorTop ?? 84;
    f.style.cssText = `width:${total}px;top:${top}%;background-image:url("${CFG.floor}");background-size:auto 100%`;
    strip.after(f);
  }
}

function build() {
  const H = hall.clientHeight || window.innerHeight;
  U = H / 100; SEG = Math.round(H * 4 / 3); CAP = Math.round(H * .6);
  document.documentElement.style.setProperty("--u", U + "px");
  io.disconnect(); track.innerHTML = "";
  const tiled = TILES.some((t) => !t.bad && t.aspect);
  let gx = 0;
  const add = (kind, w, i, src, inner) => {
    const seg = document.createElement("section"); seg.className = "seg"; seg.style.width = w + "px";
    // with your tiles behind everything, game walls are see-through and the ends only draw their door / sheet
    const wall = tiled && kind === "game" && !src ? null : wallEl(kind, i, gx, src, tiled);
    if (wall) seg.appendChild(wall);
    if (inner) seg.insertAdjacentHTML("beforeend", inner);
    track.appendChild(seg); if (wall && wall.tagName === "CANVAS") io.observe(wall);
    gx += w; return seg;
  };
  const left = add("left", CAP, 0, CFG.leftCap, `<button class="exitdoor" aria-label="Back outside"></button>`);
  left.querySelector(".exitdoor").addEventListener("click", () => leave());
  GAMES.forEach((g, i) => {
    const seg = add("game", SEG, i, "", cabinetHTML(g, i));
    seg.id = g.id || ("game-" + (i + 1));
    seg.setAttribute("aria-label", g.title);
  });
  add("right", CAP, GAMES.length + 1, CFG.rightCap, "");
  if (tiled) layTiles(gx, H);
  // broken images fall back to the drawn versions
  track.querySelectorAll(".marquee img").forEach((im) => im.addEventListener("error", () => { im.nextElementSibling.hidden = false; im.remove(); }));
  track.querySelectorAll(".screen img").forEach((im) => im.addEventListener("error", () => { im.nextElementSibling.hidden = false; im.remove(); }));
  track.querySelectorAll(".seg > img.wall").forEach((im) => im.addEventListener("error", () => {
    const seg = im.parentElement, idx = [...track.children].indexOf(seg);
    const kind = idx === 0 ? "left" : idx === track.children.length - 1 ? "right" : "game";
    let off = 0; for (let k = 0; k < idx; k++) off += track.children[k].offsetWidth;
    const cv = wallEl(kind, idx, off, ""); im.replaceWith(cv); io.observe(cv);
  }));
  lightsPat = lightsPattern(U);
  lights.style.backgroundImage = `url(${lightsPat.url})`;
  lights.style.backgroundSize = `${lightsPat.w}px ${lightsPat.h}px`;
  onScroll();
}

function centerOn(i, smooth) {
  if (!GAMES.length) return;
  i = Math.max(0, Math.min(GAMES.length - 1, i));
  const x = CAP + i * SEG + SEG / 2 - hall.clientWidth / 2;
  hall.scrollTo({ left: x, behavior: smooth && !REDUCED ? "smooth" : "auto" });
}
let scrollRaf = 0;
function onScroll() {
  cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(() => {
    const mid = hall.scrollLeft + hall.clientWidth / 2;
    current = Math.max(0, Math.min(GAMES.length - 1, Math.floor((mid - CAP) / SEG)));
    $("count").textContent = GAMES.length ? `${current + 1} / ${GAMES.length}` : "0 / 0";
    $("prev").disabled = current <= 0; $("next").disabled = current >= GAMES.length - 1;
    lights.style.backgroundPosition = `${-hall.scrollLeft * 1.25}px 0`;
    document.querySelectorAll("#menuList button").forEach((b, k) => b.setAttribute("aria-current", String(k === current)));
  });
}
hall.addEventListener("scroll", onScroll, { passive: true });

// mouse wheel up/down walks the hallway sideways
hall.addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { hall.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 30 : 1); e.preventDefault(); }
}, { passive: false });

// click-and-drag with a mouse (touch already swipes natively)
let drag = null, justDragged = false;
hall.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  drag = { x: e.clientX, s: hall.scrollLeft, moved: false };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; hall.classList.add("dragging"); }
  if (drag.moved) hall.scrollLeft = drag.s - dx;
});
window.addEventListener("pointerup", () => {
  if (!drag) return; justDragged = drag.moved; drag = null; hall.classList.remove("dragging");
  setTimeout(() => { justDragged = false; }, 0);
});
hall.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { centerOn(current + 1, true); e.preventDefault(); }
  if (e.key === "ArrowLeft") { centerOn(current - 1, true); e.preventDefault(); }
});
$("prev").addEventListener("click", () => centerOn(current - 1, true));
$("next").addEventListener("click", () => centerOn(current + 1, true));

/* playing a game */
const player = $("player"), frameEl = $("frame");
const host = location.hostname;
const CAN_EMBED = CFG.openInPage ?? (host === "" || host === "localhost" || /^127\./.test(host) || /github\.io$/.test(host));
track.addEventListener("click", (e) => {
  const cab = e.target.closest(".cab");
  if (!cab) return;
  if (justDragged) { e.preventDefault(); return; }
  const g = GAMES[+cab.dataset.i];
  if (!CAN_EMBED || !g || !g.url) return; // falls through to a normal new-tab link
  e.preventDefault();
  $("playerTitle").textContent = g.title; $("playerOpen").href = g.url;
  frameEl.src = g.url; player.hidden = false; $("closePlayer").focus();
});
function closePlayer() { player.hidden = true; frameEl.src = "about:blank"; hall.focus({ preventScroll: true }); }
$("closePlayer").addEventListener("click", closePlayer);

/* menu */
const burger = $("burger"), menu = $("menu");
$("menuList").innerHTML = GAMES.map((g, i) =>
  `<li><button data-i="${i}"><span class="chip" style="background:${g.color || "#2f7fd0"}"></span>${g.title.replace(/</g, "&lt;")}<span class="num">${String(i + 1).padStart(2, "0")}</span></button></li>`).join("");
function setMenu(open) { menu.hidden = !open; burger.setAttribute("aria-expanded", String(open)); }
burger.addEventListener("click", (e) => { e.stopPropagation(); setMenu(menu.hidden); });
$("menuList").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; setMenu(false); centerOn(+b.dataset.i, true); });
$("menuOutside").addEventListener("click", () => { setMenu(false); leave(); });
$("logoBtn").addEventListener("click", () => leave());
document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!player.hidden) closePlayer(); else if (!menu.hidden) setMenu(false);
});

/* switching between outside and inside */
function showHall(on) {
  ["hall", "lights", "topbar", "nav"].forEach((id) => { $(id).hidden = !on; });
  intro.hidden = on;
}
let built = false;
function enter(target) {
  if (!shutterUp) liftShutter(false);
  const go = () => tilesReady.then(() => {
    stopTown(); showHall(true);
    if (!built) { build(); built = true; }
    const idx = typeof target === "number" ? target : 0;
    centerOn(idx, false); hall.focus({ preventScroll: true });
    intro.classList.remove("entering");
    try { history.replaceState(null, "", "#arcade"); } catch (e) {}
  });
  if (REDUCED || typeof target === "number") return go();
  intro.classList.add("entering");
  setTimeout(go, 850);
}
function leave() {
  setMenu(false); showHall(false); startTown();
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}

window.addEventListener("hashchange", () => {
  const h = decodeURIComponent(location.hash.slice(1)), k = GAMES.findIndex((g) => g.id === h);
  if (k < 0) return;
  if (hall.hidden) { shutterUp = true; shutter.hidden = true; enter(k); } else centerOn(k, true);
});

let resizeT = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!intro.hidden) { sizeTown(); drawTown(performance.now() / 1000); }
    if (!hall.hidden) { const keep = current; build(); centerOn(keep, false); } else built = false;
  }, 150);
});

/* start */
const fontsReady = document.fonts && document.fonts.load ? Promise.all([
  document.fonts.load('40px "Rubik Doodle Shadow"'), document.fonts.load('700 20px "Gaegu"')]).catch(() => {}) : Promise.resolve();
const hash = decodeURIComponent(location.hash.slice(1));
const deep = GAMES.findIndex((g) => g.id === hash);
startTown();
fontsReady.then(() => {
  if (!intro.hidden) drawTown(performance.now() / 1000);
  if (hash === "arcade" || deep >= 0) { shutterUp = true; shutter.hidden = true; enter(Math.max(0, deep)); return; }
  shutterTimer = setTimeout(() => liftShutter(false), REDUCED ? 0 : 1400);
});
})();
</script>
</body>
</html>
