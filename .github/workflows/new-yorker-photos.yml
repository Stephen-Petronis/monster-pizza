name: New Yorker photos

# Downloads the landmark photos from Wikimedia Commons, makes crisp WebP copies,
# and saves them (plus credits and a review contact sheet) into the repo.
# Runs when the landmark list or the script changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - "games/you-call-yourself-a-new-yorker/landmarks.json"
      - "games/you-call-yourself-a-new-yorker/tools/fetch_photos.py"
      - ".github/workflows/new-yorker-photos.yml"

permissions:
  contents: write

concurrency:
  group: new-yorker-photos
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Fetch + optimize photos
        run: python3 games/you-call-yourself-a-new-yorker/tools/fetch_photos.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A games/you-call-yourself-a-new-yorker/photos games/you-call-yourself-a-new-yorker/photos.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "New Yorker game: refresh photos"
          git pull --rebase origin main
          git push origin HEAD:main
